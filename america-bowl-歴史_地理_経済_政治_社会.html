<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U.S. History, Geography/Economy & Politics/Society 500 Quiz & Listening Trainer</title>
<style>
  :root { --navy: #0a2540; --red: #d9381e; --blue: #1d4ed8; --bg: #f4f6f9; --correct: #16a34a; --wrong: #dc2626; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 16px; }
  .container { max-width: 880px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 24px; }
  h1 { margin: 0 0 8px; color: var(--navy); font-size: 1.5rem; text-align: center; }
  .subtitle { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
  .audio-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; background: #eff6ff; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #bfdbfe; }
  select, input[type="number"], .btn-ctrl { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.88rem; cursor: pointer; background: #fff; font-weight: 600; }
  .btn-ctrl.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-ctrl.accent { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-ctrl.audio { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-ctrl.active-toggle { background: #0f766e; color: #fff; border-color: #0f766e; }
  .status-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; font-size: 0.95rem; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: #dbeafe; color: var(--blue); }
  .badge.bonus { background: #fef3c7; color: #b45309; margin-left: 6px; }
  .question-box { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin: 16px 0; color: #0f172a; min-height: 3.2rem; }
  .question-box.blind { background: #f1f5f9; color: #475569; border: 2px dashed #94a3b8; border-radius: 8px; padding: 16px; text-align: center; font-weight: 500; }
  .options { display: grid; gap: 10px; margin-bottom: 16px; }
  .opt-btn { text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid #e2e8f0; background: #fff; font-size: 1rem; cursor: pointer; transition: 0.15s; font-weight: 500; color: #1e293b; }
  .opt-btn:hover:not(:disabled) { border-color: var(--blue); background: #eff6ff; }
  .opt-btn.correct { border-color: var(--correct); background: #dcfce7; color: #14532d; font-weight: 700; }
  .opt-btn.wrong { border-color: var(--wrong); background: #fee2e2; color: #7f1d1d; }
  .feedback { display: none; padding: 14px 16px; border-radius: 10px; background: #f1f5f9; margin-bottom: 16px; line-height: 1.5; font-size: 0.95rem; border-left: 5px solid var(--navy); }
  .nav-bar { display: flex; justify-content: space-between; gap: 10px; }
  .nav-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; }
  .nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .result-screen { display: none; text-align: center; padding: 20px 0; }
  .score-big { font-size: 2.4rem; font-weight: 800; color: var(--navy); margin: 12px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>🏛️ アメリカ歴史 / 地理・経済 / 政治・社会 500問統合トレーナー</h1>
  <div class="subtitle">全500問（歴史100問＋地理・経済200問＋政治・社会200問）4択＆英語リスニング演習システム</div>

  <div class="controls">
    <select id="catSelect" onchange="startCategoryMode()">
      <option value="ALL">全24分野 (500問すべて)</option>
      <optgroup label="大分類でまとめて選択">
        <option value="GROUP_HISTORY">【大分類①】アメリカの歴史 (全100問: #1–#100)</option>
        <option value="GROUP_GEOECON">【大分類②】アメリカの地理・経済 (全200問: #101–#300)</option>
        <option value="GROUP_POLSOC">【大分類③】アメリカの政治・社会 (全200問: #301–#500)</option>
      </optgroup>
      <optgroup label="① アメリカの歴史 (100問)">
        <option value="0">1. 歴史①：植民地時代 (1492–1765) (12問)</option>
        <option value="1">2. 歴史②：独立戦争と建国 (1770–1791) (13問)</option>
        <option value="2">3. 歴史③：初期共和国・西部開拓 (1797–1849) (13問)</option>
        <option value="3">4. 歴史④：南北戦争と再建期 (1848–1867) (12問)</option>
        <option value="4">5. 歴史⑤：産業化・革新主義・WWI (1869–1919) (12問)</option>
        <option value="5">6. 歴史⑥：1920年代・恐慌・WWII (1920–1945) (12問)</option>
        <option value="6">7. 歴史⑦：冷戦・公民権・宇宙開発 (1946–1979) (14問)</option>
        <option value="7">8. 歴史⑧：冷戦終結・現代アメリカ (1980–現在) (12問)</option>
      </optgroup>
      <optgroup label="② アメリカの地理・経済 (200問)">
        <option value="8">9. 地理①：国土・山脈・河川・湖・気候 (25問)</option>
        <option value="9">10. 地理②：国立公園・自然遺産・名所 (25問)</option>
        <option value="10">11. 地理③：50州ランキング・位置・愛称 (25問)</option>
        <option value="11">12. 地理④：主要都市・州都・地域区分 (25問)</option>
        <option value="12">13. 経済①：紙幣・硬貨・FRB・税制 (25問)</option>
        <option value="13">14. 経済②：ウォール街・株価指数・経済史 (25問)</option>
        <option value="14">15. 経済③：主要産業・農業・資源・貿易 (25問)</option>
        <option value="15">16. 経済④：代表的企業・創業者・労働政策 (25問)</option>
      </optgroup>
      <optgroup label="③ アメリカの政治・社会 (200問)">
        <option value="16">17. 政治①：合衆国憲法と基本原理 (25問)</option>
        <option value="17">18. 政治②：憲法修正条項（第1条〜第27条）(25問)</option>
        <option value="18">19. 政治③：大統領職・行政府・内閣 (25問)</option>
        <option value="19">20. 政治④：歴代大統領の業績と人物像 (25問)</option>
        <option value="20">21. 政治⑤：大統領選挙・選挙人団・二大政党 (25問)</option>
        <option value="21">22. 政治⑥：連邦議会（上院・下院）と立法過程 (25問)</option>
        <option value="22">23. 政治⑦：連邦最高裁判所と歴史的判例 (25問)</option>
        <option value="23">24. 政治⑧：現代アメリカを分断する社会問題 (25問)</option>
      </optgroup>
    </select>
    <button class="btn-ctrl primary" onclick="startShuffleAll()">シャッフル全500問</button>
    <button class="btn-ctrl accent" onclick="startMockExam()">模擬試験 (40問+ボーナス5問)</button>
    <button class="btn-ctrl" id="retryBtn" onclick="startRetryWrong()" style="display:none;">間違えた問題だけ復習</button>
    <span style="display:inline-flex; align-items:center; gap:4px;">
      <input type="number" id="jumpInput" min="1" max="500" placeholder="番号(1-500)" style="width:95px;">
      <button class="btn-ctrl" onclick="jumpToQuestion()">移動</button>
    </span>
  </div>

  <div class="audio-bar">
    <button class="btn-ctrl audio" onclick="speakCurrentQuestion(false)">🔊 問題文を読み上げ</button>
    <button class="btn-ctrl audio" onclick="speakCurrentQuestion(true)">🔊 問題＋選択肢を読み上げ</button>
    <button class="btn-ctrl" onclick="stopSpeech()">⏹ 停止</button>
    <button class="btn-ctrl" id="autoSpeakBtn" onclick="toggleAutoSpeak()">自動読み上げ: OFF</button>
    <button class="btn-ctrl" id="blindModeBtn" onclick="toggleBlindMode()">🙈 リスニング専念: OFF</button>
    <select id="rateSelect" title="読み上げ速度">
      <option value="0.85">速度 0.85x (ゆっくり)</option>
      <option value="1.0" selected>速度 1.0x (標準)</option>
      <option value="1.15">速度 1.15x (速め)</option>
    </select>
  </div>

  <div id="quizArea">
    <div class="status-bar">
      <div>
        <span id="qProgress">Q 1 / 500</span>
        <span id="qCat" class="badge">1. 歴史①：植民地時代</span>
        <span id="qBonus" class="badge bonus" style="display:none;">★BONUS 3pts</span>
      </div>
      <div id="scoreDisplay">Score: 0</div>
    </div>
    <div id="questionText" class="question-box"></div>
    <div id="optionsContainer" class="options"></div>
    <div id="feedbackBox" class="feedback"></div>
    <div class="nav-bar">
      <button class="nav-btn" id="prevBtn" onclick="prevQuestion()">← 前の問題</button>
      <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen">
    <h2>演習結果</h2>
    <div id="finalScore" class="score-big"></div>
    <p id="finalComment"></p>
    <button class="btn-ctrl primary" onclick="startCategoryMode()">最初からやり直す</button>
    <button class="btn-ctrl accent" id="retryBtnEnd" onclick="startRetryWrong()">間違えた問題を復習する</button>
  </div>
</div>

<script>
const CATS = [
  "1. 歴史①：植民地時代", "2. 歴史②：独立戦争と建国", "3. 歴史③：初期共和国・西部開拓", "4. 歴史④：南北戦争と再建期",
  "5. 歴史⑤：産業化・革新主義・WWI", "6. 歴史⑥：1920年代・恐慌・WWII", "7. 歴史⑦：冷戦・公民権・宇宙開発", "8. 歴史⑧：冷戦終結・現代アメリカ",
  "9. 地理①：地形・山脈・河川", "10. 地理②：国立公園・自然遺産", "11. 地理③：50州ランキング・特徴", "12. 地理④：主要都市・州都・地域",
  "13. 経済①：通貨・FRB・税制", "14. 経済②：金融市場・経済史", "15. 経済③：産業・農業・貿易", "16. 経済④：企業・創業者・労働",
  "17. 政治①：憲法の基本原理", "18. 政治②：憲法修正条項", "19. 政治③：大統領職と行政府", "20. 政治④：歴代大統領の業績",
  "21. 政治⑤：大統領選挙と政党", "22. 政治⑥：連邦議会と立法", "23. 政治⑦：最高裁と重要判例", "24. 政治⑧：現代社会の分断問題"
];

// [catIdx, question, [optA, optB, optC, optD], ansIdx, explanation]
const RAW_DATA = [
  // ==================== PART 1: アメリカの歴史 (100問: #1–#100) ====================
  // 1. 植民地時代 (#1–#12)
  [0,"In what year did Christopher Columbus reach the Americas with Spanish support?",["1492","1588","1607","1620"],0,"クリストファー・コロンブスはスペインの支援を受け、1492年に西インド諸島（アメリカ大陸海域）に到達しました。"],
  [0,"Where was the first permanent English colony in North America established in 1607?",["Plymouth, Massachusetts","Jamestown, Virginia","Savannah, Georgia","Providence, Rhode Island"],1,"1607年にバージニアに設立されたジェームズタウンが、北米におけるイギリス最初の恒久的植民地です。"],
  [0,"Who introduced commercial tobacco cultivation to the Jamestown colony and married Pocahontas?",["John Smith","John Rolfe","William Bradford","Walter Raleigh"],1,"ジョン・ロルフがバージニア植民地にタバコ栽培を導入して経済的基盤を築き、先住民のポカホンタスと結婚しました。"],
  [0,"In what year was the House of Burgesses, the first representative assembly in America, established in Virginia?",["1607","1619","1636","1689"],1,"1619年にバージニア植民地でアメリカ最初の代議制議会（House of Burgesses）が設立されました。"],
  [0,"Which ship carried the Pilgrim Fathers to Plymouth, Massachusetts in 1620?",["Santa Maria","Mayflower","Half Moon","Constitution"],1,"ピルグリム・ファーザーズは1620年にメイフラワー号（Mayflower）に乗ってプリマスに到着しました。"],
  [0,"What self-governing agreement did the Pilgrims sign aboard their ship in November 1620?",["Fundamental Orders","Mayflower Compact","Albany Plan of Union","Olive Branch Petition"],1,"上陸前に船上で署名された自治誓約は「メイフラワー誓約（Mayflower Compact）」と呼ばれます。"],
  [0,"Which Native American tribe helped the Plymouth colonists survive and shared the 1621 harvest feast that inspired Thanksgiving?",["Cherokee","Sioux","Wampanoag","Apache"],2,"ワンパノアグ族（Wampanoag）がプリマスの入植者に農耕などを教え、1621年の収穫祭（感謝祭の起源）を共に祝いました。"],
  [0,"Who led the Puritans to found the Massachusetts Bay Colony in 1630 and described it as a 'City upon a Hill'?",["John Winthrop","Jonathan Edwards","Cotton Mather","Thomas Hooker"],0,"ジョン・ウィンスロップは1630年にマサチューセッツ湾植民地を指導し、「丘の上の町（City upon a Hill）」と表現しました。"],
  [0,"Who founded the colony of Rhode Island in 1636 based on the principles of religious freedom and separation of church and state?",["Roger Williams","Lord Baltimore","James Oglethorpe","Peter Stuyvesant"],0,"ロジャー・ウィリアムズは政教分離と信教の自由を掲げ、1636年にロードアイランド植民地を創設しました。"],
  [0,"In which city and colony was Harvard College, the oldest institution of higher learning in the U.S., founded in 1636?",["New Haven, Connecticut","Williamsburg, Virginia","Cambridge, Massachusetts","Princeton, New Jersey"],2,"アメリカ最古の大学であるハーバード大学は1636年にマサチューセッツ湾植民地のケンブリッジに設立されました。"],
  [0,"Which Quaker leader founded the colony of Pennsylvania in 1681 as a haven for religious tolerance?",["William Penn","George Fox","Benjamin Franklin","William Bradford"],0,"クエーカー教徒のウィリアム・ペンが1681年にペンシルベニア植民地を建設し、フィラデルフィアを設計しました。"],
  [0,"Which war from 1754 to 1763 was fought between Britain and France for control of North America?",["King Philip's War","French and Indian War","War of 1812","Pontiac's War"],1,"1754〜1763年のフレンチ・インディアン戦争（七年戦争の北米戦線）でイギリスがフランスを破り、北米の覇権を握りました。"],

  // 2. 独立戦争と建国 (#13–#25)
  [1,"Which slogan emerged among American colonists in opposition to Britain's Stamp Act of 1765?",["In God We Trust","No taxation without representation","Don't Tread on Me","Remember the Alamo"],1,"1765年の印紙法（Stamp Act）に対し、植民地側は「代表なくして課税なし」のスローガンで反発しました。"],
  [1,"In which city did British soldiers fatally shoot five colonists during a March 1770 confrontation?",["New York City","Philadelphia","Boston","Charleston"],2,"1770年3月にボストンでイギリス兵が市民に発砲し5名が死亡した事件は「ボストン虐殺事件（Boston Massacre）」と呼ばれます。"],
  [1,"In 1773, members of the Sons of Liberty protested the Tea Act by dumping tea into which harbor?",["Boston Harbor","New York Harbor","Baltimore Harbor","Savannah Harbor"],0,"1773年12月のボストン茶会事件（Boston Tea Party）では、ボストン港で東インド会社の茶箱が海に投棄されました。"],
  [1,"In which city did the First Continental Congress convene in September 1774?",["Boston","Philadelphia","Richmond","Annapolis"],1,"1774年9月の第1回大陸会議はペンシルベニア植民地のフィラデルフィアで開催されました。"],
  [1,"Where in Massachusetts did the first military battles of the American Revolutionary War take place in April 1775?",["Saratoga and Ticonderoga","Lexington and Concord","Trenton and Princeton","Yorktown and Jamestown"],1,"1775年4月19日のレキシントン・コンコードの戦いでアメリカ独立戦争の火蓋が切られました。"],
  [1,"Who was appointed Commander-in-Chief of the Continental Army in 1775 and later became the first U.S. President?",["John Adams","Thomas Jefferson","George Washington","Alexander Hamilton"],2,"ジョージ・ワシントンは1775年に第2回大陸会議で大陸軍総司令官に任命され、後に初代大統領となりました。"],
  [1,"Who published the bestselling pamphlet 'Common Sense' in January 1776 advocating immediate independence from Britain?",["Patrick Henry","Thomas Paine","Samuel Adams","John Jay"],1,"トマス・ペインが1776年1月に発表した『コモン・センス』は、植民地人の独立への世論を決定づけました。"],
  [1,"Who was the primary author of the Declaration of Independence adopted on July 4, 1776?",["Benjamin Franklin","Thomas Jefferson","James Madison","John Hancock"],1,"1776年7月4日に採択されたアメリカ独立宣言は、主にトーマス・ジェファソンによって起草されました。"],
  [1,"Which 1777 battle in New York was the major turning point of the Revolutionary War that led France to openly ally with the U.S.?",["Battle of Bunker Hill","Battle of Saratoga","Battle of Cowpens","Battle of Monmouth"],1,"1777年のサラトガの戦いでの勝利が独立戦争の転換点となり、フランスがアメリカ側として参戦しました。"],
  [1,"Which 1781 battle in Virginia was the final decisive battle of the American Revolutionary War?",["Battle of Yorktown","Battle of Camden","Battle of Germantown","Battle of Long Island"],0,"1781年のヨークタウンの戦いで米仏連合軍がイギリス軍のコーンウォリス将軍を降伏させ、事実上戦争が終結しました。"],
  [1,"Which 1783 treaty officially ended the American Revolutionary War and recognized the independence of the United States?",["Treaty of Ghent","Treaty of Paris","Treaty of Utrecht","Jay Treaty"],1,"1783年のパリ条約（Treaty of Paris）によってイギリスの13植民地の独立とミシシッピ川以東の領土が承認されました。"],
  [1,"In what year was the United States Constitution drafted at the Constitutional Convention in Philadelphia?",["1776","1781","1787","1791"],2,"アメリカ合衆国憲法は1787年のフィラデルフィア憲法制定会議で起草されました。"],
  [1,"What are the first ten amendments to the U.S. Constitution, ratified in 1791, collectively called?",["Articles of Confederation","Bill of Rights","Federalist Papers","Northwest Ordinance"],1,"1791年に批准された合衆国憲法の最初の10か条の修正条項は「権利章典（Bill of Rights）」と呼ばれます。"],

  // 3. 初期共和国・西部開拓 (#26–#38)
  [2,"Who served as the first Secretary of the Treasury under President George Washington and founded the national bank?",["Thomas Jefferson","Alexander Hamilton","Henry Knox","Edmund Randolph"],1,"初代財務長官はアレクサンダー・ハミルトンで、公債の引き受けや第一合衆国銀行の設立を推進しました。"],
  [2,"Which 4th U.S. President is known as the 'Father of the Constitution' for his central role in drafting the Constitution and Bill of Rights?",["John Adams","James Madison","James Monroe","John Quincy Adams"],1,"第4代大統領ジェームズ・マディソンは、合衆国憲法と権利章典の起草における貢献から「憲法の父」と呼ばれます。"],
  [2,"In what year did the United States double its territory through the Louisiana Purchase?",["1795","1803","1812","1819"],1,"1803年、ジェファソン政権下でルイジアナ買収が行われ、アメリカの領土はほぼ2倍に拡大しました。"],
  [2,"From which country did the United States purchase the Louisiana Territory in 1803?",["Spain","United Kingdom","France","Russia"],2,"アメリカはナポレオン政権下のフランスから1,500万ドルでルイジアナ領土を買収しました。"],
  [2,"Who led the 1804–1806 Corps of Discovery expedition commissioned by Thomas Jefferson to explore the Louisiana Territory to the Pacific?",["Lewis and Clark","Mason and Dixon","Fremont and Carson","Pike and Coronado"],0,"メリウェザー・ルイスとウィリアム・クラークの探検隊（Lewis and Clark）が先住民サカガウィアの案内を得て太平洋岸まで到達しました。"],
  [2,"Which 1803 Supreme Court case led by Chief Justice John Marshall established the power of Judicial Review?",["McCulloch v. Maryland","Marbury v. Madison","Gibbons v. Ogden","Fletcher v. Peck"],1,"1803年のマーベリー対マディソン事件によって、連邦最高裁判所による違憲立法審査権（Judicial Review）が確立されました。"],
  [2,"Which conflict between the United States and Britain inspired Francis Scott Key to write 'The Star-Spangled Banner'?",["Revolutionary War","Quasi-War","War of 1812","Mexican-American War"],2,"米英戦争（War of 1812）中の1814年、ボルティモアのマクヘンリー要塞防衛戦を見て国歌『星条旗』の歌詞が書かれました。"],

  [8,"What is the highest mountain peak in North America (elevation 6,190 m), located in Alaska?",["Mount Whitney","Denali","Mount Rainier","Mount Elbert"],1,"北米最高峰はアラスカ州にあるデナリ山（旧称マッキンリー、標高6,190m）です。"],
  [8,"Which peak in California's Sierra Nevada (elevation 4,421 m) is the highest mountain in the contiguous 48 states?",["Mount Shasta","Mount Whitney","Pikes Peak","Half Dome"],1,"アラスカを除いた本土48州の最高峰は、カリフォルニア州シエラネバダ山脈にあるホイットニー山（4,421m）です。"],
  [8,"Which major mountain range extends over 3,000 miles from New Mexico through Colorado and Montana into western Canada, forming the Continental Divide?",["Appalachian Mountains","Rocky Mountains","Cascade Range","Ozark Mountains"],1,"北米大陸の西部を南北に縦断し、太平洋水系と大西洋水系を分ける大陸分水嶺となっているのはロッキー山脈です。"],
  [8,"Which ancient mountain system runs along the eastern United States from Alabama and Georgia up to Maine and Canada?",["Rocky Mountains","Sierra Nevada","Appalachian Mountains","Coast Ranges"],2,"北米東部を南北に連なるなだらかな古期造山帯の山脈はアパラチア山脈（ブルーリッジ山脈などを含む）です。"],
  [8,"Which mountain range in eastern California is home to Lake Tahoe, Yosemite Valley, and giant sequoia trees?",["Cascade Range","Sierra Nevada","Catskill Mountains","Adirondack Mountains"],1,"カリフォルニア州東部に連なり、ヨセミテやタホ湖を擁する山脈はシエラネバダ山脈です。"],
  [8,"Which volcanic mountain range in the Pacific Northwest (Washington, Oregon, and Northern California) includes Mount Rainier and Mount Hood?",["Cascade Range","Black Hills","Teton Range","Brooks Range"],0,"太平洋岸北西部のワシントン州・オレゴン州・カリフォルニア州北部に連なる火山脈はカスケード山脈です。"],
  [8,"Which active volcano in Washington State erupted catastrophically in May 1980?",["Mauna Loa","Mount St. Helens","Mount Rainier","Mount Hood"],1,"1980年5月に大噴火を起こしたワシントン州カスケード山脈の火山はセント・ヘレンズ山（Mount St. Helens）です。"],
  [8,"What is the longest river in the United States (approx. 3,767 km), which flows from Montana and joins the Mississippi River near St. Louis?",["Mississippi River","Missouri River","Colorado River","Rio Grande"],1,"アメリカ合衆国で最も長い川は、ミシシッピ川最大の支流であるミズーリ川（Missouri River）です。"],
  [8,"Which iconic river begins at Lake Itasca in Minnesota and flows southward to empty into the Gulf of Mexico in Louisiana?",["Missouri River","Mississippi River","Ohio River","Hudson River"],1,"ミネソタ州のイタスカ湖を源流とし、ニューオーリンズを経てメキシコ湾に注ぐ北米最大の水系はミシシッピ川です。"],
  [8,"Which river forms the natural international border between the state of Texas and Mexico?",["Colorado River","Rio Grande","Brazos River","Pecos River"],1,"テキサス州とメキシコの国境を流れてメキシコ湾に注ぐ河川はリオ・グランデ川（Rio Grande）です。"],
  [8,"Which major river of the American Southwest carved the Grand Canyon and is impounded by the Hoover Dam?",["Snake River","Colorado River","Columbia River","Sacramento River"],1,"ロッキー山脈に端を発し、グランドキャニオンを削り出しフーバーダムを潤す南西部の大河はコロラド川です。"],
  [8,"Which river flows south through eastern New York State past Manhattan into Upper New York Bay?",["Potomac River","Delaware River","Hudson River","Charles River"],2,"ニューヨーク州を南下し、マンハッタン島の西側を流れてニューヨーク湾に注ぐのはハドソン川です。"],
  [8,"Which major river in the Pacific Northwest forms much of the border between Washington State and Oregon before emptying into the Pacific?",["Columbia River","Yukon River","Snake River","Willamette River"],0,"ワシントン州とオレゴン州の州境を流れて太平洋に注ぐ北西部最大の大河はコロンビア川です。"],
  [8,"Which major river begins in Pittsburgh, Pennsylvania and flows southwest to join the Mississippi River at Cairo, Illinois?",["Tennessee River","Ohio River","Wabash River","Cumberland River"],1,"ピッツバーグで合流して始まり、イリノイ州南端でミシシッピ川に合流する東部の重要河川はオハイオ川です。"],
  [8,"What are the five interconnected freshwater lakes on the U.S.–Canada border (Superior, Michigan, Huron, Erie, and Ontario) collectively called?",["Finger Lakes","The Great Lakes","Boundary Waters","Chain of Lakes"],1,"アメリカとカナダの国境付近に広がる5つの巨大淡水湖群は「五大湖（The Great Lakes）」と呼ばれます。"],
  [8,"Which of the five Great Lakes has the largest surface area and greatest depth, making it the largest freshwater lake in the world by area?",["Lake Michigan","Lake Huron","Lake Superior","Lake Erie"],2,"五大湖のなかで最も面積が広く水深も深いのはスペリオル湖（Lake Superior）で、面積では世界最大の淡水湖です。"],
  [8,"Which is the only one of the five Great Lakes located entirely within the borders of the United States (not shared with Canada)?",["Lake Erie","Lake Ontario","Lake Michigan","Lake Huron"],2,"五大湖のうち、カナダと接しておらず全域がアメリカ領内にある唯一の湖はミシガン湖（Lake Michigan）です。"],
  [8,"Which large remnant lake in northern Utah is the largest saltwater lake in the Western Hemisphere?",["Lake Tahoe","Great Salt Lake","Salton Sea","Crater Lake"],1,"ユタ州北部にあるグレートソルト湖（Great Salt Lake）は、西半球最大の塩湖です。"],
  [8,"Where in California's Mojave Desert is the lowest, hottest, and driest point in North America (Badwater Basin, 86 meters below sea level) located?",["Monument Valley","Death Valley","Imperial Valley","Napa Valley"],1,"カリフォルニア州東部のモハーヴェ砂漠にあるデスバレー（Death Valley）は海抜マイナス86mで、北米で最も標高が低く最も暑い地点です。"],
  [8,"Which desert region covering most of Nevada and western Utah between the Sierra Nevada and the Wasatch Range is the largest U.S. desert by area?",["Sonoran Desert","Chihuahuan Desert","Great Basin Desert","Painted Desert"],2,"ネバダ州を中心に広がるグレートベースン砂漠（Great Basin Desert）は、アメリカ最大の面積を持つ内陸乾燥盆地です。"],
  [8,"What is the name of the vast expanse of flat prairie and grassland located east of the Rocky Mountains across states like Kansas, Nebraska, and the Dakotas?",["The Great Plains","The Piedmont","The Coastal Plain","The Everglades"],0,"ロッキー山脈の東側から西経100度線付近にかけて南北に広がる大平原は「グレートプレーンズ（The Great Plains）」と呼ばれます。"],
  [8,"Which climate type characterizes coastal California, featuring warm, dry summers and mild, wet winters ideal for wine grape cultivation?",["Humid Continental Climate","Mediterranean Climate","Subarctic Climate","Tropical Savanna Climate"],1,"カリフォルニア州沿岸部は夏に乾燥し冬に温暖湿潤となる「地中海性気候（Mediterranean Climate）」で、ブドウや柑橘類の栽培に適しています。"],
  [8,"Which large body of water borders five Southern U.S. states (Florida, Alabama, Mississippi, Louisiana, and Texas)?",["Chesapeake Bay","Gulf of Mexico","Puget Sound","Hudson Bay"],1,"アメリカ南部のフロリダ州からテキサス州までの5州が面している内海はメキシコ湾（Gulf of Mexico）です。"],

  // 10. 地理②：国立公園・自然遺産 (#126–#150)
  [9,"Which national park, established in 1872 primarily in Wyoming (extending into Montana and Idaho), was the world's very first national park?",["Yosemite National Park","Grand Canyon National Park","Yellowstone National Park","Sequoia National Park"],2,"1872年にグラント大統領の署名により指定されたイエローストーン国立公園（主にワイオミング州）は、世界最初の国立公園です。"],
  [9,"What is the name of the famous geyser in Yellowstone National Park known for its regular, predictable eruptions?",["Steamboat Geyser","Old Faithful","Morning Glory Pool","Grand Prismatic Spring"],1,"イエローストーン国立公園で一定の間隔で忠実に熱水を噴き上げる最も有名な間欠泉は「オールド・フェイスフル（Old Faithful）」です。"],
  [9,"In which Southwestern U.S. state is Grand Canyon National Park located?",["Utah","Colorado","Arizona","New Mexico"],2,"コロラド川が削り出した大峡谷「グランドキャニオン国立公園」が位置するのはアリゾナ州です。"],
  [9,"Which UNESCO World Heritage national park in California is famous for granite monoliths such as Half Dome and El Capitan?",["Joshua Tree National Park","Yosemite National Park","Redwood National Park","Death Valley National Park"],1,"氷河が削ったU字谷とハーフドーム、エル・キャピタンなどの巨大な花崗岩の絶壁で有名なのはカリフォルニア州のヨセミテ国立公園です。"],
  [9,"Which subtropical wetlands national park at the southern tip of Florida is famous for sawgrass marshes, mangroves, and American alligators?",["Biscayne National Park","Everglades National Park","Congaree National Park","Dry Tortugas National Park"],1,"フロリダ半島南端に広がる亜熱帯の湿地帯は「エバーグレーズ国立公園（Everglades National Park）」で、世界自然遺産にも登録されています。"],
  [9,"Which world-famous group of three waterfalls sits on the international border between New York State and Ontario, Canada?",["Yosemite Falls","Niagara Falls","Multnomah Falls","Shoshone Falls"],1,"エリー湖からオンタリオ湖へ流れるナイアガラ川にあり、ニューヨーク州とカナダの国境に位置するのは「ナイアガラの滝（Niagara Falls）」です。"],
  [9,"Which national park straddling the border of North Carolina and Tennessee is the most visited national park in the United States?",["Shenandoah National Park","Great Smoky Mountains National Park","Blue Ridge Parkway","Acadia National Park"],1,"ノースカロライナ州とテネシー州にまたがる「グレート・スモーキー山脈国立公園」は、全米63の国立公園のなかで年間来訪者数が最多です。"],
  [9,"Which national park in California is home to 'General Sherman,' the largest known living single-stem tree on Earth by volume?",["Olympic National Park","Sequoia National Park","Pinnacles National Park","Lassen Volcanic National Park"],1,"体積で世界最大の巨木「シャーマン将軍の木（General Sherman）」があるのはカリフォルニア州のセコイア国立公園です。"],
  [9,"Which national park on Mount Desert Island in Maine is the oldest national park east of the Mississippi River?",["Acadia National Park","Cuyahoga Valley National Park","Isle Royale National Park","Voyageurs National Park"],0,"大西洋岸のメイン州にある「アーカディア国立公園（Acadia National Park）」は、ミシシッピ川以東で最も古い国立公園です。"],
  [9,"Which national park in eastern Utah preserves over 2,000 natural sandstone arches, including the famous Delicate Arch?",["Bryce Canyon National Park","Arches National Park","Canyonlands National Park","Capitol Reef National Park"],1,"州のシンボル「デリケート・アーチ」をはじめ2,000以上の天然砂岩アーチが集まるユタ州の国立公園は「アーチーズ国立公園」です。"],
  [9,"Which national park in southwestern Utah is famous for the towering reddish sandstone cliffs of Zion Canyon and the Narrows?",["Zion National Park","Badlands National Park","Petrified Forest National Park","Grand Teton National Park"],0,"ユタ州南西部にあり、ヴァージン川が刻んだ赤い砂岩の渓谷美で知られるのは「ザイオン国立公園（Zion National Park）」です。"],
  [9,"Which national park in Montana borders Canada's Waterton Lakes National Park to form the world's first International Peace Park?",["Yellowstone National Park","Glacier National Park","Rocky Mountain National Park","North Cascades National Park"],1,"モンタナ州北部の「グレーシャー国立公園（Glacier National Park）」は、カナダ側の国立公園と共に世界初の国際平和公園を構成しています。"],
  [9,"Which national park in Oregon surrounds the deepest lake in the United States (592 m deep), formed in a collapsed volcanic caldera?",["Mount Rainier National Park","Crater Lake National Park","Olympic National Park","Redwood National Park"],1,"オレゴン州の「クレーターレイク国立公園」にあるクレーターレイクは水深592mで、アメリカで最も深いカルデラ湖です。"],
  [9,"Which national park in southern New Mexico is a UNESCO World Heritage Site famous for its massive underground limestone caves?",["White Sands National Park","Carlsbad Caverns National Park","Guadalupe Mountains National Park","Big Bend National Park"],1,"ニューメキシコ州南部の「カールズバッド洞窟群国立公園」は、巨大な鍾乳洞群で知られる世界自然遺産です。"],
  [9,"Which national park in central Kentucky protects the world's longest known cave system (over 680 km explored)?",["Mammoth Cave National Park","Wind Cave National Park","Shenandoah National Park","Hot Springs National Park"],0,"ケンタッキー州にある「マンモス・ケーブ国立公園（Mammoth Cave National Park）」は、総延長680kmを超える世界最長の洞窟群です。"],
  [9,"Which iconic red sandstone valley on the Arizona–Utah border within the Navajo Nation is famous for its towering buttes in Western films?",["Death Valley","Monument Valley","Antelope Canyon","Sedona"],1,"アリゾナ州とユタ州の州境（ナバホ族居留地内）にあり、メサやビュートがそびえるアメリカの原風景は「モニュメント・バレー」です。"],
  [9,"In which state is 'Devils Tower,' designated by President Theodore Roosevelt in 1906 as the first United States National Monument, located?",["South Dakota","Wyoming","Montana","Idaho"],1,"1906年にセオドア・ルーズベルト大統領がアメリカ初の国定記念物（National Monument）に指定した岩山「デビルズ・タワー」はワイオミング州にあります。"],
  [9,"In which Midwestern/Plains state are the Black Hills, Badlands National Park, and Mount Rushmore located?",["North Dakota","South Dakota","Nebraska","Kansas"],1,"4人の大統領の巨大な顔が彫られたマウント・ラシュモアやブラックヒルズ、バッドランズ国立公園があるのはサウスダコタ州です。"],
  [9,"Which volcanic tuff cone on the island of Oahu in Hawaii is a famous landmark overlooking Waikiki Beach in Honolulu?",["Mauna Kea","Diamond Head","Haleakala","Kilauea"],1,"ハワイ・オアフ島のワイキキビーチ東側にそびえる象徴的な火山クレーターは「ダイヤモンド・ヘッド（Diamond Head）」です。"],
  [9,"Which island is the largest in land area in the Hawaiian archipelago ('The Big Island') and home to Hawaii Volcanoes National Park?",["Oahu","Maui","Hawaii Island","Kauai"],2,"ハワイ諸島で最も面積が大きい島は「ハワイ島（ビッグ・アイランド）」で、マウナ・ロアやキラウエア火山があります（州都ホノルルがあるのはオアフ島）。"],
  [9,"Which bay on the U.S. Atlantic coast, bordered by Maryland and Virginia, is the largest estuary in the United States?",["Delaware Bay","Chesapeake Bay","San Francisco Bay","Tampa Bay"],1,"メリーランド州とバージニア州に囲まれた「チェサピーク湾（Chesapeake Bay）」は、アメリカ最大の河口湾（エスチュアリー）です。"],
  [9,"Which hook-shaped peninsula in southeastern Massachusetts, near the islands of Martha's Vineyard and Nantucket, is a famous summer resort area?",["Cape Canaveral","Cape Cod","Cape May","Key West"],1,"マサチューセッツ州南東部に突き出た釣り針状の半島は、有名な避暑地「ケープコッド（Cape Cod）」です。"],
  [9,"Which 200-mile string of narrow barrier islands off the coast of North Carolina includes Kitty Hawk (site of the Wright Brothers' flight)?",["Florida Keys","Outer Banks","Sea Islands","Channel Islands"],1,"ノースカロライナ州沖に連なる砂州の島々は「アウター・バンクス（Outer Banks）」と呼ばれ、キティホークなどが位置しています。"],
  [9,"Which four Southwestern U.S. states meet at right angles at the 'Four Corners Monument,' the only point in the U.S. shared by four states?",["Arizona, California, Nevada, and Utah","Arizona, Colorado, New Mexico, and Utah","Colorado, Kansas, New Mexico, and Texas","Idaho, Montana, Utah, and Wyoming"],1,"全米で唯一4つの州境が1点で十字に交わる「フォー・コーナーズ」を構成するのは、アリゾナ・コロラド・ニューメキシコ・ユタの4州です。"],
  [9,"How many main National Parks (such as Yellowstone, Grand Canyon, and Yosemite) are currently designated in the United States?",["35","50","63","100"],2,"アメリカ合衆国には現在、国立公園局（NPS）が管理する主要国立公園（National Parks）が63カ所あります。"],

  // 11. 地理③：50州ランキング・特徴 (#151–#175)
  [10,"Which U.S. state is the largest in land area (1st), accounting for about 17% of total U.S. territory?",["Texas","California","Alaska","Montana"],2,"面積第1位はアラスカ州（約172万km²）で、アメリカ全体の約17%を占め、2位のテキサス州の約2.5倍の広さがあります。"],
  [10,"Which U.S. state is the second largest in both land area and population, and is nicknamed the 'Lone Star State'?",["California","Texas","Florida","Montana"],1,"テキサス州は面積・人口ともに全米第2位であり、州旗の一つ星から「ローン・スター・ステート（一つ星の州）」と呼ばれます。"],
  [10,"Which U.S. state in New England is the smallest in land area among all 50 states?",["Delaware","Rhode Island","Connecticut","New Jersey"],1,"全50州で最も面積が小さいのはニューイングランド地方のロードアイランド州（Rhode Island）です。"],
  [10,"What are the top three most populous states in the United States in order from 1st to 3rd?",["California (1st), New York (2nd), Texas (3rd)","California (1st), Texas (2nd), Florida (3rd)","Texas (1st), California (2nd), Florida (3rd)","California (1st), Texas (2nd), New York (3rd)"],1,"アメリカの人口上位3州は、1位カリフォルニア州、2位テキサス州、3位フロリダ州（4位ニューヨーク州）の順です。"],
  [10,"Which U.S. state has the smallest population among all 50 states (under 600,000 residents)?",["Vermont","Alaska","Wyoming","North Dakota"],2,"全50州で最も人口が少ないのは、イエローストーン国立公園を擁するワイオミング州（Wyoming、2位はバーモント州）です。"],
  [10,"Which U.S. state, located between New York City and Philadelphia, has the highest population density among the 50 states?",["Massachusetts","Rhode Island","New Jersey","Maryland"],2,"全50州で最も人口密度が高いのは、ニューヨークとフィラデルフィアの2大都市圏に挟まれたニュージャージー州（New Jersey）です。"],
  [10,"Which state is nicknamed the 'First State' because it was the first to ratify the U.S. Constitution on December 7, 1787?",["Virginia","Pennsylvania","Delaware","Massachusetts"],2,"1787年12月7日に合衆国憲法を最初に批准したデラウェア州（Delaware）は「ファースト・ステート（最初の州）」と呼ばれます。"],
  [10,"Which two states were the 49th and 50th states admitted to the Union in January and August 1959, respectively?",["Arizona and New Mexico","Alaska (49th) and Hawaii (50th)","Hawaii (49th) and Alaska (50th)","Oklahoma and Utah"],1,"1959年1月にアラスカ州が49番目の州、同年8月にハワイ州が最後の50番目の州として連邦に昇格しました。"],
  [10,"Which U.S. state is nicknamed the 'Golden State' and features a grizzly bear on its state flag?",["Nevada","Colorado","California","Oregon"],2,"ゴールドラッシュの歴史から「ゴールデン・ステート（黄金の州）」と呼ばれ、州旗にグリズリー（熊）が描かれているのはカリフォルニア州です。"],
  [10,"Which U.S. state is officially nicknamed the 'Empire State'?",["New York","Pennsylvania","Virginia","Illinois"],0,"ニューヨーク州は「エンパイア・ステート（帝国の州）」の愛称を持ち、エンパイア・ステート・ビルディングの名前の由来にもなっています。"],
  [10,"Which U.S. state is officially nicknamed the 'Sunshine State' and attracts top tourist numbers to cities like Orlando and Miami?",["California","Hawaii","Florida","Arizona"],2,"「サンシャイン・ステート（太陽の州）」の愛称を持ち、オーランドのテーマパーク群などで多くの観光客を集めるのはフロリダ州です。"],
  [10,"Which U.S. state is nicknamed the 'Keystone State' because of its central geographic and political role among the original 13 colonies?",["Maryland","Pennsylvania","New Jersey","Connecticut"],1,"独立当初の13植民地の中央で要石（キーストーン）の役割を果たしたペンシルベニア州は「キーストーン・ステート」と呼ばれます。"],
  [10,"Which state has the highest average elevation in the U.S. and is nicknamed the 'Centennial State' for joining the Union in 1876?",["Wyoming","Utah","Colorado","Montana"],2,"独立宣言から100年後の1876年に州に昇格したコロラド州は「センテニアル・ステート（100周年の州）」と呼ばれ、全米で平均標高が最も高い州です。"],
  [10,"Which Southern state, the largest state east of the Mississippi River in land area, is nicknamed the 'Peach State'?",["South Carolina","Georgia","Alabama","North Carolina"],1,"モモの生産と南部文化で知られるジョージア州（Georgia）は「ピーチ・ステート（桃の州）」と呼ばれます。"],
  [10,"Which U.S. state is the only island state and the only state with two official state languages (English and Hawaiian)?",["Alaska","Hawaii","Florida","Rhode Island"],1,"太平洋のハワイ州は全50州で唯一の島嶼州であり、英語とハワイ語の2つを公用語に定めています。"],
  [10,"Which Midwestern state consists of two separate peninsulas (the Upper and Lower Peninsulas) connected by the Mackinac Bridge?",["Wisconsin","Michigan","Minnesota","Ohio"],1,"五大湖に囲まれたアッパー半島とロウアー半島の2つの半島から成る州はミシガン州（Michigan）です。"],
  [10,"Which two U.S. states are tied for bordering the highest number of other U.S. states (8 neighboring states each)?",["Texas and Oklahoma","Tennessee and Missouri","Kentucky and Illinois","Ohio and Pennsylvania"],1,"テネシー州とミズーリ州は、それぞれ8つの州と州境を接しており全米最多です。"],
  [10,"Which is the only U.S. state in the contiguous 48 states that borders just ONE other U.S. state?",["Florida","Maine","Washington","Michigan"],1,"本土48州のうち、ニューハンプシャー州の1州としか接していない唯一の州は北東端のメイン州（Maine）です（アラスカとハワイは0州）。"],
  [10,"In the contiguous 48 states, which state is the easternmost and which state is the westernmost?",["Massachusetts (East) and California (West)","Maine (East) and Washington (West)","Maine (East) and Oregon (West)","New Hampshire (East) and California (West)"],1,"本土48州（Contiguous United States）のなかで最東端はメイン州、最西端はワシントン州です（全50州を含めると最北・最西・東経側の最東端はアラスカ州、最南端はハワイ州）。"],
  [10,"In the contiguous 48 states, which state contains the northernmost point (the Northwest Angle) and is nicknamed the 'Land of 10,000 Lakes'?",["North Dakota","Montana","Minnesota","Wisconsin"],2,"本土48州の最北端（ノースウェスト・アングル）を有し、「1万の湖の地」と呼ばれるのはミネソタ州です。"],
  [10,"Which U.S. state is the driest in the nation, recording the lowest average annual precipitation, and is nicknamed the 'Silver State'?",["Arizona","New Mexico","Nevada","Utah"],2,"シエラネバダ山脈の雨陰にあたるネバダ州（Nevada）は全米で最も降水量が少ない乾燥した州で、銀鉱山の歴史から「シルバー・ステート」と呼ばれます。"],
  [10,"Which four U.S. states have the word 'New' in their names?",["New York, New Jersey, New Mexico, and New Hampshire","New York, New Jersey, New England, and New Orleans","New York, New Mexico, New Haven, and New Hampshire","New Jersey, New Mexico, New Dakota, and New Carolina"],0,"州名に「New」がつくのは、ニューヨーク、ニュージャージー、ニューメキシコ、ニューハンプシャーの4州です。"],

  [10,"Which two Western states have almost perfectly rectangular borders defined entirely by lines of latitude and longitude?",["Colorado and Wyoming","Utah and Nevada","Montana and Idaho","Arizona and New Mexico"],0,"地図上でほぼ完全な長方形（緯線と経線のみの州境）をしているのは、コロラド州とワイオミング州の2州です。"],

  [11,"What is the capital city of the state of New York?",["New York City","Buffalo","Albany","Syracuse"],2,"ニューヨーク州の州都はニューヨーク市ではなく、ハドソン川上流にあるオールバニ（Albany）です。"],

  [11,"What is the capital city of the state of California?",["Los Angeles","San Francisco","Sacramento","San Diego"],2,"カリフォルニア州の州都は、ロサンゼルスやサンフランシスコではなく北部のサクラメント（Sacramento）です。"],
  [11,"Which city on the southwestern shore of Lake Michigan is the largest city in the Midwest and is nicknamed the 'Windy City'?",["Detroit","Chicago","Milwaukee","Minneapolis"],1,"ミシガン湖南西岸に位置する中西部最大の都市シカゴは、「ウィンディ・シティ（風の街）」の愛称で知られます。"],
  [11,"What is the capital city of the state of Illinois?",["Chicago","Springfield","Peoria","Rockford"],1,"イリノイ州の州都はシカゴではなく、リンカーンが青年期から大統領就任まで過ごした州中部のスプリングフィールド（Springfield）です。"],
  [11,"What is the most populous city in Texas (4th in the U.S.), nicknamed 'Space City' as home to NASA's Lyndon B. Johnson Space Center?",["Dallas","San Antonio","Houston","Austin"],2,"テキサス州最大の都市（全米第4位）はヒューストンで、NASAのジョンソン宇宙センター（管制センター）があることから「スペース・シティ」と呼ばれます。"],
  [11,"What is the capital city of the state of Texas?",["Houston","Dallas","Austin","San Antonio"],2,"テキサス州の州都は、ライブ音楽とハイテク産業（シリコン・ヒルズ）で知られるオースティン（Austin）です。"],
  [11,"Which city in New Mexico, founded in 1610, is both the oldest state capital and the highest-elevation state capital in the United States?",["Albuquerque","Santa Fe","Taos","Phoenix"],1,"ニューメキシコ州の州都サンタフェ（Santa Fe）は1610年に建設された全米最古の州都であり、標高約2,194mで最も高い位置にある州都です。"],
  [11,"What is the capital and largest city of Massachusetts, serving as the historical and cultural center of New England?",["Providence","Boston","Hartford","Cambridge"],1,"マサチューセッツ州の州都ボストンは、ニューイングランド地方の経済・歴史・学術の中心都市です。"],

  [11,"Which largest city in Pennsylvania (where Independence Hall and the Liberty Bell are located) means 'City of Brotherly Love' in Greek?",["Pittsburgh","Harrisburg","Philadelphia","Allentown"],2,"ペンシルベニア州最大の都市フィラデルフィアはギリシャ語で「兄弟愛の街」を意味し、独立記念館や自由の鐘があります（州都はハリスバーグ）。"],
  [11,"What is the capital and largest city of Florida? (Note: the capital and largest city are different)",["Capital: Miami / Largest: Orlando","Capital: Tallahassee / Largest: Jacksonville","Capital: Orlando / Largest: Miami","Capital: Tampa / Largest: Tallahassee"],1,"フロリダ州の州都は北西部のタラハシー（Tallahassee）であり、市域人口が最大の都市は北東部のジャクソンビル（都市圏人口最大はマイアミ）です。"],
  [11,"What is the capital and largest city of Colorado, nicknamed the 'Mile High City' because its elevation is exactly 1 mile (5,280 feet / 1,609 m)?",["Boulder","Colorado Springs","Denver","Aspen"],2,"コロラド州の州都デンバー（Denver）は、標高がちょうど1マイル（約1,609m）であることから「マイル・ハイ・シティ」と呼ばれます。"],
  [11,"What is the capital and largest city of Arizona, which is also the most populous state capital in the United States?",["Tucson","Phoenix","Scottsdale","Flagstaff"],1,"アリゾナ州の州都フェニックス（Phoenix）は、全米50州の州都のなかで最も人口が多い大都市（全米第5位）です。"],

  [11,"What is the capital and largest city of Hawaii, located on the southeastern coast of the island of Oahu?",["Hilo","Honolulu","Lahaina","Kailua"],1,"ハワイ州の州都かつ最大都市は、オアフ島にあるホノルル（Honolulu）です。"],

  [11,"Which two U.S. states do NOT observe Daylight Saving Time (keeping standard time all year)?",["Alaska and Hawaii","Arizona and Hawaii","California and Florida","Texas and Nevada"],1,"アメリカで夏時間（Daylight Saving Time）を実施していないのは、アリゾナ州（ナバホ族居留地を除く）とハワイ州の2州です。"],
  [11,"What is the name of the heavily urbanized megalopolis stretching along the U.S. East Coast from Boston through New York and Philadelphia to Washington, D.C.?",["Sun Belt","BosWash (Northeast Megalopolis)","Silicon Valley","Corn Belt"],1,"北東部のボストンからニューヨーク、フィラデルフィア、ボルティモアを経てワシントンD.C.に至る巨大都市群は「ボスウォッシュ（BosWash / 北東部メガロポリス）」と呼ばれます。"],
  [11,"What term refers to the warm southern and southwestern region of the U.S. (roughly south of the 37th parallel) known for rapid population and industrial growth?",["Rust Belt","Sun Belt","Bible Belt","Frost Belt"],1,"北緯37度以南の温暖な南部〜南西部（フロリダ・テキサス・アリゾナ・カリフォルニア南部など）で先端産業や人口が増加している地域は「サンベルト（Sun Belt）」と呼ばれます。"],

  [12,"Which federal bureau within the Department of the Treasury is responsible for collecting federal taxes and enforcing tax laws?",["FBI","IRS (Internal Revenue Service)","ATF","OMB"],1,"アメリカ財務省の下で連邦税の徴収と税法の執行を担う機関は「内国歳入庁（IRS: Internal Revenue Service）」です。"],

  [12,"Which West Coast U.S. state is well known for having zero (0%) statewide sales tax?",["California","Washington","Oregon","Nevada"],2,"アメリカの消費税（Sales Tax）は州や自治体ごとに定められており、オレゴン州（ほかデラウェア・モンタナ・ニューハンプシャーなど）は州消費税が0%です。"],

  [13,"Which widely used benchmark stock market index tracks the capitalization-weighted performance of 500 large companies listed on U.S. stock exchanges?",["Dow Jones 30","S&P 500","NASDAQ-100","Fortune 500"],1,"アメリカの主要上場企業500社の時価総額加重平均指数であり、機関投資家の代表的ベンチマークとなっているのは「S&P 500」です。"],
