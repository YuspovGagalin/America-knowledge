  [13,"Which independent federal agency was established in 1934 after the Great Crash to regulate the stock market and prevent corporate fraud?",["FTC","SEC (Securities and Exchange Commission)","FDIC","FCC"],1,"1929年の大暴落の反省から1934年に設立された株式市場の監視・監督機関は「証券取引委員会（SEC）」です。"],
  [13,"Which federal corporation was created in 1933 by the Glass-Steagall Act to insure commercial bank deposits and maintain confidence in the banking system?",["FDIC (Federal Deposit Insurance Corporation)","Fannie Mae","Sallie Mae","SIPC"],0,"1933年銀行法（グラス・スティーガル法）によって設立され、銀行破綻時に預金者を保護する機関は「連邦預金保険公社（FDIC）」です。"],
  [13,"Who served as the first Secretary of the Treasury (1789–1795) and authored the 'Report on Manufactures' and established the First Bank of the United States?",["Thomas Jefferson","Alexander Hamilton","Albert Gallatin","Robert Morris"],1,"初代財務長官アレクサンダー・ハミルトンは、連邦政府による州債務の引き受け、第一合衆国銀行の創設、製造業保護を打ち出しアメリカ資本主義の礎を築きました。"],
  [13,"What term, taken from an 1873 novel by Mark Twain, describes the late-19th-century era of rapid U.S. economic growth, monopolies, and ostentatious wealth?",["Progressive Era","The Gilded Age","Roaring Twenties","Era of Good Feelings"],1,"南北戦争後から19世紀末にかけて鉄道・鉄鋼・石油王たちが巨富を築いた時代は、マーク・トウェインの小説に由来し「金ぴか時代（Gilded Age）」と呼ばれます。"],
  [13,"Which Scottish-American industrialist built the steel industry in Pittsburgh and wrote 'The Gospel of Wealth,' donating his fortune to build libraries and Carnegie Hall?",["John D. Rockefeller","Andrew Carnegie","Cornelius Vanderbilt","Henry Clay Frick"],1,"ピッツバーグで鉄鋼王となったアンドリュー・カーネギーは『富の福音』を著し、引退後にカーネギー・ホールや全米の公共図書館・大学の設立に私財を投じました。"],
  [13,"Which legendary Wall Street banker financed the creation of U.S. Steel (the first billion-dollar corporation) in 1901 and personally intervened to stop the Panic of 1907?",["Andrew Mellon","J.P. Morgan","Jay Gould","Charles Schwab"],1,"金融王ジョン・ピアポント・モルガン（J.P. Morgan）はUSスチールやゼネラル・エレクトリック（GE）の設立を主導し、中央銀行がなかった1907年恐慌を鎮めました。"],
  [13,"Which landmark 1890 federal law was the first measure passed by the U.S. Congress to outlaw monopolies and business cartels ('trusts')?",["Interstate Commerce Act","Sherman Antitrust Act","Clayton Act","Wagner Act"],1,"1890年に制定された「シャーマン反トラスト法（独占禁止法）」は、大企業による市場独占やカルテルを禁止したアメリカ最初の連邦独占禁止法です。"],
  [13,"In what year did the Wall Street Stock Market Crash ('Black Thursday') occur, triggering the Great Depression of the 1930s?",["1920","1929","1933","1937"],1,"1929年10月24日（暗黒の木曜日）に始まったウォール街の株価大暴落を機に、世界恐慌（Great Depression）が発生しました。"],
  [13,"What were the three goals ('3 Rs') of President Franklin D. Roosevelt's 'New Deal' policies in the 1930s, which included the TVA and WPA?",["Relief, Recovery, and Reform","Reduce, Reuse, and Recycle","Readiness, Resilience, and Renewal","Revenue, Regulation, and Reserves"],0,"フランクリン・D・ルーズベルト大統領のニューディール政策は、「救済（Relief）・復興（Recovery）・改革（Reform）」の3つのRを柱として展開されました。"],
  [13,"Which landmark 1935 New Deal law established the federal system of old-age pensions (retirement benefits) and unemployment insurance in the U.S.?",["Fair Labor Standards Act","Social Security Act","Taft-Hartley Act","Glass-Steagall Act"],1,"1935年に制定された「社会保障法（Social Security Act）」により、現在のアメリカの公的年金制度や失業保険制度の基盤が確立されました。"],
  [13,"At which 1944 conference in New Hampshire did 44 Allied nations establish the postwar international monetary system based on the U.S. dollar and gold?",["Dumbarton Oaks Conference","Bretton Woods Conference","Yalta Conference","San Francisco Conference"],1,"1944年7月にニューハンプシャー州で開催された「ブレトン・ウッズ会議」により、金1オンス＝35ドルの固定相場制（ブレトン・ウッズ体制）が築かれました。"],
  [13,"Which two major international financial organizations, created at the 1944 Bretton Woods Conference, have their headquarters in Washington, D.C.?",["WTO and OECD","IMF (International Monetary Fund) and the World Bank","BIS and European Central Bank","ADB and GATT"],1,"ブレトン・ウッズ協定で設立された国際通貨基金（IMF）と世界銀行（World Bank）の本部は、ともにワシントンD.C.にあります。"],
  [13,"Which U.S. President announced the suspension of the dollar's convertibility into gold in August 1971 ('Nixon Shock'), leading to floating exchange rates?",["Lyndon B. Johnson","Richard Nixon","Gerald Ford","Jimmy Carter"],1,"1971年8月15日、第37代リチャード・ニクソン大統領が金とドルの交換停止（ニクソン・ショック）を発表し、世界は変動相場制へと移行しました。"],
  [13,"What was the popular name for President Ronald Reagan's 1980s supply-side economic policies of tax cuts, deregulation, and curbing inflation?",["New Frontier","Reaganomics","Fair Deal","Clintonomics"],1,"1980年代に第40代ロナルド・レーガン大統領が推進した減税・規制緩和・小さな政府による供給重視（サプライサイド）の経済政策は「レーガノミクス」と呼ばれます。"],
  [13,"Which American economist of the 'Chicago School' won the 1976 Nobel Prize in Economics as a champion of free markets and 'Monetarism'?",["Paul Samuelson","Milton Friedman","Joseph Stiglitz","Paul Krugman"],1,"シカゴ学派の指導者ミルトン・フリードマンは、マネタリズムと自由市場経済を提唱し1976年にノーベル経済学賞を受賞しました。"],
  [13,"Which American mathematician at Princeton University won the 1994 Nobel Prize in Economic Sciences for his work on non-cooperative 'Game Theory'?",["John von Neumann","John Nash","Kenneth Arrow","Gary Becker"],1,"ゲーム理論における「ナッシュ均衡」で1994年にノーベル経済学賞を受賞し、映画『ビューティフル・マインド』のモデルとなった数学者はジョン・ナッシュです。"],
  [13,"Which major Wall Street investment bank filed for bankruptcy on September 15, 2008, triggering the global financial crisis ('Lehman Shock')?",["Bear Stearns","Lehman Brothers","Merrill Lynch","Goldman Sachs"],1,"2008年9月15日に負債総額約6,000億ドルで連邦破産法第11条を申請し、世界的金融危機を引き起こした投資銀行は「リーマン・ブラザーズ」です。"],
  [13,"What type of high-risk U.S. housing loans to borrowers with lower credit ratings defaulted in large numbers in 2007–2008, causing the Great Recession?",["Student Loans","Subprime Mortgages","Municipal Bonds","Treasury Bills"],1,"2007〜2008年の世界金融危機の引き金となった信用度の低い借り手向けの住宅ローンは「サブプライム住宅ローン（Subprime Mortgages）」です。"],
  [13,"Which billionaire investor and CEO of Berkshire Hathaway is nicknamed the 'Oracle of Omaha' for his long-term value investing success?",["George Soros","Warren Buffett","Ray Dalio","Carl Icahn"],1,"ネブラスカ州オマハを拠点に投資会社バークシャー・ハサウェイを率い、「オマハの賢人（Oracle of Omaha）」と呼ばれる投資家はウォーレン・バフェットです。"],

  // 15. 経済③：産業・農業・貿易 (#251–#275)
  [14,"Where does the United States rank globally in nominal Gross Domestic Product (GDP), with an economy exceeding $27 trillion?",["1st in the world","2nd in the world","3rd in the world","4th in the world"],0,"アメリカ合衆国の名目GDP（国内総生産）は27兆ドルを超えており、世界第1位の経済大国です。"],
  [14,"Which region in Northern California, south of San Francisco around San Jose, Palo Alto, and Cupertino, is the world's premier hub for IT and venture capital?",["Death Valley","Silicon Valley","Napa Valley","Hudson Valley"],1,"サンフランシスコ・ベイエリア南部（サンノゼやパロアルト周辺）に広がる世界最大のIT・ハイテク産業集積地は「シリコンバレー（Silicon Valley）」です。"],
  [14,"Which city in Michigan is famously nicknamed the 'Motor City' (and 'Motown') as the historic center of the U.S. automobile industry?",["Cleveland","Detroit","Chicago","Pittsburgh"],1,"ミシガン州デトロイトは、20世紀に自動車産業の中心地として発展したことから「モーターシティ（Motor City）」と呼ばれます。"],
  [14,"Which three historic automakers headquartered in the Detroit area are traditionally called the 'Big Three'?",["Ford, Tesla, and Toyota","General Motors (GM), Ford, and Chrysler (Stellantis)","GM, Ford, and Volkswagen","Ford, Rivian, and Dodge"],1,"デトロイト周辺に拠点を置くアメリカの伝統的な3大自動車メーカー（ビッグ・スリー）は、ゼネラル・モーターズ（GM）、フォード、クライスラー（現ステランティス傘下）です。"],
  [14,"Which steel-producing city in western Pennsylvania, at the confluence of the Allegheny and Monongahela rivers, is nicknamed the 'Steel City'?",["Philadelphia","Pittsburgh","Allentown","Erie"],1,"カーネギー鉄鋼会社などが設立され、アメリカの鉄鋼業の中心地として栄えたペンシルベニア州西部の都市はピッツバーグ（Steel City）です。"],
  [14,"Which Midwestern agricultural region, centered on Iowa, Illinois, and Indiana, is the world's largest producer of corn (maize) and soybeans?",["Wheat Belt","Corn Belt","Cotton Belt","Sun Belt"],1,"五大湖の南側、アイオワ州やイリノイ州・インディアナ州を中心に広がる世界最大のトウモロコシ・大豆生産地帯は「コーンベルト（Corn Belt）」です。"],
  [14,"Which state in the heart of the Corn Belt ranks #1 in the United States in the production of corn, pork, eggs, and ethanol?",["Kansas","Iowa","Wisconsin","Texas"],1,"コーンベルトの中心に位置するアイオワ州（Iowa）は、トウモロコシ・豚肉・鶏卵・バイオエタノールの生産量で全米第1位です。"],
  [14,"Which state in the Great Plains is nicknamed the 'Wheat State' and the 'Breadbasket of the World' as a top producer of winter wheat?",["Iowa","Kansas","Nebraska","Missouri"],1,"グレートプレーンズの中央に位置するカンザス州（Kansas）は、冬小麦の大産地として「世界のパンかご」と呼ばれます。"],
  [14,"Which Midwestern state is famous for its cheese production and prints 'America's Dairyland' on its license plates?",["Minnesota","Wisconsin","Michigan","Ohio"],1,"ウィスコンシン州（Wisconsin）はチーズをはじめとする酪農が盛んで、「アメリカの酪農の国（America's Dairyland）」の標語で知られます。"],
  [14,"Which vast, irrigated valley running through the center of California produces more than half of the fruits, vegetables, and almonds grown in the U.S.?",["Death Valley","Central Valley","Monument Valley","Shenandoah Valley"],1,"カリフォルニア州の中央を南北に走る「セントラル・バレー（Central Valley）」は、全米の果物・野菜・ナッツ類の半分以上を産出する大農業地帯です。"],
  [14,"Which U.S. state ranks #1 in the nation in the production of crude oil, natural gas, AND wind-generated electricity?",["Alaska","Texas","California","North Dakota"],1,"テキサス州は原油・天然ガスの生産量で全米1位であるだけでなく、風力発電の発電量でも全米1位のエネルギー大国州です。"],
  [14,"What extraction revolution in the 2000s and 2010s (using hydraulic fracturing and horizontal drilling) turned the U.S. into the world's largest producer of oil and natural gas?",["Green Revolution","Shale Revolution","Coal Boom","Solar Transition"],1,"水圧破砕法（フラッキング）と水平掘削技術によってシェール層から石油・ガスを採掘可能にした「シェール革命（Shale Revolution）」により、米国は世界最大の産油・産ガス国となりました。"],
  [14,"In which state did Edwin Drake drill the first commercial oil well in the United States (at Titusville in 1859), sparking the modern petroleum industry?",["Texas","Pennsylvania","Oklahoma","California"],1,"近代石油産業の幕開けとなったエドウィン・ドレークによる世界初の商業用機械掘り油井（1859年）は、ペンシルベニア州タイタスビルで掘削されました。"],
  [14,"Which metropolitan area in Washington State is the birthplace of Boeing and a major center for aerospace, cloud computing (Amazon/Microsoft), and coffee?",["Portland","Seattle","Spokane","Boise"],1,"ワシントン州のシアトル都市圏は、ボーイング発祥の航空宇宙産業の拠点であり、アマゾン・マイクロソフト・スターバックス・コストコを生んだ経済拠点です。"],
  [14,"Which metropolitan area in Massachusetts, home to Harvard and MIT, is one of the world's premier clusters for biotechnology, medicine, and robotics?",["Hartford","Boston / Cambridge","Providence","Albany"],1,"ハーバード大学やMIT（マサチューセッツ工科大学）を擁するボストン・ケンブリッジ圏は、バイオテクノロジーや医療・製薬、ロボティクスの世界的拠点です。"],
  [14,"Which three-nation free trade agreement among the United States, Mexico, and Canada entered into force in July 2020 to replace the 1994 NAFTA?",["TPP","USMCA","CAFTA","MERCOSUR"],1,"1994年発効の北米自由貿易協定（NAFTA）に代わり、2020年7月に発効した3カ国間の新貿易協定は「USMCA（米国・メキシコ・カナダ協定）」です。"],
  [14,"Which three countries are the top three merchandise trading partners (imports + exports combined) of the United States?",["Japan, United Kingdom, and Germany","Mexico, Canada, and China","China, India, and Brazil","Canada, Japan, and South Korea"],1,"アメリカのモノの貿易相手国トップ3（輸出入合計）は、USMCA加盟国である隣国のメキシコ、カナダ、および中国の3カ国です。"],
  [14,"Which twin seaports in Southern California handle the largest volume of containerized cargo trade in the United States?",["Ports of Seattle and Tacoma","Ports of Los Angeles and Long Beach","Ports of San Francisco and Oakland","Ports of San Diego and Santa Barbara"],1,"カリフォルニア州南部のサンペドロ湾に隣接する「ロサンゼルス港」と「ロングビーチ港」は、アジア貿易の玄関口として全米最大のコンテナ取扱量を誇ります。"],
  [14,"Which international airport in Georgia, serving as the main hub for Delta Air Lines, is the busiest airport in the world by annual passenger traffic?",["O'Hare International Airport (Chicago)","Hartsfield-Jackson Atlanta International Airport","Los Angeles International Airport (LAX)","John F. Kennedy International Airport (NYC)"],1,"ジョージア州アトランタにある「ハーツフィールド・ジャクソン・アトランタ国際空港」は、デルタ航空の最大ハブであり年間旅客数で世界第1位の空港です。"],
  [14,"Which Midwestern city sits at the crossroads of the U.S. freight rail network and is home to the world's largest derivatives exchange (CME Group)?",["St. Louis","Chicago","Kansas City","Minneapolis"],1,"イリノイ州シカゴは全米の貨物鉄道網の結節点であり、農産物や金融先物を扱う世界最大のデリバティブ取引所「シカゴ・マーカンタイル取引所（CME）」があります。"],
  [14,"What is the name of the national intercity passenger railroad corporation of the United States, founded in 1971, which operates the 'Acela' high-speed train?",["Union Pacific","Amtrak","BNSF","Conrail"],1,"1971年に設立されたアメリカの全米鉄道旅客公社は「アムトラック（Amtrak＝AmericaとTrackの造語）」で、北東部回廊で高速列車アセラを運行しています。"],
  [14,"What does the abbreviation 'USPS' stand for in the United States?",["United States Parcel System","United States Postal Service","Universal States Post System","Union Standard Postal Service"],1,"アメリカの郵便公社「USPS」は「United States Postal Service（合衆国郵便公社）」の略称です。"],
  [14,"Which economic sector accounts for the largest share (nearly 80%) of U.S. Gross Domestic Product (GDP) and employment?",["Primary Sector (Agriculture & Mining)","Secondary Sector (Manufacturing & Construction)","Tertiary / Service Sector (Finance, Tech, Healthcare, Retail)","Agricultural Exports"],2,"現代アメリカ経済では金融・IT・医療・小売・専門サービスなどの「第3次産業（サービス部門）」がGDPと雇用の約8割を占めています。"],
  [14,"What is the name of the progressive policy proposal in the U.S. that combines clean renewable energy transition with economic and job guarantees?",["Square Deal","Green New Deal","Fair Deal","New Frontier"],1,"1930年代のニューディールにちなみ、脱炭素・再生可能エネルギーへの転換と雇用創出・格差是正を結びつけた環境経済政策構想は「グリーン・ニューディール」です。"],
  [14,"Which landmark August 2022 federal law signed by President Joe Biden provided historic subsidies for domestic EV manufacturing, clean energy, and prescription drug pricing?",["TARP","Inflation Reduction Act (IRA)","Gramm-Leach-Bliley Act","Smoot-Hawley Act"],1,"2022年8月に成立した「インフレ抑制法（IRA）」は、米国史上最大規模の気候変動・クリーンエネルギー・EV投資を含む経済法案です。"],

  // 16. 経済④：企業・創業者・労働 (#276–#300)
  [15,"Who co-founded Apple Computer in 1976 with Steve Wozniak and led the creation of the Macintosh, iPod, iPhone, and iPad?",["Bill Gates","Steve Jobs","Larry Ellison","Michael Dell"],1,"1976年にスティーブ・ウォズニアックと共にアップル（Apple）を共同創業し、iPhoneなどで世界を変えた経営者はスティーブ・ジョブズです。"],
  [15,"In which Silicon Valley city in California is Apple's circular 'Apple Park' headquarters located?",["Palo Alto","Cupertino","Menlo Park","Redmond"],1,"アップルの宇宙船型本社「Apple Park」があるのは、カリフォルニア州シリコンバレーのクパチーノ（Cupertino）です。"],
  [15,"Who co-founded Microsoft in 1975 with Paul Allen and later co-founded one of the world's largest philanthropic foundations?",["Steve Jobs","Bill Gates","Jeff Bezos","Larry Page"],1,"1975年にポール・アレンと共にマイクロソフト（Microsoft）を創業し、WindowsでPC時代を築いたのはビル・ゲイツです。"],
  [15,"In which city in Washington State (east of Seattle) is Microsoft's corporate headquarters located?",["Redmond","Cupertino","Mountain View","Austin"],0,"マイクロソフトの本社キャンパスがあるのは、ワシントン州シアトル郊外のレドモンド（Redmond）です。"],
  [15,"Who founded Amazon in 1994 in the Seattle area, transforming e-commerce and cloud computing (AWS), and also founded Blue Origin?",["Elon Musk","Jeff Bezos","Reid Hastings","Pierre Omidyar"],1,"1994年にオンライン書店としてアマゾン（Amazon）を創業し、世界最大のEC・クラウド企業に育てるとともに宇宙企業ブルーオリジンを設立したのはジェフ・ベゾスです。"],
  [15,"Which entrepreneur serves as CEO of the electric vehicle company Tesla and founder/CEO of the space launch company SpaceX?",["Jeff Bezos","Elon Musk","Peter Thiel","Sam Altman"],1,"電気自動車メーカーのテスラ（Tesla）および宇宙開発企業スペースX（SpaceX）を率いている実業家はイーロン・マスクです。"],
  [15,"Which two Stanford University graduate students founded the search engine company Google in 1998?",["Steve Jobs and Steve Wozniak","Larry Page and Sergey Brin","Bill Gates and Paul Allen","Jerry Yang and David Filo"],1,"1998年にスタンフォード大学の大学院生だったラリー・ペイジとセルゲイ・ブリンの2人がGoogleを創業しました。"],
  [15,"What is the name of the parent holding company of Google, created in 2015 and headquartered in Mountain View, California?",["Meta Platforms","Alphabet Inc.","Berkshire Hathaway","Oracle"],1,"2015年の組織再編により設立されたGoogleの親会社（持株会社）は「アルファベット（Alphabet Inc.）」です。"],
  [15,"Who co-founded Facebook at Harvard University in 2004 and rebranded the parent company as 'Meta Platforms' in 2021?",["Jack Dorsey","Mark Zuckerberg","Evan Spiegel","Travis Kalanick"],1,"2004年にハーバード大学の寮でFacebookを立ち上げ、2021年に社名をメタ（Meta Platforms）へ変更した創業者はマーク・ザッカーバーグです。"],
  [15,"Which semiconductor company based in Santa Clara, California, co-founded and led by CEO Jensen Huang, became one of the world's most valuable companies by designing GPUs for Artificial Intelligence?",["Intel","Nvidia","Qualcomm","Texas Instruments"],1,"ジェンスン・フアンCEOが共同創業したエヌビディア（Nvidia）は、生成AIブームを支える半導体（GPU）で世界トップクラスの時価総額企業となりました。"],
  [15,"Which San Francisco-based AI research and deployment company, led by CEO Sam Altman, launched ChatGPT in November 2022?",["DeepMind","OpenAI","Palantir","Salesforce"],1,"2022年11月にChatGPTを公開し、世界的な生成AIブームを巻き起こしたサンフランシスコの企業はサム・アルトマン率いる「OpenAI」です。"],
  [15,"Which retail giant, founded by Sam Walton in Arkansas in 1962 (headquartered in Bentonville), ranks #1 on the Fortune 500 by total revenue and is the largest private employer in the U.S.?",["Costco","Target","Walmart","Home Depot"],2,"サム・ウォルトンがアーカンソー州で創業した世界最大のスーパーマーケットチェーン「ウォルマート（Walmart）」は、売上高世界1位かつ全米最大の民間雇用主です。"],
  [15,"Which five dominant U.S. technology companies were grouped together under the famous acronym 'GAFAM'?",["Google, Apple, Facebook, Amazon, and Microsoft","General Electric, Apple, Ford, Amazon, and Meta","Google, Adobe, Fox, AT&T, and Motorola","Goldman Sachs, Apple, FedEx, Amazon, and Microsoft"],0,"GAFAM（ガーファム）は、Google（Alphabet）、Apple、Facebook（Meta）、Amazon、Microsoftの米5大テック企業を指す総称です。"],
  [15,"What is the name of the prestigious annual list published by Fortune magazine since 1955 that ranks the 500 largest U.S. corporations by total revenue?",["S&P 500","Fortune 500","Forbes 400","Dow 500"],1,"経済誌『フォーチュン』が毎年発表する、全米企業の総売上高（総収入）上位500社ランキングは「フォーチュン500（Fortune 500）」です。"],
  [15,"Which century-old American technology corporation, headquartered in Armonk, New York, is famously nicknamed 'Big Blue'?",["HP (Hewlett-Packard)","IBM (International Business Machines)","Cisco Systems","Dell Technologies"],1,"メインフレームや企業向けITサービス、量子コンピュータで知られる老舗ハイテク企業IBMは「ビッグ・ブルー（Big Blue）」の愛称で呼ばれます。"],
  [15,"Which businessman joined the McDonald brothers' burger business in 1954 and built McDonald's into a global fast-food franchise empire?",["Colonel Sanders","Ray Kroc","Howard Schultz","Walt Disney"],1,"カリフォルニアのマクドナルド兄弟から事業権を買い取り、マクドナルドを世界最大のフランチャイズ帝国に育て上げた実業家はレイ・クロック（Ray Kroc）です。"],
  [15,"Which American pharmaceutical company, founded in New York in 1849, co-developed the widely used mRNA COVID-19 vaccine with Germany's BioNTech in 2020?",["Johnson & Johnson","Pfizer","Eli Lilly","Merck"],1,"ニューヨークに本社を置く製薬大手ファイザー（Pfizer）は、2020年に独ビオンテックと共同でmRNA新型コロナワクチンを開発しました。"],
  [15,"What is the largest federation of labor unions in the United States, formed in 1955 by the merger of two historic labor organizations?",["Teamsters","AFL-CIO","UAW","SEIU"],1,"1955年に米国労働総同盟（AFL）と産業別組合会議（CIO）が合併して誕生したアメリカ最大のナショナルセンター（労働組合連合）は「AFL-CIO」です。"],
  [15,"What is the name of the nationwide labor movement started in 2012 by fast-food and service workers campaigning to raise the minimum wage to $15 an hour?",["Occupy Wall Street","Fight for $15","Fair Pay Act","Living Wage Now"],1,"2012年にニューヨークのファストフード店員のストライキから全米に広がった最低賃金引き上げ運動は「15ドル運動（Fight for $15）」と呼ばれます。"],
  [15,"While many states and cities set higher hourly rates ($15+), what has the federal baseline minimum wage remained at since 2009?",["$5.15 per hour","$7.25 per hour","$10.00 per hour","$12.50 per hour"],1,"州独自の最低賃金が15ドル以上に引き上げられる州が増える一方、連邦政府が定める連邦最低賃金は2009年以来「時給7.25ドル」に据え置かれています。"],
  [15,"What is the name of the tax-advantaged, defined-contribution retirement savings plan sponsored by employers in the United States, named after a section of the Internal Revenue Code?",["Chapter 11","401(k) Plan","501(c)(3)","Title IX"],1,"内国歳入法の条項名に由来するアメリカの代表的な企業型確定拠出年金制度は「401(k)プラン」です（日本版のiDeCoや企業型DCのモデルとなりました）。"],
  [15,"In U.S. business law, which chapter of the United States Bankruptcy Code allows a struggling corporation to reorganize its debts and continue operating?",["Chapter 7","Chapter 11","Chapter 13","Section 230"],1,"日本の民事再生法や会社更生法にあたり、破綻企業が事業を継続しながら再建を図る連邦破産法の条項は「チャプター11（Chapter 11 / 連邦破産法第11条）」です。"],
  [15,"Which two public healthcare programs enacted in 1965 provide health coverage respectively for Americans aged 65+ and for low-income individuals?",["Medicare (65+) and Medicaid (low-income)","Medicaid (65+) and Medicare (low-income)","Social Security and Obamacare","FEMA and COBRA"],0,"1965年に創設されたアメリカの2大公的医療保険は、65歳以上の高齢者・障害者向けの「メディケア（Medicare）」と、低所得者向けの「メディケイド（Medicaid）」です。"],
  [15,"What is the formal legislative name of the 2010 healthcare reform law enacted under President Barack Obama to reduce the number of uninsured Americans?",["Social Security Act","Affordable Care Act (ACA / Obamacare)","Health Maintenance Act","Medicare Modernization Act"],1,"医療保険未加入者（無保険者）を減らすために2010年にオバマ政権下で成立した医療保険制度改革法（オバマケア）の正式略称は「ACA（Affordable Care Act）」です。"],
  [15,"Which 2011 protest movement against economic inequality began in Zuccotti Park in New York's Financial District under the slogan 'We are the 99%'?",["Tea Party Movement","Occupy Wall Street","Fight for $15","March for Science"],1,"上位1%の富裕層への富の集中と経済格差に抗議し、「我々は99%だ（We are the 99%）」を合言葉に2011年に広がった運動は「ウォール街を占拠せよ（Occupy Wall Street）」です。"],

  // ==================== PART 3: アメリカの政治・社会 (200問: #301–#500) ====================
  // 17. 政治①：憲法の基本原理 (#301–#325)
  [16,"In what year was the Constitution of the United States drafted and adopted at the Constitutional Convention in Philadelphia?",["1776","1781","1787","1791"],2,"アメリカ合衆国憲法は1787年にフィラデルフィアの憲法制定会議で採択され、1789年に発効しました。"],
  [16,"What distinction does the U.S. Constitution hold among the national constitutions currently in force around the world?",["The longest written constitution","The oldest written national constitution","The only unwritten constitution","The most frequently rewritten constitution"],1,"アメリカ合衆国憲法は、現存する世界最古の成文憲法として知られています。"],
  [16,"What was the first governing document of the United States (in effect from 1781 to 1789) before the current U.S. Constitution was ratified?",["Mayflower Compact","Articles of Confederation","Declaration of Rights","Albany Plan of Union"],1,"現在の合衆国憲法が制定される前は、各州の主権が強い「連合規約（Articles of Confederation）」が基本法でした。"],
  [16,"Who is known as the 'Father of the Constitution' for his pivotal role in drafting the U.S. Constitution and the Bill of Rights?",["George Washington","Thomas Jefferson","James Madison","Benjamin Franklin"],2,"第4代大統領ジェームズ・マディソンは、合衆国憲法と権利章典の起草における中心的な貢献から「憲法の父」と呼ばれます。"],
  [16,"Who were the three authors of 'The Federalist Papers,' a collection of 85 essays written under the pen name 'Publius' to support ratification of the Constitution?",["Washington, Jefferson, and Adams","Hamilton, Madison, and Jay","Franklin, Paine, and Henry","Marshall, Monroe, and Hancock"],1,"憲法批准を訴えた『ザ・フェデラリスト』は、アレクサンダー・ハミルトン、ジェームズ・マディソン、ジョン・ジェイの3人によって執筆されました。"],
  [16,"With which famous three words does the Preamble to the United States Constitution begin?",["In God We","We the People","Four Score and","When in the"],1,"合衆国憲法の前文（Preamble）は国民主権を象徴する「We the People（われら合衆国の人民は）」という3語で始まります。"],
  [16,"Which compromise at the 1787 Constitutional Convention created a bicameral Congress with equal state representation in the Senate and proportional representation in the House?",["Missouri Compromise","Connecticut Compromise (Great Compromise)","Three-Fifths Compromise","Compromise of 1850"],1,"ロジャー・シャーマンらが提案した「コネチカット妥協（大妥協）」により、上院は各州平等、下院は人口比例とする二院制議会が成立しました。"],
  [16,"What constitutional principle divides government authority among the Legislative, Executive, and Judicial branches?",["Popular Sovereignty","Separation of Powers","Judicial Activism","Unitary Government"],1,"立法・行政・司法の三権を分立させる原則は「権力分立（Separation of Powers）」と呼ばれます。"],
  [16,"What constitutional system allows each of the three branches of government to limit and restrain the powers of the other branches?",["Spoils System","Checks and Balances","Winner-Take-All","Direct Democracy"],1,"三権が相互に暴走を防ぎ均衡を保つ仕組みは「抑制と均衡（Checks and Balances）」と呼ばれます。"],
  [16,"What system of government divides sovereign power between a central national government and individual state governments?",["Parliamentary System","Federalism","Confederation","Monarchy"],1,"連邦政府と州政府がそれぞれ独自の権限を分有する統治形態は「連邦制（Federalism）」と呼ばれます。"],
  [16,"Which branch of the U.S. government is established by Article I of the Constitution?",["The Executive Branch (President)","The Legislative Branch (Congress)","The Judicial Branch (Supreme Court)","The State Governments"],1,"合衆国憲法第1条（Article I）は立法府（連邦議会：Congress）について規定しています。"],
  [16,"Which branch of the U.S. government is established by Article II of the Constitution?",["The Legislative Branch (Congress)","The Executive Branch (President)","The Judicial Branch (Supreme Court)","The Electoral Commission"],1,"合衆国憲法第2条（Article II）は行政府（大統領：President）について規定しています。"],
  [16,"Which branch of the U.S. government is established by Article III of the Constitution?",["The Legislative Branch (Congress)","The Executive Branch (President)","The Judicial Branch (Supreme Court)","The Cabinet"],2,"合衆国憲法第3条（Article III）は司法府（連邦最高裁判所および下級連邦裁判所）について規定しています。"],
  [16,"When a state law conflicts with a valid federal law or the U.S. Constitution, which law takes priority under the Supremacy Clause (Article VI)?",["State Law","Federal Law","Local Municipal Law","Whichever law was passed first"],1,"合衆国憲法第6条の最高法規条項（Supremacy Clause）により、州法が連邦法に反する場合は連邦法（Federal Law）が優先されます。"],
  [16,"What fraction of vote in both houses of Congress is required to propose a constitutional amendment?",["Simple majority (over 1/2)","Three-fifths (3/5)","Two-thirds (2/3)","Three-fourths (3/4)"],2,"憲法改正の発議には、連邦議会の上下両院それぞれで「3分の2（2/3）」以上の賛成が必要です。"],
  [16,"What fraction of the 50 state legislatures must ratify a proposed amendment for it to become part of the U.S. Constitution?",["Simple majority (26 states)","Two-thirds (34 states)","Three-fourths (38 states)","Unanimous (50 states)"],2,"発議された憲法修正条項が成立するためには、全州の「4分の3（3/4＝50州のうち38州）」の批准が必要です。"],
  [16,"How many amendments have been ratified and added to the U.S. Constitution to date?",["10","19","27","50"],2,"合衆国憲法にはこれまでに計27の修正条項（Amendments）が追加されています。"],
  [16,"What are the first ten amendments to the U.S. Constitution, ratified on December 15, 1791, collectively called?",["Articles of Confederation","Bill of Rights","Federalist Papers","Magna Carta"],1,"1791年に批准された合衆国憲法の最初の10の修正条項は「権利章典（Bill of Rights）」と呼ばれます。"],
  [16,"In what year did the new federal government under the U.S. Constitution begin operating with George Washington's inauguration?",["1776","1783","1789","1800"],2,"1789年に合衆国憲法に基づく連邦政府が発足し、ジョージ・ワシントンが初代大統領に就任しました。"],
  [16,"Which clause in Article I, Section 8 grants Congress the implied power to pass laws 'necessary and proper' to carry out its enumerated powers?",["Commerce Clause","Elastic Clause (Necessary and Proper Clause)","Establishment Clause","Due Process Clause"],1,"連邦議会に明示された権限を遂行するために「必要かつ適切」な法律を制定できる条項は、必要適切条項（弾力条項：Elastic Clause）と呼ばれます。"],
  [16,"Which clause of the Constitution forbids the government from establishing a national religion?",["Free Exercise Clause","Establishment Clause","Supremacy Clause","Full Faith and Credit Clause"],1,"修正第1条で国教の樹立を禁止し政教分離を定めている条項は「国教樹立禁止条項（Establishment Clause）」です。"],
  [16,"Under the U.S. Constitution, how often must an official national Census (population count) be conducted to apportion seats in the House of Representatives?",["Every 4 years","Every 5 years","Every 10 years","Every 20 years"],2,"下院議席や選挙人の各州への配分（Apportionment）を決めるため、合衆国憲法は10年ごとの国勢調査（Census）を義務づけています。"],
  [16,"Which chamber of Congress has the sole constitutional power to impeach (bring formal charges against) a President or federal official?",["The Senate","The House of Representatives","The Supreme Court","The Department of Justice"],1,"大統領や連邦高官に対する弾劾の「訴追（Impeachment）」を行う専権は下院（House of Representatives）にあります。"],
  [16,"Which chamber of Congress conducts the impeachment trial and can remove an impeached official by a two-thirds vote?",["The House of Representatives","The Senate","The Supreme Court","The Cabinet"],1,"下院に弾劾訴追された人物の「弾劾裁判」を行い、3分の2以上の賛成で罷免する権限を持つのは上院（Senate）です。"],
  [16,"Who presides over the Senate when the President of the United States is tried for impeachment?",["The Vice President","The Speaker of the House","The Chief Justice of the United States","The Attorney General"],2,"合衆国大統領の弾劾裁判を上院で行う際は、副大統領ではなく連邦最高裁判所長官（Chief Justice）が裁判長を務めます。"],

  // 18. 政治②：憲法修正条項 (#326–#350)
  [17,"Which constitutional amendment protects the freedoms of religion, speech, the press, peaceable assembly, and petition?",["1st Amendment","2nd Amendment","4th Amendment","5th Amendment"],0,"合衆国憲法修正第1条は、信教・言論・報道（出版）・集会・請願の5つの自由を保障しています。"],
  [17,"Which constitutional amendment guarantees the right of the people to keep and bear arms?",["1st Amendment","2nd Amendment","4th Amendment","8th Amendment"],1,"合衆国憲法修正第2条は、規律ある民兵の必要性と「人民が武器を保有し携帯する権利」を規定しています。"],
  [17,"Which constitutional amendment prohibits the quartering of soldiers in private homes without the owner's consent in peacetime?",["2nd Amendment","3rd Amendment","4th Amendment","7th Amendment"],1,"修正第3条は、平時において住宅所有者の同意なしに兵士を民家に宿営させることを禁止しています。"],
  [17,"Which constitutional amendment protects citizens against 'unreasonable searches and seizures' and requires probable cause for warrants?",["3rd Amendment","4th Amendment","5th Amendment","6th Amendment"],1,"修正第4条は、不合理な捜索および押収（逮捕）を禁止し、令状主義を定めています。"],
  [17,"Which constitutional amendment protects against double jeopardy and self-incrimination (giving rise to the phrase 'I plead the Fifth')?",["4th Amendment","5th Amendment","6th Amendment","8th Amendment"],1,"修正第5条は、同一犯罪での二重処罰の禁止、自己負罪拒否特権（黙秘権）、適正手続（デュー・プロセス）を保障しています。"],
  [17,"Which constitutional amendment guarantees a criminal defendant the right to a 'speedy and public trial,' an impartial jury, and assistance of counsel (a lawyer)?",["4th Amendment","5th Amendment","6th Amendment","7th Amendment"],2,"修正第6条は、刑事裁判において迅速で公開された裁判を受ける権利や弁護人依頼権を保障しています。"],
  [17,"Which constitutional amendment preserves the right to a jury trial in federal civil lawsuits exceeding twenty dollars?",["5th Amendment","6th Amendment","7th Amendment","9th Amendment"],2,"修正第7条は、一定額を超えるコモン・ロー上の民事訴訟において陪審裁判を受ける権利を保障しています。"],
  [17,"Which constitutional amendment prohibits excessive bail, excessive fines, and 'cruel and unusual punishments'?",["5th Amendment","6th Amendment","8th Amendment","10th Amendment"],2,"修正第8条は、過度な保釈金や罰金、および「残虐で異常な刑罰（Cruel and Unusual Punishments）」を禁止しています。"],
  [17,"Which constitutional amendment states that powers not delegated to the federal government by the Constitution are reserved to the States or to the people?",["8th Amendment","9th Amendment","10th Amendment","11th Amendment"],2,"修正第10条は、憲法が連邦政府に委任していない権限を「各州または人民に留保する（留保権限）」と定めています。"],
  [17,"Which three amendments (the 13th, 14th, and 15th), ratified between 1865 and 1870 after the Civil War, are collectively called the 'Reconstruction Amendments'?",["1st, 2nd, and 3rd Amendments","13th, 14th, and 15th Amendments","16th, 17th, and 18th Amendments","19th, 20th, and 21st Amendments"],1,"南北戦争後の再建期に批准された修正第13条（奴隷制廃止）・第14条（市民権と平等保護）・第15条（黒人男性の投票権）は「再建修正条項」と呼ばれます。"],
  [17,"Which constitutional amendment, ratified in 1865, abolished slavery and involuntary servitude throughout the United States?",["12th Amendment","13th Amendment","14th Amendment","15th Amendment"],1,"1865年に批准された合衆国憲法修正第13条によって、全米で奴隷制度が廃止されました。"],
  [17,"Which constitutional amendment, ratified in 1868, defines birthright citizenship and contains the 'Due Process' and 'Equal Protection' clauses?",["13th Amendment","14th Amendment","15th Amendment","16th Amendment"],1,"1868年批准の修正第14条は、出生地主義による市民権と、州による適正手続および「法の下の平等（Equal Protection）」を規定しています。"],
  [17,"Which constitutional amendment, ratified in 1870, prohibits denying a citizen the right to vote based on 'race, color, or previous condition of servitude'?",["13th Amendment","14th Amendment","15th Amendment","19th Amendment"],2,"1870年批准の修正第15条は、人種や肌の色、過去の奴隷身分を理由とする投票権の制限を禁止しました。"],
  [17,"Which constitutional amendment, ratified in 1913 during the Progressive Era, established the direct election of U.S. Senators by popular vote?",["15th Amendment","16th Amendment","17th Amendment","18th Amendment"],2,"1913年批准の修正第17条により、それまで州議会が選んでいた連邦上院議員を州民の直接選挙で選ぶ制度に改められました（修正第16条は連邦所得税）。"],
  [17,"Which constitutional amendment instituted nationwide Prohibition of alcohol in 1919, and which amendment repealed it in 1933?",["16th and 20th Amendments","18th and 21st Amendments","17th and 22nd Amendments","19th and 24th Amendments"],1,"1919年の修正第18条で禁酒法が制定され、1933年の修正第21条によって廃止されました（憲法修正条項で唯一廃止された条項です）。"],
  [17,"Which constitutional amendment, ratified in August 1920, guaranteed women the right to vote across the United States?",["15th Amendment","18th Amendment","19th Amendment","22nd Amendment"],2,"1920年に批准された合衆国憲法修正第19条により、性別による投票権の否定が禁止され、女性参政権が確立されました。"],
  [17,"Which constitutional amendment, ratified in 1933 ('Lame Duck Amendment'), moved the presidential Inauguration Day from March 4 to January 20?",["19th Amendment","20th Amendment","22nd Amendment","25th Amendment"],1,"1933年批准の修正第20条（レームダック修正）により、大統領就任式の日程が3月4日から現在の1月20日に短縮・変更されました。"],
  [17,"Which constitutional amendment, ratified in 1951 after Franklin D. Roosevelt's four terms, limits a President to being elected twice (two terms)?",["20th Amendment","21st Amendment","22nd Amendment","25th Amendment"],2,"フランクリン・D・ルーズベルトの4選を受け、1951年批准の修正第22条によって大統領の任期は最高2期までに制限されました。"],
  [17,"Which constitutional amendment, ratified in 1961, granted residents of Washington, D.C. the right to vote in presidential elections (3 electoral votes)?",["22nd Amendment","23rd Amendment","24th Amendment","26th Amendment"],1,"1961年批准の修正第23条により、州ではない首都ワシントンD.C.に大統領選挙の選挙人3名が割り当てられました。"],
  [17,"Which constitutional amendment, ratified in 1964 during the Civil Rights Movement, abolished the 'poll tax' (人頭税) in federal elections?",["22nd Amendment","23rd Amendment","24th Amendment","25th Amendment"],2,"1964年批准の修正第24条により、南部などで黒人や貧困層の投票を妨げていた人頭税（Poll Tax）の賦課が連邦選挙で禁止されました。"],
  [17,"Which constitutional amendment, ratified in 1967 after JFK's assassination, clarifies presidential succession, filling a Vice Presidential vacancy, and presidential disability?",["22nd Amendment","24th Amendment","25th Amendment","27th Amendment"],2,"1967年批准の修正第25条は、大統領の欠員・職務不能時の継承手続や、副大統領が空席となった際の指名・議会承認手続を定めています。"],
  [17,"Which constitutional amendment, ratified in 1971 during the Vietnam War ('Old enough to fight, old enough to vote'), lowered the national voting age from 21 to 18?",["23rd Amendment","24th Amendment","25th Amendment","26th Amendment"],3,"ベトナム戦争中の徴兵年齢との不均衡への批判から、1971年批准の修正第26条で選挙権年齢が21歳から18歳に引き下げられました。"],
  [17,"Which constitutional amendment, originally proposed in 1789 by James Madison and finally ratified in 1992, is the most recent (27th) amendment, regulating congressional pay raises?",["25th Amendment","26th Amendment","27th Amendment","28th Amendment"],2,"1789年に提案され202年後の1992年に批准された修正第27条（議員報酬の変更は次の下院選挙後まで発効しない）が、直近の修正条項です。"],
  [17,"Which constitutional amendment, ratified in 1804 after the tied election of 1800, required electors to cast separate ballots for President and Vice President?",["10th Amendment","11th Amendment","12th Amendment","13th Amendment"],2,"1800年大統領選でジェファソンとアーロン・バーが同票となった混乱を受け、1804年の修正第12条で大統領と副大統領を別々に投票する方式に改められました。"],
  [17,"What was the name of the proposed constitutional amendment guaranteeing equal rights regardless of sex that passed Congress in 1972 but fell short of state ratification by its deadline?",["Title IX","Equal Rights Amendment (ERA)","Voting Rights Amendment","Balanced Budget Amendment"],1,"性別による権利平等を明記する「男女平等憲法修正条項（ERA）」は1972年に連邦議会を通過しましたが、期限内に38州（4分の3）の批准に達しませんでした。"],

  // 19. 政治③：大統領職と行政府 (#351–#375)
  [18,"What are the three constitutional qualifications required to become President of the United States under Article II?",["At least 30 years old, naturalized citizen, 10 years residency","At least 35 years old, natural-born U.S. citizen, 14 years U.S. residency","At least 40 years old, natural-born citizen, 20 years residency","At least 25 years old, U.S. citizen, 7 years residency"],1,"合衆国大統領の被選挙権要件は「35歳以上」「出生による合衆国市民（アメリカ生まれ）」「14年以上の米国居住」の3つです。"],
  [18,"How many years is one presidential term in the United States?",["2 years","4 years","5 years","6 years"],1,"アメリカ合衆国大統領の任期は1期あたり4年間です。"],
  [18,"On what date in January following a presidential election is the President inaugurated at the U.S. Capitol?",["January 1","January 15","January 20","February 4"],2,"大統領就任式（Inauguration Day）は、選挙翌年の1月20日正午に行われます。"],
  [18,"What is the street address of the White House, the official residence and workplace of the U.S. President in Washington, D.C.?",["10 Downing Street","1600 Pennsylvania Avenue NW","11 Wall Street","350 Fifth Avenue"],1,"ホワイトハウスの所在地はワシントンD.C.の「ペンシルベニア通り1600番地（1600 Pennsylvania Avenue NW）」です。"],
  [18,"What is the name of the President's formal oval-shaped office located in the West Wing of the White House?",["The Situation Room","The Oval Office","The Cabinet Room","The Blue Room"],1,"ホワイトハウス西棟（ウエストウイング）にある大統領執務室は、その形状から「オーバル・オフィス（Oval Office）」と呼ばれます。"],
  [18,"What is the name of the President's country retreat located in the wooded hills of Frederick County, Maryland?",["Mount Vernon","Camp David","Mar-a-Lago","Monticello"],1,"メリーランド州の山中にあるアメリカ大統領専用の別荘（保養施設）は「キャンプ・デービッド（Camp David）」です。"],
  [18,"What is the official air traffic control call sign of any United States Air Force aircraft carrying the President of the United States?",["Marine One","Air Force One","Executive One","Eagle One"],1,"合衆国大統領が搭乗する空軍機のコールサインは「エアフォース・ワン（Air Force One）」（海兵隊ヘリはマリーン・ワン）です。"],
  [18,"What annual speech does the President deliver to a joint session of Congress (usually in January or February) to report on the nation's condition and legislative agenda?",["Inaugural Address","State of the Union Address","Farewell Address","Fireside Chat"],1,"大統領が連邦議会の上下両院合同会議で施政方針や国の状況を報告する年次演説は「一般教書演説（State of the Union Address）」です。"],
  [18,"Under Article II of the Constitution, what supreme military title and authority does the President hold over the U.S. Armed Forces?",["Chairman of the Joint Chiefs","Commander-in-Chief","Secretary of Defense","Five-Star General"],1,"合衆国憲法第2条により、文民である大統領が陸海空軍等の最高司令官（Commander-in-Chief）を務めます（シビリアン・コントロール）。"],
  [18,"When the President vetoes a bill passed by Congress, what vote is required in both the House and the Senate to override the presidential veto?",["Simple majority (over 1/2)","Three-fifths (3/5)","Two-thirds (2/3)","Three-fourths (3/4)"],2,"大統領が法案に拒否権（Veto）を行使した場合でも、上下両院それぞれで出席議員の「3分の2（2/3）」以上が再可決すれば拒否権を覆して法律が成立します。"],
  [18,"What is the name of the directive issued directly by the President to manage operations of the federal government without requiring Congressional passage?",["Constitutional Amendment","Executive Order (大統領令)","Writ of Certiorari","Filibuster"],1,"大統領が行政府に対して直接発出する命令は「大統領令（Executive Order）」と呼ばれます。"],
  [18,"Under the Presidential Succession Act of 1947, who are the first three officials in the line of succession if the President dies, resigns, or is removed?",["1. Vice President, 2. Secretary of State, 3. Attorney General","1. Vice President, 2. Speaker of the House, 3. President pro tempore of the Senate","1. Vice President, 2. Chief Justice, 3. Speaker of the House","1. Speaker of the House, 2. Vice President, 3. Secretary of Defense"],1,"大統領継承順位は、1位：副大統領、2位：下院議長（Speaker of the House）、3位：上院仮議長、4位：国務長官（以下、閣僚の省創設順）です。"],
  [18,"What is the primary constitutional duty of the Vice President of the United States within the Legislative Branch?",["Speaker of the House","President of the Senate (casting tie-breaking votes)","Chairman of the Judiciary Committee","Majority Leader"],1,"副大統領は憲法上「上院議長（President of the Senate）」を兼任し、上院の採決が50対50の可否同数となった場合にのみ決定票（Tie-breaking vote）を投じます。"],
  [18,"Which chamber of Congress has the constitutional power of 'Advice and Consent' to confirm the President's Cabinet nominees, ambassadors, and federal judges?",["The House of Representatives","The Senate","Both chambers jointly","Neither chamber"],1,"大統領が指名する閣僚（長官）、大使、連邦判事の人事を「助言と承認（Advice and Consent）」によって承認する権限は上院（Senate）にあります。"],
  [18,"How many executive departments (such as State, Treasury, Defense, and Justice) currently make up the President's Cabinet?",["8","12","15","25"],2,"現在、アメリカ連邦政府の大統領内閣を構成する中央省庁（Executive Departments）は15省あります。"],
  [18,"Which Cabinet official is the oldest Cabinet post (established in 1789), heads U.S. foreign affairs and diplomacy, and is 4th in the presidential line of succession?",["Secretary of Defense","Secretary of State (国務長官)","Attorney General","National Security Advisor"],1,"他国の外務大臣に相当する「国務長官（Secretary of State）」は1789年に最初に設置された筆頭閣僚（初代はジェファソン）で、継承順位第4位です。"],
  [18,"What is the title of the head of the U.S. Department of Justice, who serves as the chief law enforcement officer of the federal government?",["Secretary of Justice","Attorney General (司法長官)","Solicitor General","Chief Justice"],1,"司法省（Department of Justice）のトップだけは「Secretary」ではなく「Attorney General（司法長官）」と呼ばれます。"],
  [18,"What is the five-sided headquarters building of the United States Department of Defense, located in Arlington, Virginia across the Potomac River?",["The Capitol","The Pentagon","Fort Knox","Langley"],1,"バージニア州アーリントンにある国防総省（Department of Defense）の本庁舎は、五角形の巨大な建物であることから「ペンタゴン（The Pentagon）」と呼ばれます。"],
  [18,"Which was the most recently created federal Cabinet department, established in 2002 in response to the September 11 terrorist attacks?",["Department of Veterans Affairs","Department of Homeland Security (国土安全保障省)","Department of Energy","Department of Education"],1,"2001年の9.11同時多発テロを受け、2002年にジョージ・W・ブッシュ政権下で15番目の省として「国土安全保障省（DHS）」が創設されました。"],
  [18,"Who became the first female Vice President, as well as the first African American and South Asian American Vice President, in U.S. history in January 2021?",["Hillary Clinton","Nancy Pelosi","Kamala Harris","Condoleezza Rice"],2,"カマラ・ハリス（Kamala Harris）は2021年1月に就任し、アメリカ史上初の女性・アフリカ系・南アジア系の副大統領となりました。"],
  [18,"Who was appointed by President Franklin D. Roosevelt in 1933 as Secretary of Labor, becoming the very first woman to serve in a U.S. presidential Cabinet?",["Eleanor Roosevelt","Frances Perkins","Madeleine Albright","Janet Yellen"],1,"フランシス・パーキンスは1933年にフランクリン・D・ルーズベルト政権の労働長官に任命され、米国史上初の女性閣僚となりました。"],
  [18,"Who was appointed by President Bill Clinton in 1997 as the first female United States Secretary of State?",["Madeleine Albright","Condoleezza Rice","Hillary Clinton","Susan Rice"],0,"マドレーン・オルブライトは1997年にクリントン政権下でアメリカ史上初の女性国務長官に就任しました（コンドリーザ・ライスは黒人女性初の国務長官）。"],
  [18,"Which federal intelligence agency, headquartered in Langley, Virginia and established in 1947, gathers foreign intelligence for national security?",["FBI (Federal Bureau of Investigation)","CIA (Central Intelligence Agency)","ATF","TSA"],1,"1947年の国家安全保障法で設立され、バージニア州ラングレーに本部を置く対外情報機関は「中央情報局（CIA）」（国内捜査は司法省傘下のFBI）です。"],
  [18,"Which federal law enforcement agency is responsible for protecting the President, Vice President, their families, and visiting foreign heads of state?",["U.S. Marshals Service","United States Secret Service","National Guard","Border Patrol"],1,"大統領や副大統領、外国元首の身辺警護（および通貨偽造の捜査）を担う連邦法執行機関は「シークレット・サービス（United States Secret Service）」です。"],
  [18,"What is the informal title given to the hostess of the White House, traditionally the wife of the President of the United States?",["Premier Lady","First Lady","Chancellor","State Matron"],1,"アメリカ大統領の配偶者（伝統的に夫人）でホワイトハウスのホステス役を務める人物は「ファーストレディ（First Lady）」と呼ばれます。"],

  // 20. 政治④：歴代大統領の業績 (#376–#400)
  [19,"Who served as the 1st President of the United States (1789–1797), was the only President unanimously elected by the Electoral College, and stepped down after two terms?",["John Adams","George Washington","Thomas Jefferson","James Madison"],1,"初代大統領ジョージ・ワシントンは特定の政党に属さず全会一致で選出され、2期8年で自ら退任して平和的な政権移譲の先例を作りました。"],
  [19,"Which 2nd U.S. President became the first President to reside in the newly built White House in Washington, D.C. in November 1800?",["George Washington","John Adams","Thomas Jefferson","James Monroe"],1,"初代ワシントンはフィラデルフィアなどで執務したため、1800年に完成したワシントンD.C.のホワイトハウスに最初に入居したのは第2代ジョン・アダムズ大統領です。"],
  [19,"Which 3rd U.S. President drafted the Declaration of Independence, founded the University of Virginia, and completed the Louisiana Purchase in 1803?",["John Adams","Thomas Jefferson","James Madison","John Quincy Adams"],1,"第3代トーマス・ジェファソン大統領は独立宣言の起草者であり、1803年にフランスからルイジアナ買収を行って国土を倍増させました。"],
  [19,"Which two sets of fathers and sons have both served as President of the United States?",["John Adams & John Quincy Adams / George H. W. Bush & George W. Bush","Theodore Roosevelt & Franklin D. Roosevelt / Benjamin Harrison & William Henry Harrison","James Madison & James Monroe / Andrew Jackson & Andrew Johnson","Thomas Jefferson & John Adams / Bill Clinton & Hillary Clinton"],0,"親子でアメリカ大統領を務めたのは、第2代ジョン・アダムズと第6代ジョン・クインシー・アダムズ、および第41代ジョージ・H・W・ブッシュと第43代ジョージ・W・ブッシュの2組です。"],
  [19,"Which 7th U.S. President, nicknamed 'Old Hickory,' championed the common man ('Jacksonian Democracy') and is depicted on the $20 bill?",["James Monroe","Andrew Jackson","Martin Van Buren","James K. Polk"],1,"第7代アンドリュー・ジャクソン大統領は「オールド・ヒッコリー」の愛称で親しまれ、大衆民主主義（ジャクソニアン・デモクラシー）を推進し、20ドル紙幣に描かれています。"],
  [19,"Which 16th U.S. President led the Union through the Civil War, issued the Emancipation Proclamation (1863), and delivered the Gettysburg Address?",["Ulysses S. Grant","Abraham Lincoln","Andrew Johnson","James Buchanan"],1,"共和党初の第16代エイブラハム・リンカーン大統領は南北戦争で北軍を率い、1863年に奴隷解放宣言とゲティスバーグ演説を行いました。"],
  [19,"Where was President Abraham Lincoln assassinated by actor John Wilkes Booth on April 14, 1865, just days after the Civil War ended?",["Independence Hall in Philadelphia","Ford's Theatre in Washington, D.C.","Dealey Plaza in Dallas","Federal Hall in New York"],1,"リンカーン大統領はリー将軍の降伏から5日後の1865年4月14日、ワシントンD.C.のフォード劇場（Ford's Theatre）で観劇中に暗殺されました。"],
  [19,"Which four U.S. Presidents in history were assassinated while in office?",["Lincoln, Garfield, McKinley, and Kennedy","Lincoln, Jackson, Roosevelt, and Kennedy","Washington, Lincoln, Harding, and Nixon","Lincoln, Harrison, Taylor, and Kennedy"],0,"在任中に暗殺されたアメリカ大統領は、エイブラハム・リンカーン（1865）、ジェームズ・ガーフィールド（1881）、ウィリアム・マッキンリー（1901）、ジョン・F・ケネディ（1963）の4人です。"],
  [19,"Who became the youngest person in U.S. history to assume the presidency (at age 42 in 1901 after McKinley's assassination) and promoted the 'Square Deal'?",["John F. Kennedy","Theodore Roosevelt","Bill Clinton","Barack Obama"],1,"第26代セオドア・ルーズベルトはマッキンリー大統領暗殺に伴い42歳で昇格し、米国史上最年少で大統領に就任しました（選挙で選ばれた最年少は43歳のケネディ）。"],
  [19,"Which U.S. President won the 1906 Nobel Peace Prize—the first American ever to win a Nobel Prize—for mediating the Treaty of Portsmouth to end the Russo-Japanese War?",["William Howard Taft","Theodore Roosevelt","Woodrow Wilson","Jimmy Carter"],1,"セオドア・ルーズベルト大統領は1905年の日露戦争講和（ポーツマス条約）を仲介した功績で、1906年にアメリカ人初のノーベル賞（平和賞）を受賞しました。"],
  [19,"Which 28th U.S. President led the nation during World War I, issued the 'Fourteen Points,' and won the 1919 Nobel Peace Prize for founding the League of Nations?",["Theodore Roosevelt","Woodrow Wilson","Warren G. Harding","Calvin Coolidge"],1,"第28代ウッドロウ・ウィルソン大統領は第一次世界大戦後に国際連盟の創設を提唱し、1919年にノーベル平和賞を受賞しました。"],
  [19,"Which 32nd U.S. President was the only President elected to four terms (1933–1945), launched the 'New Deal,' and articulated the 'Four Freedoms'?",["Herbert Hoover","Franklin D. Roosevelt","Harry S. Truman","Dwight D. Eisenhower"],1,"第32代フランクリン・D・ルーズベルト（FDR）は史上唯一4選を果たし、ニューディール政策と「四つの自由（Four Freedoms）」を提唱して大恐慌と第二次世界大戦を指導しました。"],
  [19,"Which 33rd U.S. President took office upon FDR's death in April 1945, authorized the use of atomic weapons, and launched the 'Truman Doctrine' and Marshall Plan?",["Harry S. Truman","Dwight D. Eisenhower","Adlai Stevenson","George Marshall"],0,"第33代ハリー・S・トルーマン大統領は1945年4月に昇格して第二次世界大戦を終結させ、冷戦初期のトルーマン・ドクトリン（封じ込め政策）を推進しました。"],
  [19,"Which 34th U.S. President, formerly the Supreme Allied Commander in Europe on D-Day, authorized the Interstate Highway System and NASA?",["Harry S. Truman","Dwight D. Eisenhower","John F. Kennedy","Lyndon B. Johnson"],1,"ノルマンディー上陸作戦の連合国軍最高司令官だった第34代ドワイト・D・アイゼンハワー大統領は、1950年代に州間高速道路網（Interstate Highway System）を整備しました。"],
  [19,"Which 35th U.S. President was the first Roman Catholic President, the youngest *elected* President (at age 43), and was assassinated in Dallas, Texas on November 22, 1963?",["Dwight D. Eisenhower","John F. Kennedy","Lyndon B. Johnson","Richard Nixon"],1,"第35代ジョン・F・ケネディ大統領は選挙で選ばれた最年少（43歳）かつ初のカトリック教徒の大統領で、1963年11月にテキサス州ダラスで暗殺されました。"],
  [19,"Which 36th U.S. President championed the 'Great Society' domestic programs and signed the Civil Rights Act of 1964, Voting Rights Act of 1965, and Medicare?",["John F. Kennedy","Lyndon B. Johnson","Richard Nixon","Hubert Humphrey"],1,"ケネディ暗殺後に昇格した第36代リンドン・ジョンソン大統領は「偉大な社会（Great Society）」を掲げ、1964年公民権法やメディケア・メディケイドを実現しました。"],
  [19,"Which 37th U.S. President resigned on August 9, 1974 as a result of the Watergate scandal—making him the only U.S. President in history to resign from office?",["Lyndon B. Johnson","Richard Nixon","Gerald Ford","Jimmy Carter"],1,"第37代リチャード・ニクソン大統領は、ウォーターゲート事件による弾劾訴追の直前に辞任した米国史上唯一の大統領です。"],
  [19,"Which 38th U.S. President succeeded Richard Nixon under the 25th Amendment, becoming the only person to serve as President without being elected to either the presidency or vice presidency?",["Spiro Agnew","Gerald Ford","Nelson Rockefeller","Jimmy Carter"],1,"第38代ジェラルド・フォード大統領は修正第25条に基づき副大統領に指名された後に大統領へ昇格したため、正副大統領選挙を経ずに就任した唯一の大統領です。"],
  [19,"Which 40th U.S. President, a former Hollywood actor and Governor of California, promoted 'Reaganomics' and helped bring an end to the Cold War?",["Jimmy Carter","Ronald Reagan","George H. W. Bush","Bill Clinton"],1,"映画俳優・カリフォルニア州知事出身の第40代ロナルド・レーガン大統領は、1981年からレーガノミクスと強いアメリカを推進しました。"],
  [19,"Which 44th U.S. President (2009–2017) was the first African American President, signed the Affordable Care Act, and was awarded the 2009 Nobel Peace Prize?",["Bill Clinton","Barack Obama","Joe Biden","Colin Powell"],1,"第44代バラク・オバマ大統領はアメリカ初のアフリカ系大統領であり、2009年にノーベル平和賞を受賞し、2010年にオバマケア（ACA）を成立させました。"],
  [19,"Which four U.S. Presidents have been awarded the Nobel Peace Prize (either while in office or after leaving office)?",["Theodore Roosevelt, Woodrow Wilson, Jimmy Carter, and Barack Obama","Abraham Lincoln, FDR, JFK, and Barack Obama","Woodrow Wilson, Dwight Eisenhower, Ronald Reagan, and Bill Clinton","Thomas Jefferson, Theodore Roosevelt, Harry Truman, and Jimmy Carter"],0,"ノーベル平和賞を受賞したアメリカ大統領は、セオドア・ルーズベルト（1906）、ウッドロウ・ウィルソン（1919）、ジミー・カーター（2002）、バラク・オバマ（2009）の4名です。"],
  [19,"Which two U.S. Presidents are the only ones in history to serve two non-consecutive terms (elected as the 22nd & 24th President, and the 45th & 47th President)?",["John Adams and John Quincy Adams","Grover Cleveland (22nd & 24th) and Donald Trump (45th & 47th)","Theodore Roosevelt and Franklin D. Roosevelt","Andrew Jackson and Richard Nixon"],1,"連続しない2期の任期を務めた大統領は、第22代・第24代のグローバー・クリーブランドと、第45代・第47代のドナルド・トランプ（2025年1月再就任）の2人のみです。"],
  [19,"Which three U.S. Presidents in history have been impeached by the House of Representatives (though all three were acquitted by the Senate)?",["Andrew Johnson, Bill Clinton, and Donald Trump (twice)","Abraham Lincoln, Richard Nixon, and Bill Clinton","Andrew Jackson, Richard Nixon, and Donald Trump","Andrew Johnson, Richard Nixon, and Ronald Reagan"],0,"下院によって弾劾訴追（Impeachment）された大統領は、アンドリュー・ジョンソン（1868）、ビル・クリントン（1998）、ドナルド・トランプ（2019・2021の2回）の3名です（全員上院で無罪、ニクソンは下院本会議採決前に辞任）。"],
  [19,"Which four U.S. Presidents are sculpted onto Mount Rushmore National Memorial in South Dakota?",["Washington, Adams, Jefferson, and Lincoln","Washington, Jefferson, Theodore Roosevelt, and Lincoln","Washington, Jackson, Lincoln, and Franklin D. Roosevelt","Washington, Jefferson, Madison, and Wilson"],1,"サウスダコタ州のマウント・ラシュモアに彫られている4人の大統領は、ジョージ・ワシントン、トーマス・ジェファソン、セオドア・ルーズベルト、エイブラハム・リンカーンです。"],
  [19,"What is the highest civilian award of the United States, established by President John F. Kennedy in 1963 and bestowed by the President?",["Medal of Honor","Presidential Medal of Freedom (大統領自由勲章)","Purple Heart","Pulitzer Prize"],1,"大統領から文民に授与されるアメリカ最高の勲章は「大統領自由勲章（Presidential Medal of Freedom）」（軍人の最高勲章は名誉勲章：Medal of Honor）です。"],

  // 21. 政治⑤：大統領選挙と政党 (#401–#425)
  [20,"When is the U.S. general presidential election held every four years?",["First Tuesday in November","Tuesday after the first Monday in November","Second Thursday in November","Last Monday in October"],1,"アメリカの大統領選挙（および中間選挙）の一般投票日は、1845年の連邦法により「11月の第1月曜日の翌日の火曜日（11月2日〜8日の間）」と定められています。"],
  [20,"What is the constitutional body of electors that formally elects the President and Vice President of the United States?",["The Federal Election Commission","The Electoral College (選挙人団)","The National Convention","The Congressional Caucus"],1,"アメリカ大統領選挙は国民の直接投票ではなく、各州に割り当てられた選挙人による間接選挙「選挙人団（Electoral College）」方式で行われます。"],
  [20,"How many total electoral votes are in the Electoral College, and what is the minimum majority needed to win the presidency?",["435 total / 218 to win","500 total / 251 to win","538 total / 270 to win","535 total / 268 to win"],2,"選挙人の総数は538人（下院435＋上院100＋ワシントンD.C.3）で、当選には過半数の270票以上の獲得が必要です。"],
  [20,"How is the number of Electoral College votes allocated to each of the 50 states determined?",["Every state gets 10 electoral votes","Equal to the state's total representation in Congress (2 Senators + its number of House Representatives)","Based solely on the state's land area","Based on the state's tax contribution"],1,"各州の選挙人数は、その州の連邦議会議員の総数（上院議員2名＋人口比例で配分される下院議員数、最低3名）と同数になります。"],
  [20,"Which two U.S. states currently have the largest number of electoral votes in the Electoral College (54 votes and 40 votes, respectively)?",["California (1st) and New York (2nd)","California (1st) and Texas (2nd)","Texas (1st) and Florida (2nd)","California (1st) and Florida (2nd)"],1,"人口に比例するため、選挙人数が最も多いのは1位カリフォルニア州（54人）、2位テキサス州（40人）、3位フロリダ州（30人）、4位ニューヨーク州（28人）です。"],
  [20,"What method do 48 states and Washington, D.C. use to award their electoral votes, giving all of a state's electors to the statewide popular vote winner?",["Proportional Representation","Winner-Take-All System (勝者総取り方式)","Ranked-Choice Voting","Runoff System"],1,"全米50州のうち48州とワシントンD.C.では、州内で1票でも多く得票した候補がその州の選挙人をすべて獲得する「勝者総取り方式（Winner-Take-All）」を採用しています。"],
  [20,"Which are the only two U.S. states that do NOT use the statewide winner-take-all rule, instead awarding electoral votes partly by congressional district?",["Alaska and Hawaii","Maine and Nebraska","Vermont and New Hampshire","Nevada and Arizona"],1,"勝者総取り方式をとらず、下院選挙区ごとの勝者にも選挙人を配分する方式（District System）を採っているのは、メイン州とネブラスカ州の2州のみです。"],
  [20,"If no presidential candidate wins a majority of 270 electoral votes (such as a 269–269 tie), which body chooses the President (with each state delegation casting one vote)?",["The Supreme Court","The House of Representatives","The Senate","The State Governors"],1,"選挙人投票で誰も過半数の270票に達しなかった場合、合衆国憲法修正第12条により、下院（House of Representatives）が各州1票として大統領を選出し、上院が副大統領を選出します。"],
  [20,"In which two 21st-century presidential elections did the winner of the Electoral College lose the nationwide Popular Vote?",["2000 (George W. Bush) and 2016 (Donald Trump)","2004 (George W. Bush) and 2012 (Barack Obama)","2008 (Barack Obama) and 2020 (Joe Biden)","2000 (Al Gore) and 2024 (Donald Trump)"],0,"勝者総取り方式のため、21世紀では2000年（ブッシュ対ゴア）と2016年（トランプ対クリントン）の2回、一般投票（Popular Vote）で下回った候補が選挙人票で勝利しました。"],
  [20,"What are the two major political parties that dominate the contemporary two-party system in the United States?",["Federalist Party and Whig Party","Democratic Party and Republican Party","Labour Party and Conservative Party","Libertarian Party and Green Party"],1,"現代アメリカの二大政党は、民主党（Democratic Party）と共和党（Republican Party）です。"],
  [20,"Which animals serve as the traditional symbols of the Democratic Party and the Republican Party, respectively, popularized by 19th-century cartoonist Thomas Nast?",["Donkey (Democratic) and Elephant (Republican)","Elephant (Democratic) and Donkey (Republican)","Eagle (Democratic) and Lion (Republican)","Bear (Democratic) and Bull (Republican)"],0,"19世紀の風刺画家トーマス・ナストの挿絵以来、民主党のシンボルは「ロバ（Donkey）」、共和党のシンボルは「象（Elephant）」として定着しています。"],
  [20,"What is the common three-letter nickname for the Republican Party, which was founded in 1854 by anti-slavery activists?",["DNC","GOP (Grand Old Party)","NRA","AFL"],1,"1854年に奴隷制拡大反対派によって結成された共和党は、「GOP（Grand Old Party＝誇り高き伝統の党）」の通称で呼ばれます。"],
  [20,"On U.S. election maps since the year 2000, which colors represent states won by the Republican Party and the Democratic Party, respectively?",["Red (Republican) and Blue (Democratic)","Blue (Republican) and Red (Democratic)","Green (Republican) and Yellow (Democratic)","White (Republican) and Blue (Democratic)"],0,"アメリカの選挙報道マップでは、共和党が優勢な州を「赤い州（Red States）」、民主党が優勢な州を「青い州（Blue States）」と呼びます。"],
  [20,"What term describes tightly contested states (such as Pennsylvania, Michigan, Wisconsin, Georgia, and Arizona) where either major party has a realistic chance of winning?",["Safe States","Swing States (Battleground States)","Territory States","Primary States"],1,"選挙ごとに民主党と共和党の間で勝敗が揺れ動き、大統領選の勝敗を左右する激戦州は「スイング・ステート（Swing States / 接戦州）」と呼ばれます。"],
  [20,"What are the state-level contests held from winter to spring of an election year to select party delegates for the presidential nomination?",["Midterm Elections","Primary Elections and Caucuses (予備選挙・党員集会)","Recall Elections","Referendums"],1,"大統領選挙の年の前半に各党の候補者（代議員）を選出する手続きは「予備選挙（Primary elections）」および「党員集会（Caucuses）」です。"],
  [20,"Which Midwestern state and which New England state have traditionally held the nation's first caucus and first primary election, respectively?",["Ohio (Caucus) and Massachusetts (Primary)","Iowa (Caucus) and New Hampshire (Primary)","Illinois (Caucus) and Vermont (Primary)","Minnesota (Caucus) and Maine (Primary)"],1,"大統領候補指名争いの幕開けとして伝統的に注目されてきたのは、アイオワ州の党員集会（Iowa Caucus）とニューハンプシャー州の予備選挙（New Hampshire Primary）です。"],
  [20,"What is the name of the crucial day in February or March of a presidential election year when the largest number of U.S. states hold primary elections simultaneously?",["Black Friday","Super Tuesday","Cyber Monday","Election Tuesday"],1,"予備選挙の天王山として、2月〜3月の火曜日に多くの州が一斉に予備選・党員集会を行う日は「スーパー・チューズデー（Super Tuesday）」と呼ばれます。"],
  [20,"At which major party event held in the summer of a presidential election year do state delegates officially nominate their party's candidates for President and Vice President?",["State of the Union","National Party Convention (全国党大会)","Electoral College Meeting","Inauguration Ceremony"],1,"夏の7月〜8月に開催される各党の「全国党大会（Democratic / Republican National Convention）」で、正副大統領候補が正式に指名されます。"],
  [20,"What are the congressional and state elections held in November two years into a President's four-year term called?",["By-elections","Midterm Elections (中間選挙)","Runoff Elections","General Primaries"],1,"大統領の4年の任期の折り返し地点（2年目の11月）に行われる連邦議会選挙（下院全議席・上院の3分の1）や州知事選挙は「中間選挙（Midterm Elections）」と呼ばれます。"],
  [20,"What political term (coined in 1812 after Massachusetts Governor Elbridge Gerry) refers to manipulating electoral district boundaries to favor one party or class?",["Filibustering","Gerrymandering (ゲリマンダー)","Logrolling","Pork-barreling"],1,"特定の政党や候補者に有利になるよう選挙区の区割りを不自然に改変する行為は、1812年のマサチューセッツ州知事の名とサラマンダー（火トカゲ）を合わせた「ゲリマンダー（Gerrymandering）」と呼ばれます。"],
  [20,"What does the acronym 'PAC' stand for in U.S. campaign finance—an organization that pools campaign contributions to support or oppose candidates?",["Presidential Advisory Council","Political Action Committee (政治活動委員会)","Public Affairs Commission","Party Alliance Caucus"],1,"候補者や政治課題への選挙資金集め・支援を行う団体「PAC（パック）」は「Political Action Committee（政治活動委員会）」の略称です。"],
  [20,"Which independent regulatory agency was created in 1974 after the Watergate scandal to enforce campaign finance laws in federal elections?",["SEC","FEC (Federal Election Commission)","FCC","FTC"],1,"連邦選挙における政治資金規正法を執行・監視する独立行政機関は「連邦選挙委員会（FEC: Federal Election Commission）」です。"],
  [20,"What is the name of the state-level procedure (used notably in California in 2003) that allows voters to remove an elected state official from office before their term ends?",["Impeachment","Recall Election (リコール投票)","Initiative","Caucus"],1,"州知事などの公選職を任期満了前に有権者の署名と住民投票によって解職する制度は「リコール（Recall）」（連邦レベルの大統領や連邦議員にはリコール制度はなく弾劾のみ）です。"],
  [20,"What state-level direct democracy mechanism allows citizens to propose a new state law or state constitutional amendment by gathering petition signatures to put it on the ballot?",["Ballot Initiative (住民発議 / イニシアティブ)","Veto","Cloture","Censure"],0,"一定の有権者署名を集めて住民自身が法案や州憲法改正案を直接投票にかける制度は「イニシアティブ（Initiative / 住民発議）」と呼ばれます。"],
  [20,"Unlike in Japan where local governments automatically mail voting tickets to registered residents, what must most U.S. citizens (except in North Dakota) do before they can vote?",["Pay a poll tax","Complete Voter Registration (有権者登録)","Pass a literacy test","Join a political party"],1,"アメリカでは投票するために、有権者自身が事前に選挙人名簿への「有権者登録（Voter Registration）」を行う必要があります。"],

  // 22. 政治⑥：連邦議会と立法 (#426–#450)
  [21,"What are the two chambers that make up the bicameral United States Congress?",["House of Lords and House of Commons","The Senate and the House of Representatives","The Cabinet and the National Assembly","The Diet and the Council"],1,"アメリカ連邦議会（Congress）は、上院（Senate）と下院（House of Representatives）の二院制で構成されています。"],
  [21,"In which building on Capitol Hill in Washington, D.C. does the United States Congress meet?",["The White House","The United States Capitol (連邦議会議事堂)","Independence Hall","Federal Hall"],1,"連邦議会が開かれるのは、ワシントンD.C.のキャピトル・ヒルに立つ「合衆国議会議事堂（United States Capitol）」です。"],
  [21,"How many total voting members serve in the United States Congress (combining the Senate and the House of Representatives)?",["435","500","535","538"],2,"連邦議会の議決権を持つ議員総数は、上院100名＋下院435名の計535名です（これにワシントンD.C.の3名を加えた538名が大統領選挙人の総数となります）。"],
  [21,"How many Senators are elected from each state, and what is the total number of U.S. Senators?",["1 per state / 50 total","2 per state / 100 total","Based on population / 435 total","3 per state / 150 total"],1,"連邦上院（Senate）は人口の大小にかかわらず各州から2名ずつ選出され、全50州で計100名で構成されます。"],
  [21,"How long is one term of office for a United States Senator, and what fraction of the Senate is up for election every two years?",["4 years / 1/2 every two years","6 years / 1/3 every two years","2 years / all seats every two years","6 years / all seats every six years"],1,"連邦上院議員の任期は6年で、2年ごとに全体の3分の1（約33〜34議席）ずつが改選されます。"],
  [21,"What are the constitutional age and citizenship requirements to become a United States Senator?",["At least 25 years old and 7 years a U.S. citizen","At least 30 years old and 9 years a U.S. citizen","At least 35 years old and natural-born citizen","At least 21 years old and 5 years a U.S. citizen"],1,"連邦上院議員の被選挙権要件は「30歳以上」「9年以上の合衆国市民」「選出州の住民」です。"],
  [21,"How many voting members serve in the U.S. House of Representatives, and how long is their term of office?",["100 members / 6-year term","435 members / 2-year term","435 members / 4-year term","538 members / 2-year term"],1,"連邦下院（House of Representatives）の定数は435名（各州の人口に比例して配分、最低1名）で、任期は2年（2年ごとに全議席改選）です。"],
  [21,"What are the constitutional age and citizenship requirements to become a member of the U.S. House of Representatives?",["At least 21 years old and 5 years a U.S. citizen","At least 25 years old and 7 years a U.S. citizen","At least 30 years old and 9 years a U.S. citizen","At least 35 years old and 14 years a U.S. citizen"],1,"連邦下院議員の被選挙権要件は「25歳以上」「7年以上の合衆国市民」「選出州の住民」です。"],
  [21,"Who is the presiding officer and political leader of the U.S. House of Representatives, elected by the full House at the start of each new Congress?",["House Majority Whip","Speaker of the House (下院議長)","President pro tempore","White House Chief of Staff"],1,"下院の本会議を主宰する最高指導者は「下院議長（Speaker of the House）」で、多数党のトップから選ばれ、大統領継承順位第2位にあります。"],
  [21,"Who became the first woman in U.S. history to serve as Speaker of the House of Representatives (serving 2007–2011 and 2019–2023)?",["Hillary Clinton","Nancy Pelosi","Elizabeth Warren","Condoleezza Rice"],1,"カリフォルニア州選出の民主党議員ナンシー・ペロシ（Nancy Pelosi）は、2007年にアメリカ史上初の女性下院議長に就任しました。"],
  [21,"Under the Origination Clause of the Constitution (Article I, Section 7), all bills for raising revenue (tax bills) must originate in which chamber?",["The Senate","The House of Representatives","Either chamber","The Treasury Department"],1,"「代表なくして課税なし」の精神から、歳入法案（課税法案）の先議権は国民に直接近い下院（House of Representatives）にのみ認められています。"],
  [21,"Under the Constitution, which chamber of Congress has the exclusive power to ratify international treaties negotiated by the President (by a two-thirds vote)?",["The House of Representatives","The Senate","Both chambers by simple majority","The Supreme Court"],1,"大統領が外国と締結した条約（Treaties）を出席議員の3分の2以上の賛成で批准承認する権限は、上院（Senate）の専権事項です。"],
  [21,"What is the name of the tactic unique to the U.S. Senate in which a Senator or minority group prolongs debate indefinitely to delay or block a vote on a bill?",["Gerrymandering","Filibuster (フィリバスター / 議事妨害)","Impeachment","Pocket Veto"],1,"上院において長時間の演説や動議によって討論を終わらせず、法案の採決を阻止する戦術は「フィリバスター（Filibuster）」と呼ばれます。"],
  [21,"What is the Senate procedure called 'Cloture,' and how many votes out of 100 Senators are normally required to end a filibuster on legislation?",["51 votes","60 votes (three-fifths of the Senate)","67 votes (two-thirds)","75 votes (three-fourths)"],1,"上院でフィリバスター（議事妨害）を打ち切って採決へ進むための討論終結動議（Cloture）には、原則として100名中「60票（5分の3）」の賛成が必要です。"],
  [21,"Who serves as the day-to-day floor leader and most powerful partisan figure in the U.S. Senate?",["The Vice President","The Senate Majority Leader (上院多数党院内総務)","The Speaker of the Senate","The Chief Clerk"],1,"上院議長である副大統領は通常議事進行を行わないため、上院の実質的な最高指導者は議事日程を握る「上院多数党院内総務（Senate Majority Leader）」です。"],
  [21,"What is the title of the party official in the House and Senate (named after a fox-hunting term) who is responsible for counting votes and enforcing party discipline?",["Floor Marshal","Party Whip (院内幹事)","Sergeant at Arms","Parliamentarian"],1,"上下両院の各党で所属議員の票読みや党議拘束・説得を担う役職は、キツネ狩りで猟犬の列をまとめる鞭打ち役に由来し「ホイップ（Whip / 院内幹事）」と呼ばれます。"],
  [21,"When the House and the Senate pass different versions of the same bill, what temporary joint committee is formed to reconcile the differences into a single bill?",["Select Committee","Conference Committee (両院協議会)","Ways and Means Committee","Rules Committee"],1,"同一法案について上院通過案と下院通過案の内容が異なる場合、両院の代表議員で構成される「両院協議会（Conference Committee）」で一本化案が作成されます。"],
  [21,"What happens in the United States when Congress and the President fail to pass annual appropriations (funding) bills before the new fiscal year begins on October 1?",["Dissolution of Congress and snap elections","Government Shutdown (政府機関の一時閉鎖)","Automatic resignation of the Cabinet","Imposition of martial law"],1,"アメリカの会計年度が始まる10月1日までに歳出予算案（またはつなぎ予算）が成立しない場合、必須業務を除く連邦政府機関が閉鎖される「政府閉鎖（Government Shutdown）」が発生します。"],
  [21,"What is the legislative limit set by Congress on the total amount of national debt that the U.S. Treasury is allowed to issue to pay for existing obligations?",["Fiscal Cliff","Debt Ceiling (債務上限)","Balanced Budget Cap","Tariff Quota"],1,"連邦政府が国債を発行して借り入れできる累積債務の法定限度額は「債務上限（Debt Ceiling）」と呼ばれ、引き上げをめぐって度々与野党の政治的対立が生じます。"],
  [21,"Which 1973 federal law was enacted over President Nixon's veto after the Vietnam War to check the President's power to commit U.S. military forces abroad without Congressional approval?",["National Security Act","War Powers Resolution (戦争権限法)","Patriot Act","Espionage Act"],1,"ベトナム戦争の教訓から1973年に制定された「戦争権限法（War Powers Resolution）」は、大統領が議会の承認なしに米軍を海外派兵できる期間（原則60日）や議会への報告義務を定めています。"],
  [21,"Which cultural and research institution on Capitol Hill, founded in 1800 and rebuilding its core collection with Thomas Jefferson's personal books, is the largest library in the world?",["New York Public Library","Library of Congress (米国議会図書館)","National Archives","Smithsonian Institution"],1,"連邦議会の調査機関として1800年に設立された「米国議会図書館（Library of Congress）」は、世界最大の蔵書数を誇る図書館であり、アメリカボウル訪問プログラムの主要訪問先でもあります。"],
  [21,"Where in Washington, D.C. are the original signed manuscripts of the Declaration of Independence, the U.S. Constitution, and the Bill of Rights permanently displayed?",["The White House","The National Archives Museum (国立公文書館)","The Pentagon","The Lincoln Memorial"],1,"独立宣言、合衆国憲法、権利章典の原本（「自由の憲章」）が展示・保管されているのは、ワシントンD.C.の「国立公文書館（National Archives）」です。"],
  [21,"Which major avenue in downtown Washington, D.C. is synonymous with the U.S. lobbying industry, think tanks, and advocacy groups?",["Pennsylvania Avenue","K Street","Wall Street","Madison Avenue"],1,"ワシントンD.C.の「Kストリート（K Street）」にはロビー活動を行う事務所やシンクタンクが集中しており、ロビー業界の代名詞となっています。"],
  [21,"What American political slang term refers to government spending inserted into a bill by a member of Congress to fund local projects solely to benefit their home district?",["Gerrymandering","Pork-barrel legislation (ポーク・バレル / 利益誘導政治)","Filibuster","Lame Duck"],1,"議員が自身の選挙区への利益誘導のために予算案に盛り込む地元向け公共事業費などは、奴隷に塩漬け豚肉の樽を分け与えた慣習に由来し「ポーク・バレル（Pork-barrel）」と呼ばれます。"],
  [21,"What status do residents of U.S. territories (such as Puerto Rico and Guam) and Washington, D.C. have in the U.S. House of Representatives?",["Two voting Senators and one voting Representative","One non-voting Delegate (or Resident Commissioner) who can serve on committees but cannot vote on final floor passage","No representation of any kind","Full voting representation equal to the 50 states"],1,"ワシントンD.C.やプエルトリコ・グアムなどの準州は上院議員を持たず、下院に本会議での最終表決権を持たない代表（Non-voting Delegate / Resident Commissioner）を1名ずつ送っています。"],

  // 23. 政治⑦：最高裁と重要判例 (#451–#475)
  [22,"How many Justices serve on the Supreme Court of the United States?",["7 Justices","9 Justices (1 Chief Justice and 8 Associate Justices)","11 Justices","12 Justices"],1,"連邦最高裁判所（Supreme Court）の判事は、長官（Chief Justice）1名と陪席判事（Associate Justices）8名の計9名で構成されています。"],
  [22,"How are U.S. Supreme Court Justices selected, and what is their term of office under Article III of the Constitution?",["Elected by popular vote for a 10-year term","Nominated by the President, confirmed by the Senate, and serve for life ('during good Behaviour')","Appointed by the House of Representatives until age 70","Chosen by state governors for an 8-year term"],1,"連邦最高裁判事は大統領が指名し、上院の過半数の承認を経て任命され、司法の独立を守るため終身制（弾劾されない限り生涯在任）となっています。"],
  [22,"What famous four-word motto is inscribed above the main entrance to the U.S. Supreme Court Building in Washington, D.C.?",["In God We Trust","Equal Justice Under Law","Liberty and Justice","We the People"],1,"連邦最高裁判所庁舎の正面玄関上部には「Equal Justice Under Law（法の下の平等な正義）」の4語が刻まれています。"],
  [22,"Who was appointed by President Lyndon B. Johnson in 1967 as the first African American Justice on the U.S. Supreme Court (after winning 'Brown v. Board of Education' as a lawyer)?",["Clarence Thomas","Thurgood Marshall","Martin Luther King Jr.","John Marshall"],1,"ブラウン判決でNAACPの主任弁護士として勝訴を勝ち取ったサーグッド・マーシャル（Thurgood Marshall）は、1967年にアフリカ系初の連邦最高裁判事に就任しました。"],
  [22,"Who was appointed in 1981 as the first female Supreme Court Justice, and who became the first Black female Supreme Court Justice in 2022?",["Ruth Bader Ginsburg (1981) / Sonia Sotomayor (2022)","Sandra Day O'Connor (1981) / Ketanji Brown Jackson (2022)","Elena Kagan (1981) / Amy Coney Barrett (2022)","Sandra Day O'Connor (1981) / Kamala Harris (2022)"],1,"1981年にレーガン大統領が任命したサンドラ・デイ・オコーナーが初の女性最高裁判事、2022年にバイデン大統領が任命したケタンジ・ブラウン・ジャクソンが初の黒人女性最高裁判事です。"],
  [22,"Which 1803 landmark Supreme Court case, written by Chief Justice John Marshall, established the principle of Judicial Review (違憲審査権)?",["McCulloch v. Maryland","Marbury v. Madison","Gibbons v. Ogden","Dred Scott v. Sandford"],1,"1803年の「マーベリー対マディソン事件（Marbury v. Madison）」は、裁判所が法律や行政行為の合憲性を審査する違憲審査権（Judicial Review）を確立した最重要判例です。"],
  [22,"Which 1819 Supreme Court case confirmed the implied powers of Congress to establish a national bank and ruled that a state cannot tax a federal institution ('the power to tax involves the power to destroy')?",["Marbury v. Madison","McCulloch v. Maryland","Plessy v. Ferguson","Schenck v. United States"],1,"1819年の「マカロック対メリーランド事件（McCulloch v. Maryland）」は、連邦政府の権限が州政府に優越することと議会の黙示的権限を認めた歴史的判例です。"],
  [22,"Which notorious 1857 Supreme Court decision ruled that enslaved and formerly enslaved African Americans were not U.S. citizens and could not sue in federal court, fueling the Civil War?",["Plessy v. Ferguson","Dred Scott v. Sandford","Brown v. Board of Education","Korematsu v. United States"],1,"1857年の「ドレッド・スコット対サンドフォード事件（Dred Scott v. Sandford）」は、黒人の市民権を否定しミズーリ妥協を違憲としたことで南北戦争の引き金となりました。"],
  [22,"Which 1896 Supreme Court ruling upheld Southern racial segregation ('Jim Crow') laws under the doctrine of 'Separate but equal' (分離すれども平等)?",["Dred Scott v. Sandford","Plessy v. Ferguson","Brown v. Board of Education","Loving v. Virginia"],1,"1896年の「プレッシー対ファーガソン事件（Plessy v. Ferguson）」は、「分離すれども平等」の原則によって公共施設での人種隔離を合憲と判断しました。"],
  [22,"Which 1919 Supreme Court case upheld wartime restrictions on anti-draft leaflets and established Justice Oliver Wendell Holmes's 'Clear and Present Danger' (明白かつ現在の危険) test?",["Texas v. Johnson","Schenck v. United States","New York Times Co. v. United States","Tinker v. Des Moines"],1,"1919年の「シェンク対アメリカ合衆国事件（Schenck v. United States）」は、第一次世界大戦中の反戦ビラ規制を合憲とし、表現の自由の制約基準として「明白かつ現在の危険」の法理を確立しました。"],
  [22,"Which 1944 Supreme Court case upheld the wartime forced internment of Japanese Americans on the West Coast during World War II (later formally repudiated by the Court)?",["Schenck v. United States","Korematsu v. United States","Hirabayashi v. United States","Miranda v. Arizona"],1,"1944年の「コレマツ対アメリカ合衆国事件」は、第二次世界大戦中の日系アメリカ人強制収容を軍事的必要性を理由に合憲とした判例です（1988年の市民の自由法で政府が公式謝罪・補償）。"],
  [22,"Which landmark 1954 Supreme Court ruling unanimously overturned 'Plessy v. Ferguson' and declared racial segregation in public schools unconstitutional?",["Brown v. Board of Education","Roe v. Wade","Obergefell v. Hodges","Regents of UC v. Bakke"],0,"1954年の「ブラウン対教育委員会事件（Brown v. Board of Education）」は、「分離された教育施設は本質的に不平等である」として公立学校での人種隔離を違憲とし、公民権運動を大きく前進させました。"],
  [22,"Which 1962 Supreme Court case ruled that state-sponsored official prayer in public schools violates the Establishment Clause of the First Amendment?",["Tinker v. Des Moines","Engel v. Vitale","Wisconsin v. Yoder","Brown v. Board of Education"],1,"1962年の「エンゲル対ヴィターレ事件」は、公立学校で州が定めた公式の祈りを唱えさせることは修正第1条の政教分離（国教樹立禁止条項）に違反すると判断しました。"],
  [22,"Which 1963 Supreme Court case established that under the 6th and 14th Amendments, states must provide a free court-appointed attorney to criminal defendants who cannot afford one?",["Miranda v. Arizona","Gideon v. Wainwright","Mapp v. Ohio","Terry v. Ohio"],1,"1963年の「ギデオン対ウェインライト事件」は、貧困により弁護士を雇えない刑事被告人に対して州が国選弁護人を付ける義務があることを確立しました。"],
  [22,"Which 1966 Supreme Court case ruled that police must inform arrested suspects of their right to remain silent and right to an attorney before interrogation?",["Gideon v. Wainwright","Miranda v. Arizona","Escobedo v. Illinois","Roe v. Wade"],1,"1966年の「ミランダ対アリゾナ事件（Miranda v. Arizona）」により、逮捕時の黙秘権や弁護士依頼権の告知（ミランダ警告）が義務づけられました。"],
  [22,"Which 1967 Supreme Court case struck down all remaining state laws banning interracial marriage (marriage between people of different races)?",["Plessy v. Ferguson","Loving v. Virginia","Obergefell v. Hodges","Lawrence v. Texas"],1,"1967年の「ラヴィング対バージニア州事件（Loving v. Virginia）」は、白人と黒人の異人種間結婚を禁じていた州法を修正第14条違反として全員一致で違憲としました。"],
