const QUIZ_DATA = RAW_DATA.map((row, idx) => ({
  id: idx + 1,
  catIdx: row[0],
  cat: CATS[row[0]],
  q: row[1],
  o: row[2],
  a: row[3],
  exp: row[4]
}));

let activePool = [];
let currentIndex = 0;
let userAnswers = {};
let wrongIds = new Set();
let isMockMode = false;
let autoSpeak = false;
let blindMode = false;

function getEnglishVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'en-US' && v.name.includes('Natural'))
      || voices.find(v => v.lang === 'en-US')
      || voices.find(v => v.lang.startsWith('en'))
      || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => getEnglishVoice();
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

function speakCurrentQuestion(includeOptions = false) {
  if (!('speechSynthesis' in window) || !activePool[currentIndex]) return;
  stopSpeech();
  const q = activePool[currentIndex];
  let text = `Question ${currentIndex + 1}. ${q.q}`;
  if (includeOptions) {
    const labels = ['A', 'B', 'C', 'D'];
    const optsText = q.o.map((opt, i) => `Option ${labels[i]}: ${opt}.`).join(' ');
    text += ` ... ${optsText}`;
  }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  const voice = getEnglishVoice();
  if (voice) utter.voice = voice;
  utter.rate = parseFloat(document.getElementById('rateSelect').value) || 1.0;
  window.speechSynthesis.speak(utter);
}

function toggleAutoSpeak() {
  autoSpeak = !autoSpeak;
  const btn = document.getElementById('autoSpeakBtn');
  btn.textContent = `自動読み上げ: ${autoSpeak ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active-toggle', autoSpeak);
  if (autoSpeak) speakCurrentQuestion(false);
}

function toggleBlindMode() {
  blindMode = !blindMode;
  const btn = document.getElementById('blindModeBtn');
  btn.textContent = `🙈 リスニング専念: ${blindMode ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active-toggle', blindMode);
  renderQuestion(false);
}

function initPool(list, mock = false) {
  stopSpeech();
  activePool = list.map((item, idx) => ({
    ...item,
    isBonus: mock && idx >= 40
  }));
  currentIndex = 0;
  userAnswers = {};
  isMockMode = mock;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  renderQuestion(true);
}

function startCategoryMode() {
  const val = document.getElementById('catSelect').value;
  let filtered = [];
  if (val === 'ALL') {
    filtered = [...QUIZ_DATA];
  } else if (val === 'GROUP_HISTORY') {
    filtered = QUIZ_DATA.filter(q => q.catIdx >= 0 && q.catIdx <= 7);
  } else if (val === 'GROUP_GEOECON') {
    filtered = QUIZ_DATA.filter(q => q.catIdx >= 8 && q.catIdx <= 15);
  } else if (val === 'GROUP_POLSOC') {
    filtered = QUIZ_DATA.filter(q => q.catIdx >= 16 && q.catIdx <= 23);
  } else {
    const cIdx = parseInt(val, 10);
    filtered = QUIZ_DATA.filter(q => q.catIdx === cIdx);
  }
  initPool(filtered, false);
}

function startShuffleAll() {
  const shuffled = [...QUIZ_DATA].sort(() => Math.random() - 0.5);
  initPool(shuffled, false);
}

function startMockExam() {
  const shuffled = [...QUIZ_DATA].sort(() => Math.random() - 0.5).slice(0, 45);
  initPool(shuffled, true);
}

function startRetryWrong() {
  if (wrongIds.size === 0) return;
  const retryList = QUIZ_DATA.filter(q => wrongIds.has(q.id));
  initPool(retryList, false);
}

function jumpToQuestion() {
  const num = parseInt(document.getElementById('jumpInput').value, 10);
  if (isNaN(num) || num < 1 || num > activePool.length) return;
  currentIndex = num - 1;
  renderQuestion(true);
}

function calcScore() {
  let pts = 0, maxPts = 0;
  activePool.forEach((q, idx) => {
    const w = q.isBonus ? 3 : 1;
    maxPts += w;
    if (userAnswers[idx] === q.a) pts += w;
  });
  return { pts, maxPts };
}

function renderQuestion(triggerAudio = false) {
  const q = activePool[currentIndex];
  document.getElementById('qProgress').textContent = `Q ${currentIndex + 1} / ${activePool.length} (通し番号 #${q.id})`;
  document.getElementById('qCat').textContent = q.cat;
  document.getElementById('qBonus').style.display = q.isBonus ? 'inline-block' : 'none';
  const sc = calcScore();
  document.getElementById('scoreDisplay').textContent = `Score: ${sc.pts} / ${sc.maxPts}`;

  const answered = userAnswers[currentIndex] !== undefined;
  const qBox = document.getElementById('questionText');
  if (blindMode && !answered) {
    qBox.className = 'question-box blind';
    qBox.textContent = '🎧 リスニング専念モード中（上の「🔊 問題文を読み上げ」を押して音声を聞き、回答すると問題文が表示されます）';
  } else {
    qBox.className = 'question-box';
    qBox.textContent = q.q;
  }

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  ['A', 'B', 'C', 'D'].forEach((label, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = `(${label}) ${q.o[idx]}`;
    if (answered) {
      btn.disabled = true;
      if (idx === q.a) btn.classList.add('correct');
      else if (idx === userAnswers[currentIndex]) btn.classList.add('wrong');
    } else {
      btn.onclick = () => selectAnswer(idx);
    }
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedbackBox');
  if (answered) {
    const isOk = userAnswers[currentIndex] === q.a;
    fb.style.display = 'block';
    fb.innerHTML = `<strong>${isOk ? '✅ Correct!' : '❌ Incorrect'}</strong> — 正解: (${['A','B','C','D'][q.a]}) ${q.o[q.a]}<br>${q.exp}`;
  } else {
    fb.style.display = 'none';
  }

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === activePool.length - 1 ? '結果を見る →' : '次の問題 →';
  document.getElementById('retryBtn').style.display = wrongIds.size > 0 ? 'inline-block' : 'none';

  if (triggerAudio && autoSpeak) {
    speakCurrentQuestion(false);
  }
}

function selectAnswer(choiceIdx) {
  const q = activePool[currentIndex];
  userAnswers[currentIndex] = choiceIdx;
  if (choiceIdx === q.a) wrongIds.delete(q.id);
  else wrongIds.add(q.id);
  renderQuestion(false);
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion(true);
  }
}

function nextQuestion() {
  if (currentIndex < activePool.length - 1) {
    currentIndex++;
    renderQuestion(true);
  } else {
    stopSpeech();
    showResult();
  }
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  const sc = calcScore();
  const pct = Math.round((sc.pts / sc.maxPts) * 100);
  document.getElementById('finalScore').textContent = `${sc.pts} / ${sc.maxPts} pts (${pct}%)`;
  document.getElementById('finalComment').textContent = wrongIds.size > 0
    ? `現在、復習リストに ${wrongIds.size} 問の要注意問題があります。`
    : `素晴らしい成績です！すべての問題をクリアしました！`;
  document.getElementById('retryBtnEnd').style.display = wrongIds.size > 0 ? 'inline-block' : 'none';
}

startCategoryMode();
</script>
</body>
</html>
