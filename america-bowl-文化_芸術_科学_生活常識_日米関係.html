<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U.S. Culture, Science & U.S.-Japan 500 Quiz & Listening Trainer</title>
<style>
  :root { --navy: #0a2540; --red: #d9381e; --blue: #1d4ed8; --bg: #f4f6f9; --correct: #16a34a; --wrong: #dc2626; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 16px; }
  .container { max-width: 880px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 24px; }
  h1 { margin: 0 0 8px; color: var(--navy); font-size: 1.5rem; text-align: center; }
  .subtitle { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; }
  .audio-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; background: #eff6ff; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #bfdbfe; }
  select, input[type="number"], .btn-ctrl { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.88rem; cursor: pointer; background: #fff; font-weight: 600; }
  .btn-ctrl.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn-ctrl.accent { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-ctrl.audio { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-ctrl.active-toggle { background: #0f766e; color: #fff; border-color: #0f766e; }
  .status-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-weight: 600; font-size: 0.95rem; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; background: #dbeafe; color: var(--blue); }
  .badge.bonus { background: #fef3c7; color: #b45309; margin-left: 6px; }
  .question-box { font-size: 1.15rem; font-weight: 600; line-height: 1.5; margin: 16px 0; color: #0f172a; min-height: 3.2rem; }
  .question-box.blind { background: #f1f5f9; color: #475569; border: 2px dashed #94a3b8; border-radius: 8px; padding: 16px; text-align: center; font-weight: 500; }
  .options { display: grid; gap: 10px; margin-bottom: 16px; }
  .opt-btn { text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid #e2e8f0; background: #fff; font-size: 1rem; cursor: pointer; transition: 0.15s; font-weight: 500; color: #1e293b; }
  .opt-btn:hover:not(:disabled) { border-color: var(--blue); background: #eff6ff; }
  .opt-btn.correct { border-color: var(--correct); background: #dcfce7; color: #14532d; font-weight: 700; }
  .opt-btn.wrong { border-color: var(--wrong); background: #fee2e2; color: #7f1d1d; }
  .feedback { display: none; padding: 14px 16px; border-radius: 10px; background: #f1f5f9; margin-bottom: 16px; line-height: 1.5; font-size: 0.95rem; border-left: 5px solid var(--navy); }
  .nav-bar { display: flex; justify-content: space-between; gap: 10px; }
  .nav-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; }
  .nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .result-screen { display: none; text-align: center; padding: 20px 0; }
  .score-big { font-size: 2.4rem; font-weight: 800; color: var(--navy); margin: 12px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>🇺🇸 文化・芸術 / 科学・生活常識 / 日米関係 500問統合トレーナー</h1>
  <div class="subtitle">全500問（文化・芸術200問＋科学・生活常識200問＋日米関係100問）4択＆英語リスニング演習システム</div>

  <div class="controls">
    <select id="catSelect" onchange="startCategoryMode()">
      <option value="ALL">全24分野 (500問すべて)</option>
      <optgroup label="大分類でまとめて選択">
        <option value="GROUP_CULTURE">【大分類①】アメリカの文化・芸術 (全200問: #1–#200)</option>
        <option value="GROUP_SCIENCE">【大分類②】アメリカの科学・生活常識 (全200問: #201–#400)</option>
        <option value="GROUP_USJP">【大分類③】日米関係・DC訪問先 (全100問: #401–#500)</option>
      </optgroup>
      <optgroup label="① 文化・芸術 (200問)">
        <option value="0">1. 食文化・飲料・外食 (25問)</option>
        <option value="1">2. 祝日・年中行事・伝統習慣 (25問)</option>
        <option value="2">3. スポーツ・オリンピック (25問)</option>
        <option value="3">4. 文学・演劇・ジャーナリズム (25問)</option>
        <option value="4">5. 音楽・ダンス・ミュージカル (25問)</option>
        <option value="5">6. 映画・アニメーション・TV (25問)</option>
        <option value="6">7. 美術・建築・博物館 (25問)</option>
        <option value="7">8. ポップカルチャー・ファッション (25問)</option>
      </optgroup>
      <optgroup label="② 科学・生活常識 (200問)">
        <option value="8">9. 生活常識①：長さ・距離・面積 (25問)</option>
        <option value="9">10. 生活常識②：重さ・容量・温度・電気 (25問)</option>
        <option value="10">11. 生活常識③：略語・頭字語・ビジネス表現 (25問)</option>
        <option value="11">12. 生活常識④：教育・法律・マナー・習慣 (25問)</option>
        <option value="12">13. 科学①：発明家と歴史的技術革新 (25問)</option>
        <option value="13">14. 科学②：宇宙開発・NASA・天文・航空 (25問)</option>
        <option value="14">15. 科学③：物理・原子力・化学・ノーベル賞 (25問)</option>
        <option value="15">16. 科学④：IT・コンピュータ・医学・環境 (25問)</option>
      </optgroup>
      <optgroup label="③ 日米関係 (100問)">
        <option value="16">17. 日米①：幕末の開国と万延元年遣米使節 (12問)</option>
        <option value="17">18. 日米②：明治・大正の交流とポーツマス条約 (13問)</option>
        <option value="18">19. 日米③：桜寄贈・日米協会・アメリカボウル (13問)</option>
        <option value="19">20. 日米④：太平洋戦争と日系アメリカ人 (12問)</option>
        <option value="20">21. 日米⑤：戦後占領・サンフランシスコ平和条約・返還 (13問)</option>
        <option value="21">22. 日米⑥：日米安全保障条約と首脳外交 (12問)</option>
        <option value="22">23. 日米⑦：経済摩擦と文化・科学・スポーツ交流 (13問)</option>
        <option value="23">24. 日米⑧：ワシントンD.C.訪問プログラムと名所 (12問)</option>
      </optgroup>
    </select>
    <button class="btn-ctrl primary" onclick="startShuffleAll()">シャッフル全500問</button>
    <button class="btn-ctrl accent" onclick="startMockExam()">模擬試験 (40問+ボーナス5問)</button>
    <button class="btn-ctrl" id="retryBtn" onclick="startRetryWrong()" style="display:none;">間違えた問題だけ復習</button>
    <span style="display:inline-flex; align-items:center; gap:4px;">
      <input type="number" id="jumpInput" min="1" max="500" placeholder="番号(1-500)" style="width:95px;">
      <button class="btn-ctrl" onclick="jumpToQuestion()">移動</button>
    </span>
  </div>

  <div class="audio-bar">
    <button class="btn-ctrl audio" onclick="speakCurrentQuestion(false)">🔊 問題文を読み上げ</button>
    <button class="btn-ctrl audio" onclick="speakCurrentQuestion(true)">🔊 問題＋選択肢を読み上げ</button>
    <button class="btn-ctrl" onclick="stopSpeech()">⏹ 停止</button>
    <button class="btn-ctrl" id="autoSpeakBtn" onclick="toggleAutoSpeak()">自動読み上げ: OFF</button>
    <button class="btn-ctrl" id="blindModeBtn" onclick="toggleBlindMode()">🙈 リスニング専念: OFF</button>
    <select id="rateSelect" title="読み上げ速度">
      <option value="0.85">速度 0.85x (ゆっくり)</option>
      <option value="1.0" selected>速度 1.0x (標準)</option>
      <option value="1.15">速度 1.15x (速め)</option>
    </select>
  </div>

  <div id="quizArea">
    <div class="status-bar">
      <div>
        <span id="qProgress">Q 1 / 500</span>
        <span id="qCat" class="badge">1. 食文化・飲料</span>
        <span id="qBonus" class="badge bonus" style="display:none;">★BONUS 3pts</span>
      </div>
      <div id="scoreDisplay">Score: 0</div>
    </div>
    <div id="questionText" class="question-box"></div>
    <div id="optionsContainer" class="options"></div>
    <div id="feedbackBox" class="feedback"></div>
    <div class="nav-bar">
      <button class="nav-btn" id="prevBtn" onclick="prevQuestion()">← 前の問題</button>
      <button class="nav-btn" id="nextBtn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen">
    <h2>演習結果</h2>
    <div id="finalScore" class="score-big"></div>
    <p id="finalComment"></p>
    <button class="btn-ctrl primary" onclick="startCategoryMode()">最初からやり直す</button>
    <button class="btn-ctrl accent" id="retryBtnEnd" onclick="startRetryWrong()">間違えた問題を復習する</button>
  </div>
</div>

<script>
const CATS = [
  "1. 食文化・飲料", "2. 祝日・年中行事", "3. スポーツ・五輪", "4. 文学・演劇",

  "9. 生活常識①：長さ・距離・面積", "10. 生活常識②：重さ・容量・温度", "11. 生活常識③：略語・頭字語", "12. 生活常識④：教育・法律・習慣",
  "13. 科学①：発明家と技術革新", "14. 科学②：宇宙開発・NASA・航空", "15. 科学③：物理・化学・ノーベル賞", "16. 科学④：IT・医学・バイオ・環境",
  "17. 日米①：幕末の開国と遣米使節", "18. 日米②：明治・大正とポーツマス条約", "19. 日米③：桜寄贈・日米協会・大会", "20. 日米④：太平洋戦争と日系米国人",
  "21. 日米⑤：戦後占領と平和条約・返還", "22. 日米⑥：日米安全保障と首脳外交", "23. 日米⑦：経済摩擦と文化・スポーツ交流", "24. 日米⑧：ワシントンD.C.訪問先"

// [catIdx, question, [optA, optB, optC, optD], ansIdx, explanation]
const RAW_DATA = [
  // ==================== PART 1: 文化・芸術 (200問: #1–#200) ====================
  // 1. 食文化・飲料 (#1–#25)
  [0,"Which creamy soup made with clams and potatoes is a signature dish of New England, especially Boston?",["Gumbo","New England Clam Chowder","Gazpacho","Bisque"],1,"アサリとジャガイモを使った白いクリームスープ「ニューイングランド・クラムチャウダー」はボストンなどニューイングランド地方の代表料理です。"],
  [0,"Which traditional African American cuisine from the Southern United States features fried chicken, fried catfish, cornbread, and collard greens?",["Tex-Mex","Soul Food","Cajun Cuisine","California Cuisine"],1,"南部発祥のアフリカ系アメリカ人の伝統料理は「ソウルフード（Soul Food）」と呼ばれます。"],
  [0,"In which city in New York State were 'Buffalo wings' invented in 1964 at the Anchor Bar?",["Rochester","Syracuse","Buffalo","Albany"],2,"バッファローウィングは1964年にニューヨーク州バッファローの「アンカー・バー」で考案されました。"],
  [0,"Which thick, hearty style of pizza baked in a deep pan is a famous culinary specialty of Chicago?",["Neapolitan Pizza","Deep-Dish Pizza","New York-Style Thin Crust","Flatbread"],1,"シカゴは深い焼き型にチーズとトマトソースをたっぷり詰めて焼く「ディープディッシュ・ピザ（シカゴピザ）」で有名です。"],
  [0,"Which sandwich consisting of thinly sliced beefsteak and melted cheese in a long roll is the signature dish of Philadelphia?",["Reuben Sandwich","Philly Cheesesteak","Po' Boy","Cuban Sandwich"],1,"ペンシルベニア州フィラデルフィアの名物サンドイッチは「フィリー・チーズステーキ」です。"],
  [0,"Which rich stew originated in Louisiana, combining West African, French, and Native American culinary traditions with okra or filé powder?",["Gumbo","Chili con Carne","Clam Chowder","Succotash"],0,"ルイジアナ州発祥のクレオール・ケイジャン料理を代表する濃厚なシチューは「ガンボ（Gumbo）」です。"],
  [0,"Which square-shaped fried dough pastry topped with powdered sugar is the official state doughnut of Louisiana and a famous treat in New Orleans?",["Cronut","Beignet","Churro","Funnel Cake"],1,"フランス発祥でニューオーリンズ名物となった粉砂糖たっぷりの揚げ菓子は「ベニエ（Beignet）」です。"],
  [0,"Which fusion cuisine combining Texas and Mexican food traditions popularized fajitas, nachos, and chili con carne?",["Creole","Tex-Mex","Floribbean","Pacific Rim"],1,"テキサス州とメキシコの食文化が融合した料理は「テックス・メックス（Tex-Mex）」と呼ばれます。"],
  [0,"Which bird is the traditional main course served at Thanksgiving dinner in the United States?",["Duck","Goose","Turkey","Pheasant"],2,"感謝祭（Thanksgiving）の伝統的なメインディッシュは七面鳥（Turkey）のローストです。"],
  [0,"What campfire treat consists of a roasted marshmallow and a piece of chocolate sandwiched between two graham crackers?",["S'more","Twinkie","Brownie","Whoopie Pie"],0,"焼いたマシュマロとチョコレートをグラハムクラッカーで挟むキャンプの定番菓子は「スモア（S'more = some moreの略）」です。"],
  [0,"Which dessert, often associated with the phrase 'as American as...', is made with a flaky pastry crust and spiced sliced apples?",["Key Lime Pie","Apple Pie","Pecan Pie","Boston Cream Pie"],1,"「アップルパイのようにアメリカらしい（as American as apple pie）」という慣用句があるほど、アップルパイはアメリカの象徴的デザートです。"],
  [0,"Which tart pie made with small lime juice, egg yolks, and sweetened condensed milk originated in the Florida Keys?",["Key Lime Pie","Lemon Meringue Pie","Shoofly Pie","Mississippi Mud Pie"],0,"フロリダ・キーズ発祥の小さなライムを使った名物パイは「キーライムパイ（Key Lime Pie）」です。"],
  [0,"Waiters in the U.S. rely heavily on gratuity; what is the standard tipping percentage expected at sit-down restaurants?",["5% to 8%","15% to 20%","30% to 35%","No tipping is allowed"],1,"アメリカのレストランでは、飲食代の15%〜20%程度のチップを渡すのが一般的なマナーです。"],
  [0,"In which city and state did pharmacist John Stith Pemberton invent Coca-Cola in 1886?",["Atlanta, Georgia","Dallas, Texas","Chicago, Illinois","St. Louis, Missouri"],0,"コカ・コーラは1886年にジョージア州アトランタで薬剤師ジョン・ペンバートンによって発明されました。"],

  [0,"Who founded Kentucky Fried Chicken (KFC) using his secret '11 herbs and spices' recipe?",["Ray Kroc","Harland Sanders (Colonel Sanders)","Dave Thomas","Howard Schultz"],1,"KFC（ケンタッキーフライドチキン）を創業したのはカーネル・サンダース（ハーランド・サンダース）です。"],

  [0,"Which Northeastern state is the largest producer of maple syrup in the United States?",["Vermont","Rhode Island","New Jersey","Maryland"],0,"バーモント州（Vermont）は全米最大のメープルシロップ生産州です。"],
  [0,"In which state was the hamburger sandwich famously served in 1900 at Louis' Lunch in New Haven, recognized by the Library of Congress as its birthplace?",["Connecticut","Texas","California","Ohio"],0,"コネチカット州ニューヘイブンの「ルイス・ランチ」は、1900年にハンバーガーを考案した発祥の店として米国議会図書館に認定されています。"],
  [0,"What is the name of the colorful ring-shaped cake eaten during the Mardi Gras season in New Orleans that hides a tiny plastic baby inside?",["Angel Food Cake","King Cake","Red Velvet Cake","Bundt Cake"],1,"ニューオーリンズのマルディグラで食べられる、中に小さな人形が入ったカラフルなケーキは「キングケーキ（King Cake）」です。"],
  [0,"Which crisp salad made of romaine lettuce, croutons, Parmesan cheese, and a dressing with Worcestershire sauce was created in 1924 by restaurateur Caesar Cardini?",["Waldorf Salad","Cobb Salad","Caesar Salad","Chef Salad"],2,"シーザーサラダは1924年にイタリア系移民の料理人シーザー・カルディーニによって考案されました。"],
  [0,"Which breakfast dish consists of poached eggs and Canadian bacon on an English muffin, topped with hollandaise sauce, and originated in New York City?",["Eggs Benedict","Huevos Rancheros","Biscuits and Gravy","French Toast"],0,"イングリッシュマフィンにポーチドエッグとベーコンを乗せオランデーズソースをかけたニューヨーク発祥の朝食は「エッグベネディクト」です。"],

  // 2. 祝日・年中行事 (#26–#50)
  [1,"On what date does the United States celebrate Independence Day, commonly known as the Fourth of July?",["May 4","June 4","July 4","August 4"],2,"1776年7月4日の独立宣言採択を記念し、毎年7月4日が独立記念日（Independence Day）として祝われます。"],

  [1,"What is the Friday immediately following Thanksgiving Day called, which marks the start of the Christmas holiday shopping season?",["Cyber Monday","Black Friday","Good Friday","Super Tuesday"],1,"感謝祭翌日の金曜日は小売店が黒字になる大規模セールの日として「ブラックフライデー（Black Friday）」と呼ばれます。"],

  [1,"Which federal holiday observed on the last Monday of May honors U.S. military personnel who died while serving in the Armed Forces?",["Veterans Day","Memorial Day","Labor Day","Armed Forces Day"],1,"5月最終月曜日の「メモリアルデー（戦没将兵追悼記念日）」は、戦没者を追悼し夏の始まりを告げる祝日です。"],
  [1,"On what date is Veterans Day observed every year to honor all military veterans who served in the U.S. Armed Forces?",["May 30","July 4","September 11","November 11"],3,"第一次世界大戦の休戦記念日に由来する「ベテランズデー（復員軍人の日）」は毎年11月11日です。"],

  [6,"Which 102-story Art Deco skyscraper in Midtown Manhattan was completed in 1931 and stood as the world's tallest building for nearly 40 years?",["One World Trade Center","Empire State Building","Willis Tower","MetLife Building"],1,"1931年に竣工し、『キング・コング』などの映画でも知られるマンハッタンの象徴的な摩天楼は「エンパイア・ステート・ビルディング」です。"],
  [6,"Which country gifted the Statue of Liberty (designed by sculptor Frédéric Auguste Bartholdi) to the United States in 1886?",["United Kingdom","France","Italy","Spain"],1,"ニューヨーク港のリバティ島に立つ「自由の女神像」は、アメリカ独立100周年を記念してフランスから寄贈され1886年に除幕されました。"],
  [6,"Which four U.S. Presidents are carved into the granite face of Mount Rushmore in South Dakota by sculptor Gutzon Borglum?",["Washington, Jefferson, Jackson, and Lincoln","Washington, Jefferson, Theodore Roosevelt, and Lincoln","Washington, Adams, Lincoln, and Franklin D. Roosevelt","Washington, Madison, Lincoln, and Wilson"],1,"サウスダコタ州のマウント・ラシュモア国立記念碑に彫られている4人の大統領は、ワシントン、ジェファソン、セオドア・ルーズベルト、リンカーンです。"],
  [6,"What is the name of the Virginia plantation estate designed by Thomas Jefferson himself, which is designated a UNESCO World Heritage Site?",["Mount Vernon","Monticello","Montpelier","The Hermitage"],1,"第3代大統領トーマス・ジェファソンが自ら新古典主義様式で設計したバージニア州の邸宅は「モンティチェロ（Monticello）」です（マウント・バーノンはワシントンの邸宅）。"],
  [6,"What is the title of the large fresco painted by Constantino Brumidi in 1865 on the ceiling of the U.S. Capitol Rotunda?",["The Birth of Liberty","The Apotheosis of Washington","Washington Crossing the Delaware","Spirit of '76"],1,"ワシントンD.C.の連邦議会議事堂ロタンダ（円形広間）の天井に描かれているフレスコ画は『ワシントンの神格化（The Apotheosis of Washington）』です。"],
  [6,"Which museum on Fifth Avenue in New York City is the largest art museum in the Americas?",["Museum of Modern Art (MoMA)","The Metropolitan Museum of Art (The Met)","Whitney Museum of American Art","Frick Collection"],1,"ニューヨーク5番街のセントラル・パーク脇にある「メトロポリタン美術館（The Met）」は、西半球最大の美術館です。"],
  [6,"Which museum in Midtown Manhattan is famous for housing Vincent van Gogh's 'The Starry Night' and Picasso's 'Les Demoiselles d'Avignon'?",["The Guggenheim","The Museum of Modern Art (MoMA)","New Museum","Brooklyn Museum"],1,"ゴッホの『星月夜』やピカソの『アヴィニョンの娘たち』など近現代美術の至宝を所蔵するのはニューヨーク近代美術館（MoMA）です。"],
  [6,"Which world-famous complex of 21 museums, galleries, and a zoo, located mostly along the National Mall in Washington, D.C., offers free admission?",["The Getty Center","The Smithsonian Institution","The Carnegie Museums","The Field Museum"],1,"ワシントンD.C.のナショナル・モールを中心に展開する世界最大の博物館・研究複合施設は「スミソニアン博物館群（Smithsonian Institution）」です。"],
  [6,"Which iconic 630-foot stainless-steel monument designed by Eero Saarinen stands in St. Louis, Missouri as a symbol of westward expansion?",["Space Needle","Gateway Arch","Cloud Gate","Washington Monument"],1,"ミズーリ州セントルイスにそびえる高さ192mのステンレス製アーチは、西部開拓の玄関口を象徴する「ゲートウェイ・アーチ」です。"],
  [6,"In which city is the famous 'International Orange' suspension bridge, the Golden Gate Bridge, located?",["Los Angeles","San Francisco","Seattle","Portland"],1,"1937年に開通した鮮やかなインターナショナル・オレンジ色の吊り橋「ゴールデン・ゲート・ブリッジ」はカリフォルニア州サンフランシスコにあります。"],
  [6,"Which UNESCO World Heritage Site in Colorado preserves the famous cliff dwellings built by the Ancestral Pueblo people?",["Grand Canyon","Mesa Verde National Park","Carlsbad Caverns","Mammoth Cave"],1,"コロラド州にある「メサ・ヴェルデ国立公園」は、先住民プエブロ族が断崖の窪みに築いた精巧な崖住居遺跡で知られる世界文化遺産です。"],

  // 8. ポップカルチャー (#176–#200)
  [7,"In which city and year did Levi Strauss and tailor Jacob Davis patent copper-riveted blue jeans (denim work pants)?",["San Francisco in 1873","New York City in 1901","Dallas in 1889","Chicago in 1865"],0,"1873年、サンフランシスコのリーバイ・ストラウスと仕立屋ジェイコブ・デイビスがリベット補強のデニム作業ズボン（ブルージーンズ）の特許を取得しました。"],
  [7,"Which iconic superhero, created by Jerry Siegel and Joe Shuster, made his debut in 'Action Comics #1' in 1938?",["Batman","Superman","Spider-Man","Captain America"],1,"1938年の『アクション・コミックス』創刊号で初登場し、アメリカン・コミックスのスーパーヒーローの原点となったのは「スーパーマン」です。"],
  [7,"Which comic book writer co-created Marvel superheroes including Spider-Man, Iron Man, the X-Men, the Hulk, and the Avengers?",["Bob Kane","Stan Lee","Frank Miller","Alan Moore"],1,"スタン・リー（Stan Lee）はジャック・カービーやスティーヴ・ディッコらと共にスパイダーマンやアベンジャーズなど数々のマーベル・ヒーローを生み出しました。"],
  [7,"Who created the classic daily comic strip 'Peanuts' featuring Charlie Brown and his beagle dog Snoopy?",["Jim Davis","Charles M. Schulz","Bill Watterson","Gary Larson"],1,"チャーリー・ブラウンとスヌーピーが登場する新聞漫画『ピーナッツ（Peanuts）』を50年間にわたり描き続けた漫画家はチャールズ・M・シュルツです。"],
  [7,"In what year and in which California city did Walt Disney open the original 'Disneyland' theme park?",["1955 in Anaheim","1971 in Orlando","1937 in Burbank","1964 in Pasadena"],0,"最初のディズニーランドは1955年7月17日にカリフォルニア州アナハイムに開園しました（フロリダ州オーランドのウォルト・ディズニー・ワールドは1971年開園）。"],
  [7,"Which fashion doll, created by Ruth Handler and launched by American toy company Mattel in 1959, became a global cultural icon?",["Cabbage Patch Kid","Barbie","Raggedy Ann","Blythe"],1,"マテル社共同創業者のルース・ハンドラーが考案し1959年に発売されたファッションドールは「バービー（Barbie）」です。"],
  [7,"Which historic U.S. highway, running 2,448 miles from Chicago to Santa Monica, is celebrated in pop culture as the 'Mother Road' and 'Main Street of America'?",["Route 1","Route 66","Interstate 95","Pacific Coast Highway"],1,"イリノイ州シカゴからカリフォルニア州サンタモニカまでを結んだ旧国道「ルート66（Route 66）」は、ジョン・スタインベックによって「母なる道（Mother Road）」と呼ばれました。"],
  [7,"Which desert city in Nevada, famous for 'The Strip,' neon lights, casinos, and mega-resorts, is nicknamed 'The Entertainment Capital of the World'?",["Reno","Las Vegas","Phoenix","Palm Springs"],1,"ネバダ州のラスベガスは、大通り「ストリップ」沿いに巨大カジノホテルやショー劇場が立ち並ぶ世界のエンターテインメントの都です。"],
  [7,"Which famous pop culture convention, originally focused on comic books and sci-fi/fantasy, is held every summer in San Diego, California?",["E3 Expo","San Diego Comic-Con","CES","Dragon Con"],1,"1970年に始まり毎年夏にカリフォルニア州サンディエゴで開催される世界最大級のポップカルチャーの祭典は「サンディエゴ・コミコン（Comic-Con）」です。"],
  [7,"Which American sportswear company, founded in Oregon by Phil Knight and Bill Bowerman, uses the 'Swoosh' logo and the slogan 'Just Do It'?",["Converse","Nike","New Balance","Under Armour"],1,"オレゴン州で創業され、勝利の女神ニケに由来する社名と「スウッシュ」ロゴ、「Just Do It」の標語で知られるブランドはナイキ（Nike）です。"],
  [7,"Which American fashion designer built a global lifestyle empire with his 'Polo' brand featuring an embroidered polo player on a horse?",["Calvin Klein","Ralph Lauren","Tommy Hilfiger","Marc Jacobs"],1,"ポロ競技のプレイヤーの刺繍ロゴで知られ、アメリカン・トラッド（プレッピー・スタイル）を象徴するデザイナーはラルフ・ローレンです。"],
  [7,"Which luxury American jewelry retailer, founded in 1837 on Broadway in New York City, is famous for its robin's-egg blue boxes?",["Cartier","Tiffany & Co.","Harry Winston","Bulgari"],1,"1837年にニューヨークで創業し、「ティファニー・ブルー」の箱と映画『ティファニーで朝食を』で世界的に知られる宝飾ブランドはティファニー（Tiffany & Co.）です。"],
  [7,"Which influential fashion magazine, whose U.S. edition was led for decades by editor-in-chief Anna Wintour, organizes the annual 'Met Gala' in NYC?",["Harper's Bazaar","Vogue","Elle","Cosmopolitan"],1,"アナ・ウィンターが長年編集長を務め、毎年5月にメトロポリタン美術館でファッションの祭典「メットガラ（Met Gala）」を主催する雑誌は『ヴォーグ（Vogue）』です。"],
  [7,"Which weekly American news magazine, founded in 1923 by Henry Luce, has named a 'Person of the Year' (formerly Man of the Year) every year since 1927?",["Newsweek","TIME","The New Yorker","The Atlantic"],1,"赤い枠の表紙と1927年から続く毎年末の「パーソン・オブ・ザ・イヤー（今年の人）」選出で知られるアメリカの週刊ニュース誌は『タイム（TIME）』です。"],
  [7,"Which biweekly American magazine, founded in 1967 in San Francisco by Jann Wenner, is a premier publication on popular music, rock, and politics?",["Billboard","Rolling Stone","Spin","Variety"],1,"1967年にサンフランシスコで創刊され、ロック音楽やカルチャー、政治ジャーナリズムで大きな影響力を持つ雑誌は『ローリング・ストーン（Rolling Stone）』です。"],
  [7,"Which American society, founded in 1888 in Washington, D.C., publishes a world-renowned nature and science magazine famous for its yellow rectangular border?",["Smithsonian","National Geographic","Scientific American","Audubon"],1,"黄色い長方形の枠（イエロー・ボーダー）の表紙と美しい写真で知られる地理・科学雑誌は『ナショナル ジオグラフィック（National Geographic）』です。"],
  [7,"Which cable television channel launched on August 1, 1981, playing 'Video Killed the Radio Star' as its very first music video?",["VH1","MTV (Music Television)","BET","CMT"],1,"1981年8月1日に開局し、最初の曲としてバグルスの『ラジオ・スターの悲劇』を放送してミュージック・ビデオの時代を切り開いたのは「MTV」です。"],
  [7,"Which classic American board game, published by Parker Brothers in 1935, involves buying and trading properties named after streets in Atlantic City, New Jersey?",["Scrabble","Monopoly","The Game of Life","Risk"],1,"ニュージャージー州アトランティックシティの通り名をモチーフに不動産取引を行う世界的なボードゲームは「モノポリー（Monopoly）」です。"],
  [7,"Which American motorcycle manufacturer, founded in Milwaukee, Wisconsin in 1903, became an enduring symbol of heavy cruiser bikes and biker culture?",["Indian Motorcycle","Harley-Davidson","Triumph","Ducati"],1,"1903年にウィスコンシン州ミルウォーキーで創業し、映画『イージー・ライダー』などを通じてアメリカの自由とバイカー文化の象徴となったのは「ハーレーダビッドソン」です。"],
  [7,"What are the four grade levels of American high schools and four-year colleges called in order from 1st year to 4th year?",["Freshman, Sophomore, Junior, Senior","First, Second, Junior, Master","Freshman, Junior, Sophomore, Senior","Primary, Secondary, Junior, Senior"],0,"アメリカの高校・4年制大学の1年生から4年生は順に、Freshman（1年）、Sophomore（2年）、Junior（3年）、Senior（4年）と呼ばれます。"],
  [7,"What is the collective name for the eight prestigious private universities in the Northeastern United States, including Harvard, Yale, and Princeton?",["Big Ten","Ivy League","Seven Sisters","Public Ivies"],1,"ハーバード、イェール、プリンストン、コロンビア、ペンシルベニア、ブラウン、ダートマス、コーネルの北東部名門私立8大学は「アイビー・リーグ（Ivy League）」と呼ばれます。"],
  [7,"What metaphor has traditionally been used since a 1908 play by Israel Zangwill to describe American society as a fusion of diverse immigrant cultures?",["Mosaic","Melting Pot","Tapestry","Kaleidoscope"],1,"多様な移民の文化が溶け合って一つの社会を作るというアメリカの伝統的比喩は「人種のるつぼ（Melting Pot）」（近年は多様性を保つ「サラダボウル」も併用）です。"],
  [7,"Who coined the phrase 'The American Dream' in his 1931 historical book 'The Epic of America' to describe a land where everyone has opportunity according to ability?",["Horatio Alger","James Truslow Adams","Dale Carnegie","Norman Vincent Peale"],1,"生まれや階級に関わらず努力と能力に応じて誰もが成功の機会を得られる理想を「アメリカン・ドリーム（The American Dream）」と名付け広めたのは歴史家ジェームズ・トラスロー・アダムズ（1931年）です。"],
  [7,"Which iconic personification of the United States government, wearing a tall striped top hat and pointing forward on 'I Want You' recruiting posters, shares initials with 'United States'?",["Brother Jonathan","Uncle Sam","Columbia","John Bull"],1,"星条旗柄のシルクハットをかぶり「I Want You」の募兵ポスターで指をさすアメリカ合衆国の擬人化キャラクターは「アンクル・サム（Uncle Sam = U.S.）」です。"],
  [7,"Which cultural icon of World War II, depicted flexing her arm in a red-and-white polka-dot bandana under the slogan 'We Can Do It!', represented women factory workers?",["Molly Pitcher","Rosie the Riveter","Lady Liberty","Betty Boop"],1,"第二次世界大戦中に軍需工場で働く女性たちを象徴し、「We Can Do It!」のポスターで知られるキャラクターは「リベット工のロージー（Rosie the Riveter）」です。"],

  // ==================== PART 2: 科学・生活常識 (200問: #201–#400) ====================
  // 9. 生活常識①：長さ・距離・面積 (#201–#225)
  [8,"What is the name of the measurement system commonly used in daily life in the United States instead of the Metric System?",["U.S. Customary System (Imperial Units)","Decimal System","Kelvin System","Continental System"],0,"アメリカではメートル法ではなく、インチ・フィート・マイル・ポンド・ガロンなどを用いる「米国慣用単位（ヤード・ポンド法）」が日常生活で使われています。"],
  [8,"Approximately how many centimeters are in 1 inch?",["1.61 cm","2.54 cm","3.05 cm","3.79 cm"],1,"1インチ（inch）は正確に2.54センチメートルです。"],
  [8,"How many inches make 1 foot?",["10 inches","12 inches","16 inches","24 inches"],1,"1フィート（foot）は12インチで構成されています。"],
  [8,"Approximately how many centimeters are in 1 foot?",["25.4 cm","30.48 cm","45.36 cm","91.44 cm"],1,"1フィート（12インチ）は約30.48センチメートル（約30.5cm）です。"],
  [8,"Approximately how many centimeters is a person who is 6 feet tall (6'0\")?",["165 cm","175 cm","183 cm","195 cm"],2,"6フィートは 30.48cm × 6 ＝ 182.88cm となり、おおよそ183センチメートルです（決勝戦頻出問題）。"],
  [8,"Approximately how many centimeters is a person who is 5 feet tall (5'0\")?",["142 cm","152 cm","162 cm","172 cm"],1,"5フィートは 30.48cm × 5 ＝ 152.4cm となり、おおよそ152センチメートルです。"],
  [8,"Approximately how many centimeters is a person whose height is 5 feet 7 inches (5'7\")?",["160 cm","170 cm","180 cm","190 cm"],1,"5フィート7インチは計67インチ（67 × 2.54cm ＝ 170.18cm）で、おおよそ170センチメートルです。"],
  [8,"In U.S. notation, what do the symbols single prime (') and double prime (\") represent in the measurement 5'10\"?",["5 meters and 10 centimeters","5 yards and 10 feet","5 feet and 10 inches","5 pounds and 10 ounces"],2,"アメリカの長さ・身長表記では、「'」がフィート（feet）、「\"」がインチ（inches）を表し、5'10\"は5フィート10インチ（約178cm）を意味します。"],
  [8,"How many feet make 1 yard?",["2 feet","3 feet","4 feet","6 feet"],1,"1ヤード（yard）は3フィート（36インチ）です。"],
  [8,"Approximately how many centimeters (or meters) are in 1 yard?",["60.96 cm (0.61 m)","91.44 cm (0.91 m)","100.0 cm (1.00 m)","121.92 cm (1.22 m)"],1,"1ヤード（3フィート）は約91.44センチメートル（約0.91メートル）です。"],
  [8,"In American football, what is the length of the playing field between the two goal lines (excluding the two 10-yard end zones)?",["50 yards","80 yards","100 yards","120 yards"],2,"アメリカンフットボールのフィールドはゴールライン間が100ヤード（約91.4m）で、両端に10ヤードずつのエンドゾーンがあります。"],
  [8,"Approximately how many kilometers are in 1 statute mile?",["1.209 km","1.609 km","2.205 km","2.540 km"],1,"1マイル（mile）は約1.609キロメートル（約1.6km）です。"],
  [8,"How many feet are in 1 mile (the exact elevation of Denver, the 'Mile High City')?",["3,600 feet","5,000 feet","5,280 feet","6,000 feet"],2,"1マイルは5,280フィート（1,760ヤード）であり、コロラド州デンバーの標高（5,280フィート＝約1,609m）として知られます。"],
  [8,"If a U.S. highway speed limit sign reads '60 MPH,' approximately how fast is that in kilometers per hour (km/h)?",["About 75 km/h","About 85 km/h","About 96.5 km/h","About 115 km/h"],2,"MPHは「マイル毎時（miles per hour）」を意味し、60 MPHは 60 × 1.609 ＝ 約96.5 km/h です。"],
  [8,"Approximately how many miles is a full marathon race (42.195 km)?",["13.1 miles","20.0 miles","26.2 miles","31.1 miles"],2,"フルマラソン（42.195km）をマイルで表すと「26.2マイル（26マイル385ヤード）」、ハーフマラソンは「13.1マイル」です。"],
  [8,"Approximately how many kilometers is a '100-mile' distance?",["About 100 km","About 135 km","About 161 km","About 254 km"],2,"100マイルは約161キロメートルです。"],
  [8,"In basketball, how high above the floor is a standard NBA/regulation basketball hoop (rim) set?",["8 feet (approx. 244 cm)","10 feet (approx. 305 cm)","12 feet (approx. 366 cm)","15 feet (approx. 457 cm)"],1,"バスケットボールのリングの高さは世界共通で床から「10フィート（約305センチメートル）」と定められています。"],
  [8,"In Major League Baseball (MLB), what is the exact distance between the bases (and approximately between the pitcher's mound and home plate)?",["90 feet (bases) / 60 feet 6 inches (pitcher to home)","100 feet (bases) / 50 feet (pitcher to home)","60 feet (bases) / 45 feet (pitcher to home)","120 feet (bases) / 70 feet (pitcher to home)"],0,"野球の塁間距離は90フィート（約27.43m）、投手板から本塁までの距離は60フィート6インチ（約18.44m）です。"],
  [8,"What unit is commonly used in the United States to measure the floor area of houses and apartments?",["Tsubo","Square feet (sq ft)","Acres","Square miles"],1,"アメリカの住宅や部屋の床面積は「スクエア・フィート（平方フィート：sq ft）」で表示されます（1平方メートルは約10.76平方フィート）。"],
  [8,"What traditional unit of land area (equal to 43,560 square feet, or about 4,047 m²) is commonly used in the U.S. to measure farms and large plots of land?",["Hectare","Acre (エーカー)","League","Furlong"],1,"アメリカの農場や広大な土地の面積を表すのによく使われる単位は「エーカー（Acre、約4,047平方メートル＝約0.4ヘクタール）」です。"],
  [8,"What unit of speed, equal to 1 nautical mile (1.852 km) per hour, is used in aviation and maritime navigation in the U.S.?",["Mach","Knot (ノット)","Fathom","League"],1,"船舶や航空機の速度には、1時間に1海里（1.852km）進む速さである「ノット（Knot）」が使われます。"],
  [8,"What traditional nautical unit of water depth (equal to 6 feet or about 1.83 meters) gave Mark Twain his pen name?",["Furlong","Fathom (ファゾム / 尋)","Cubit","Knot"],1,"水深を測る単位「ファゾム（1ファゾム＝6フィート）」において、蒸気船が安全に航行できる水深2ファゾム（12フィート）を意味する掛け声「Mark Twain」が作家マーク・トウェインの筆名の由来です。"],
  [8,"What is the standard paper size used in U.S. offices and schools (measuring 8.5 × 11 inches), instead of the international A4 size?",["Legal Size","Letter Size (レターサイズ)","Executive Size","Tabloid Size"],1,"アメリカの学校やオフィスでは、A4サイズではなく横幅が少し広く縦が少し短い「レターサイズ（Letter：8.5×11インチ＝約216×279mm）」が標準です。"],
  [8,"When buying a television or laptop monitor, what does '55-inch' or '15-inch' measure?",["The horizontal width of the screen","The vertical height of the screen","The diagonal length across the screen","The perimeter of the screen"],2,"テレビやPC画面の「〇〇インチ」は、画面の対角線の長さをインチ（1インチ＝2.54cm）で表したものです。"],
  [8,"In the United States, what is the first floor of a building (at street level) called, compared to British English?",["Ground floor (U.S.) vs. First floor (U.K.)","First floor (U.S.) vs. Ground floor (U.K.)","Basement (U.S.) vs. First floor (U.K.)","Lobby floor (U.S.) vs. Second floor (U.K.)"],1,"アメリカ英語では地上階を日本と同じく「1階（First floor）」と呼びます（イギリス英語では地上階をGround floor、日本の2階をFirst floorと呼びます）。"],

  // 10. 生活常識②：重さ・容量・温度 (#226–#250)
  [9,"Approximately how many grams are in 1 pound (lb), the standard unit of weight in the United States?",["254 grams","378.5 grams","453.6 grams (approx. 0.45 kg)","600.0 grams"],2,"1ポンド（pound）は約453.6グラム（約0.45キログラム）です。"],
  [9,"What is the standard abbreviation for 'pound' (derived from the Latin word 'libra')?",["pd","lb","oz","pt"],1,"ポンド（pound）の略号はラテン語の「libra（天秤）」に由来する「lb（複数形はlbs）」です。"],
  [9,"Approximately how many pounds are in 1 kilogram (kg)?",["1.61 lbs","2.20 lbs","3.79 lbs","4.54 lbs"],1,"1キログラムは約2.205ポンド（約2.2ポンド）です（例：体重60kgは約132ポンド）。"],
  [9,"How many ounces (oz) make 1 pound (lb) in standard avoirdupois weight?",["10 ounces","12 ounces","16 ounces","20 ounces"],2,"1ポンドは16オンス（ounces）で構成されています。"],
  [9,"Approximately how many grams are in 1 ounce (oz)?",["14.2 grams","28.35 grams","45.4 grams","56.7 grams"],1,"常衡1オンス（ounce）は約28.35グラムです（ステーキの8オンスは約227グラム）。"],
  [9,"How many pounds are in 1 U.S. 'short ton' (commonly used in the United States), equal to about 907 kg?",["1,000 pounds","2,000 pounds","2,204 pounds","2,240 pounds"],1,"アメリカで使われる1トン（ショートトン）は2,000ポンド（約907.2kg）です（メートル法の1メトリックトン＝1,000kgとは異なります）。"],
  [9,"Approximately how many liters are in 1 U.S. liquid gallon (used for gasoline and milk)?",["1.609 liters","2.540 liters","3.785 liters","4.546 liters"],2,"アメリカの1ガロン（U.S. gallon）は約3.785リットル（約3.8L）です（イギリスのインペリアル・ガロン＝約4.546Lより少ない点に注意）。"],
  [9,"How many quarts make 1 gallon in the U.S. liquid measurement system?",["2 quarts","4 quarts","8 quarts","16 quarts"],1,"「quarter（4分の1）」と同じ語源の通り、4クォート（quarts）で1ガロンになります（1クォートは約946ml）。"],
  [9,"How many pints make 1 quart, and how many pints make 1 gallon?",["2 pints per quart / 8 pints per gallon","4 pints per quart / 16 pints per gallon","2 pints per quart / 4 pints per gallon","3 pints per quart / 12 pints per gallon"],0,"1クォートは2パイント、1ガロンは8パイントです（米国の1パイント＝16液量オンス＝約473ml）。"],
  [9,"Approximately how many milliliters (ml) are in 1 U.S. fluid ounce (fl oz)?",["15 ml","29.6 ml (approx. 30 ml)","50 ml","100 ml"],1,"アメリカの1液量オンス（fluid ounce）は約29.57ミリリットル（約30ml）で、一般的な355ml缶飲料は「12 fl oz」と表記されます。"],
  [9,"In American cooking recipes, approximately how many milliliters is 1 U.S. 'cup' (8 fluid ounces)?",["180 ml","200 ml","240 ml (236.6 ml)","300 ml"],2,"日本の計量カップは1カップ＝200mlですが、アメリカの1カップ（8液量オンス）は約240ミリリットル（236.6ml）です。"],
  [9,"What temperature scale is used in daily weather forecasts, cooking ovens, and fever thermometers in the United States?",["Celsius (Centigrade)","Fahrenheit (華氏)","Kelvin","Rankine"],1,"アメリカでは日常の気温・体温・オーブン温度にすべて「華氏（Fahrenheit：°F）」が使われます。"],
  [9,"What is the formula to convert Celsius (°C) to Fahrenheit (°F)?",["°F = °C × 5/9 - 32","°F = °C × 9/5 + 32","°F = °C + 273.15","°F = °C × 2 + 30"],1,"摂氏（°C）から華氏（°F）への変換公式は「°F ＝ °C × 9/5（または1.8）＋ 32」です。"],
  [9,"At what temperature in Fahrenheit (°F) does water freeze (0°C)?",["0°F","18°F","32°F","100°F"],2,"水の凝固点（摂氏0°C）は、華氏では「32°F」です。"],
  [9,"At what temperature in Fahrenheit (°F) does water boil (100°C) at standard atmospheric pressure?",["100°F","180°F","212°F","273°F"],2,"水の沸点（摂氏100°C）は、100 × 1.8 ＋ 32 ＝「212°F」です。"],
  [9,"What is considered normal average human body temperature in Fahrenheit (equivalent to 37°C)?",["68.0°F","98.6°F","100.0°F","104.0°F"],1,"人間の平熱（摂氏37.0°C）は華氏では「98.6°F」であり、100°F（約37.8°C）を超えると発熱（Fever）の目安とされます。"],
  [9,"If an American weather forecast says the temperature outside is '104°F,' what is that temperature in Celsius?",["30°C","35°C","40°C","45°C"],2,"(104 - 32) ÷ 1.8 ＝ 72 ÷ 1.8 ＝ 40°C となり、華氏104度は摂氏40度の猛暑日です（ちなみに68°F＝20°C、86°F＝30°C）。"],
  [9,"At what unique temperature do the Fahrenheit and Celsius scales read the exact same numerical value?",["0 degrees","-20 degrees","-32 degrees","-40 degrees (-40°F = -40°C)"],3,"マイナス40度（-40°C × 1.8 + 32 = -40°F）は、摂氏と華氏の数値が一致する唯一の温度です。"],
  [9,"What is the standard household electrical outlet voltage and frequency in the United States?",["100 volts / 50 Hz","120 volts / 60 Hz","220 volts / 50 Hz","240 volts / 60 Hz"],1,"アメリカの一般家庭のコンセントの標準電圧は「120ボルト（120V）」、周波数は全米共通で「60ヘルツ（60Hz）」です。"],
  [9,"What unit is used in U.S. agriculture to measure the volume/weight of dry grains such as corn, wheat, and soybeans (approx. 35.24 liters)?",["Barrel","Bushel (ブッシェル)","Gallon","Cord"],1,"トウモロコシ・小麦・大豆などの穀物取引で使われる単位は「ブッシェル（Bushel、容量約35.24リットル）」です。"],
  [9,"How many U.S. gallons are in 1 standard 'barrel' (bbl) of crude oil on the international market (approx. 159 liters)?",["31.5 gallons","42 gallons","50 gallons","100 gallons"],1,"原油取引の国際単位である1バレル（barrel）は、ペンシルベニア油田の樽の規格に由来し「42米ガロン（約159リットル）」と定められています。"],
  [9,"How many items are in a 'dozen' (ダース), and how many items are in a 'baker's dozen'?",["10 in a dozen / 12 in a baker's dozen","12 in a dozen / 13 in a baker's dozen","12 in a dozen / 14 in a baker's dozen","15 in a dozen / 16 in a baker's dozen"],1,"1ダース（dozen）は12個ですが、パン屋が量目不足の罰則を避けて1個おまけした慣習から「ベイカーズ・ダズン（baker's dozen）」は13個を意味します。"],
  [9,"In Abraham Lincoln's Gettysburg Address ('Four score and seven years ago...'), how many years is one 'score'?",["10 years","15 years","20 years","25 years"],2,"古い英語表現の「score」は「20」を意味し、「Four score and seven years ago（20×4＋7＝87年前）」は1863年から87年前の1776年（独立宣言）を指します。"],
  [9,"In the American numbering system, how many zeros are in a 'Million,' a 'Billion,' and a 'Trillion,' respectively?",["6 zeros (10⁶), 9 zeros (10⁹), and 12 zeros (10¹²)","6 zeros, 8 zeros, and 10 zeros","4 zeros, 8 zeros, and 12 zeros","6 zeros, 12 zeros, and 18 zeros"],0,"英語の数詞は3桁（0が3つ）ごとに単位が上がり、Million＝100万（10⁶）、Billion＝10億（10⁹）、Trillion＝1兆（10¹²）です。"],
  [9,"What unit is used to measure the purity of gold (out of 24 parts) and the weight of gemstones like diamonds (equal to 0.2 grams)?",["Ounce","Karat / Carat (カラット)","Grain","Troy"],1,"金の純度（24分率：米国ではKaratと綴ることが多い）および宝石の質量（1カラット＝0.2グラム：Carat）を表す単位は「カラット」です。"],

  // 11. 生活常識③：略語・頭字語 (#251–#275)
  [10,"What does the common abbreviation 'ASAP' stand for?",["Always Stay Calm and Polite","As Soon As Possible","American Standard Postal","At Some Appointed Place"],1,"ASAPは「As Soon As Possible（できるだけ早く・至急）」の略です（決勝戦出題実績あり）。"],
  [10,"What does 'RSVP' at the bottom of an American party or wedding invitation stand for?",["Remember Special VIPs","Répondez s'il vous plaît (French for 'Please reply')","Reserve Seats Very Promptly","Return Sender Verification Post"],1,"招待状に書かれるRSVPはフランス語の「Répondez s'il vous plaît（ご返事をお願いします＝出欠をご連絡ください）」の略です。"],
  [10,"What does 'ZIP' stand for in the U.S. Postal Service's 5-digit ZIP Code system introduced in 1963?",["Zone Information Post","Zone Improvement Plan","Zonal Index Process","Zero International Parcel"],1,"アメリカの郵便番号（ZIPコード）のZIPは「Zone Improvement Plan（地域改善計画）」の頭字語です。"],
  [10,"What does 'BYOB' mean on a restaurant sign or party invitation in the United States?",["Buy Your Own Ticket","Bring Your Own Bottle / Booze (or Beverage)","Be Your Own Boss","Book Your Own Booth"],1,"BYOBは「Bring Your Own Bottle / Booze（飲み物・お酒は各自持参で）」を意味します。"],
  [10,"What does the common email and office abbreviation 'FYI' stand for?",["From Your Inbox","For Your Information","Find Your Invoice","Follow Your Instructions"],1,"FYIはビジネスメールなどで「ご参考までに」を意味する「For Your Information」の略です。"],
  [10,"What does the transportation and delivery abbreviation 'ETA' stand for?",["Exact Time of Departure","Estimated Time of Arrival (到着予定時刻)","Emergency Traffic Alert","Express Transit Authority"],1,"空港やナビ、配送などでよく使われるETAは「Estimated Time of Arrival（到着予定時刻）」の略です（出発予定時刻はETD）。"],
  [10,"What do the Latin abbreviations 'e.g.' and 'i.e.' mean in English writing, respectively?",["e.g. = for example (exempli gratia) / i.e. = that is (id est)","e.g. = that is / i.e. = for example","e.g. = and so forth / i.e. = in other words","e.g. = exact grade / i.e. = in edition"],0,"ラテン語由来の「e.g.（exempli gratia）」は「例えば（for example）」、「i.e.（id est）」は「すなわち・言い換えれば（that is）」を意味します。"],
  [10,"What do the Latin abbreviations 'A.M.' and 'P.M.' used in 12-hour clock time stand for?",["After Midnight / Past Midday","Ante Meridiem (before noon) / Post Meridiem (after noon)","American Morning / Pacific Morning","At Morning / Past Morning"],1,"A.M.はラテン語の「Ante Meridiem（正午前＝午前）」、P.M.は「Post Meridiem（正午後＝午後）」の略です。"],
  [10,"What does the abbreviation 'DIY' (popularized by American home improvement stores like Home Depot) stand for?",["Design It Yourself","Do It Yourself","Drive It Yourself","Deliver It Yourself"],1,"日曜大工や自作を意味するDIYは「Do It Yourself（自分でやろう）」の略です。"],
  [10,"On official U.S. forms and medical records, what does 'DOB' stand for?",["Department of Business","Date of Birth (生年月日)","District of Boston","Day of Boarding"],1,"アメリカの公的書類や申込書にある「DOB」は「Date of Birth（生年月日）」の略です。"],
  [10,"What does the 9-digit identification number 'SSN' issued to U.S. citizens and residents stand for?",["State Security Number","Social Security Number (社会保障番号)","Standard Serial Number","System Service Number"],1,"アメリカで納税・雇用・銀行口座開設・信用照会に使われる9桁の番号「SSN」は「Social Security Number（社会保障番号）」の略です。"],
  [10,"In U.S. banking, what do 'ATM' and 'PIN' stand for?",["Automated Teller Machine / Personal Identification Number","American Money Machine / Private Index Number","Automatic Transfer Module / Passcode Input Number","Account Teller Machine / Personal Inquiry Number"],0,"ATMは「Automated Teller Machine（現金自動預払機）」、暗証番号のPINは「Personal Identification Number」の略です。"],
  [10,"In U.S. supermarkets and retail stores, what does the promotional deal 'BOGO' stand for?",["Best Offer Goes Out","Buy One, Get One (Free / Half Off)","Bargain Only Good Online","Bring One, Give One"],1,"アメリカのスーパーやアパレル店で頻繁に見かける「BOGO（ボゴ）」は「Buy One, Get One（1つ買うともう1つ無料／半額）」のセールを意味します。"],
  [10,"What do the scheduling abbreviations 'TBD' and 'TBA' stand for?",["To Be Determined (or Decided) / To Be Announced","Time Before Departure / Time Before Arrival","Total Budget Deficit / Total Balance Available","To Be Deleted / To Be Approved"],0,"イベント予定表などで「未定」を表すTBDは「To Be Determined（またはDecided）」、TBAは「To Be Announced（後日発表）」の略です。"],
  [10,"What does the abbreviation 'AKA' (often used for stage names or nicknames) stand for?",["Always Known Around","Also Known As (別名〜として知られる)","American Knowledge Association","Authorized Key Access"],1,"AKA（a.k.a.）は「Also Known As（別名・通称〜）」の略です。"],
  [10,"In U.S. corporate titles, what do 'CEO,' 'CFO,' and 'COO' stand for?",["Chief Executive Officer, Chief Financial Officer, and Chief Operating Officer","Central Executive Official, Central Finance Official, and Central Office Official","Corporate Equity Officer, Corporate Fund Officer, and Corporate Order Officer","Chairman of Executive Office, Chairman of Finance, and Chairman of Operations"],0,"CEOは最高経営責任者（Chief Executive Officer）、CFOは最高財務責任者（Financial）、COOは最高執行責任者（Operating）です。"],
  [10,"In U.S. schools and universities, what does 'GPA' stand for?",["General Pass Assessment","Grade Point Average (成績平均値)","Graduate Placement Admission","Global Academic Achievement"],1,"アメリカの高校・大学で重視される成績評価指標「GPA（通常4.0満点）」は「Grade Point Average」の略です。"],
  [10,"In U.S. politics and media, what does the acronym 'POTUS' stand for?",["Parliament of the United States","President of the United States","Party of the United States","Politicians of the United States"],1,"ホワイトハウスやメディアで使われる「POTUS（ポータス）」は「President of the United States（合衆国大統領）」の頭字語です（ファーストレディはFLOTUS、最高裁はSCOTUS）。"],
  [10,"What does the acronym 'POW / MIA' (seen on black-and-white flags flown at U.S. government buildings) stand for?",["Peace Over War / Military In America","Prisoner of War / Missing in Action (戦争捕虜・戦闘中行方不明者)","Patriots of Washington / Marines in Action","Protection of Witnesses / Military Intelligence Agency"],1,"POWは「Prisoner of War（戦争捕虜）」、MIAは「Missing in Action（戦闘中行方不明者）」を意味します。"],
  [10,"At U.S. airports, what agency is 'TSA,' which conducts security screenings of passengers and luggage?",["Transport System of America","Transportation Security Administration (運輸保安庁)","Travel Safety Association","Terminal Security Authority"],1,"9.11テロ後に国土安全保障省の下に置かれ、アメリカの空港保安検査を担っている機関「TSA」は「Transportation Security Administration（運輸保安庁）」です。"],
  [10,"In U.S. real estate and apartment listings, what does 'BR' or '2BR / 1BA' mean?",["2 Basement Rooms / 1 Balcony","2 Bedrooms / 1 Bathroom","2 Boardrooms / 1 Basement","2 Brick Rooms / 1 Back Alley"],1,"アメリカの住宅・アパート広告では、LDKではなく寝室とバスルームの数で表し、「2BR / 1BA」は「2ベッドルーム・1バスルーム」を意味します。"],
  [10,"In U.S. restaurants and bars, what does it mean when a server says an item is 'on the house'?",["It is cooked on the roof","It is free of charge (complimentary, paid for by the restaurant)","It is the most expensive dish","It must be eaten outside"],1,"レストランなどで「It's on the house.」と言われた場合は、「店のおごり（無料サービス）」という意味です。"],
  [10,"In American dining, what do customers ask for when they want to take their leftover food home from a restaurant?",["A rain check","A to-go box (or doggy bag)","A Dutch treat","A potluck"],1,"アメリカのレストランでは食べ残しを持ち帰る文化が一般的で、持ち帰り用の容器を「To-go box（またはDoggy bag）」と呼びます。"],
  [10,"In American retail stores, what is a 'rain check'?",["An umbrella rental ticket","A voucher issued when an advertised sale item is out of stock, allowing you to buy it later at the sale price","A refund for bad weather","A weather insurance policy"],1,"もともと野球の雨天順延引換券に由来する「レインチェック（rain check）」は、特売品が品切れの際に後日同じセール価格で購入できる引換券（または食事の誘いを「また今度にする」表現）です。"],
  [10,"What is a 'potluck' party in American daily culture?",["A casino night","A gathering where each guest brings a homemade or store-bought dish of food to share","A formal black-tie dinner","A barbecue competition"],1,"参加者がそれぞれ料理を1品ずつ持ち寄って分け合うパーティーを「ポットラック（potluck）」と呼びます。"],

  // 12. 生活常識④：教育・法律・習慣 (#276–#300)
  [11,"What does the term 'K–12' refer to in the American public education system?",["12 universities in Kentucky","Public schooling from Kindergarten through 12th grade (high school graduation)","A 12-kilometer school district","12 subjects required for college"],1,"アメリカの初等・中等教育は幼稚園年長（Kindergarten）から高校卒業の12年生（12th Grade）までを通算して「K-12（ケイ・トゥエルブ）」と呼びます。"],
  [11,"What are the four grade levels of a 4-year American high school (Grades 9–12) and 4-year college called in order?",["Freshman, Junior, Sophomore, Senior","Freshman (1st), Sophomore (2nd), Junior (3rd), Senior (4th)","First, Second, Third, Master","Primary, Middle, Junior, Senior"],1,"アメリカの高校（9〜12年生）および4年制大学の学年は、1年生から順に「Freshman、Sophomore、Junior、Senior」と呼ばれます。"],
  [11,"In which month does the academic school year typically begin in most regions of the United States?",["January","April","Late August or September","November"],2,"アメリカの学校や大学の新学年（新学期）は、4月ではなく8月下旬〜9月初旬（レイバー・デー前後）に始まります。"],
  [11,"Which two standardized tests are widely used for college admissions across the United States?",["TOEFL and TOEIC","SAT and ACT","GRE and GMAT","LSAT and MCAT"],1,"アメリカの4年制大学進学（学部入試）で広く使われる標準学力テストは「SAT」と「ACT」です（GREは大学院、LSATは法科大学院、MCATはメディカルスクール用）。"],
  [11,"What is the title given to the graduating student with the highest academic rank (GPA) who delivers the farewell speech at a U.S. graduation ceremony?",["Quarterback","Valedictorian (総代)","Homecoming King","Dean"],1,"アメリカの卒業式（Commencement）で成績最優秀の卒業生総代として告別の辞を述べる生徒は「ヴァレディクトリアン（Valedictorian、次点はSalutatorian）」と呼ばれます。"],
  [11,"What are public 2-year colleges in the U.S. that offer Associate Degrees and a pathway to transfer to 4-year universities called?",["Boarding Schools","Community Colleges (コミュニティ・カレッジ)","Charter Schools","Magnet Schools"],1,"地域住民に開かれた公立の2年制大学で、準学士号（Associate Degree）の取得や4年制大学3年次への編入ルートを提供する教育機関は「コミュニティ・カレッジ」です。"],
  [11,"In what order are calendar dates typically written in the United States (for example, how is July 4, 2026 written numerically)?",["DD/MM/YYYY (04/07/2026)","YYYY/MM/DD (2026/07/04)","MM/DD/YYYY (07/04/2026)","YYYY/DD/MM (2026/04/07)"],2,"アメリカでは「月／日／年（MM/DD/YYYY）」の順序で日付を表記します（例：03/14は3月14日＝円周率の日・Pi Day）。"],
  [11,"What is the standard 10-digit format for telephone numbers in the United States, and what is the international country calling code for the U.S.?",["(XXX) XXX-XXXX / Country code +1","XX-XXXX-XXXX / Country code +44","XXX-XXX-XXX / Country code +81","(XXXX) XX-XXXX / Country code +01"],0,"アメリカの電話番号は3桁の市外局番（エリアコード）を含む10桁「(XXX) XXX-XXXX」が標準で、国際電話の国番号はカナダと共通の「+1」です。"],
  [11,"What is the three-digit toll-free telephone number used throughout the United States for police, fire, and medical emergencies?",["110","119","911","999"],2,"アメリカの警察・消防・救急すべてに共通する緊急通報番号は「911（ナイン・ワン・ワン）」です。"],
  [11,"Under the National Minimum Drinking Age Act of 1984, what is the legal minimum age to purchase or publicly consume alcohol across all 50 U.S. states?",["18 years old","19 years old","20 years old","21 years old"],3,"アメリカの法定飲酒可能年齢（およびタバコ・電子タバコ購入可能年齢）は全50州で「21歳以上」と厳格に定められています。"],
  [11,"In most U.S. states, at what age can teenagers obtain a learner's permit or driver's license (reflecting America's car-oriented society)?",["14 to 15 years old","Around 16 years old","18 years old","21 years old"],1,"車社会のアメリカでは多くの州で「16歳」から運転免許（仮免許は14〜15歳からの州もあり）を取得でき、身分証明書としても使われます。"],
  [11,"On which side of the road do vehicles drive in the United States, and on which side of the car is the steering wheel located?",["Drive on the left / Steering wheel on the right","Drive on the right / Steering wheel on the left","Drive on the right / Steering wheel on the right","Drive on the left / Steering wheel on the left"],1,"アメリカの道路は「右側通行」であり、自動車は「左ハンドル」です。"],
  [11,"Unless a sign specifically prohibits it ('No Turn on Red'), what traffic rule is generally permitted at red traffic lights in most parts of the U.S.?",["Making a U-turn on a red light","Turning right on a red light after coming to a complete stop and checking for traffic","Going straight if no cars are coming","Turning left on a two-way street"],1,"アメリカ（ニューヨーク市マンハッタンなどを除く大半の地域）では、赤信号でも一旦完全停止して安全を確認すれば「右折（Right turn on red）」が認められています。"],
  [11,"What is the iconic color of public school buses across the United States, and what must drivers do when a school bus stops and flashes its red lights?",["Blue / Pass slowly","National School Bus Glossy Yellow / Come to a complete stop and do not pass","Red / Honk before passing","White / Change lanes"],1,"アメリカのスクールバスは視認性の高い「黄色（イエロー）」に統一されており、乗降のため赤色灯を点滅させて停車中は後続車も対向車も完全停止する義務があります。"],
  [11,"What are the four main continental time zones of the contiguous 48 U.S. states from East to West?",["Atlantic, Eastern, Central, Pacific","Eastern (EST), Central (CST), Mountain (MST), and Pacific (PST)","Eastern, Midwest, Western, Coastal","New York, Chicago, Texas, California"],1,"アメリカ本土48州の4つの時間帯は、東から順に東部時間（Eastern）、中部時間（Central）、山岳部時間（Mountain）、太平洋時間（Pacific）で、それぞれ1時間ずつ時差があります。"],
  [11,"What is the time difference between New York City (Eastern Time) and Los Angeles (Pacific Time)?",["1 hour","2 hours","3 hours (Los Angeles is 3 hours behind New York)","5 hours"],2,"東海岸のニューヨーク（東部時間）と西海岸のロサンゼルス（太平洋時間）の間には「3時間」の時差があります（NYが正午12時のときLAは朝9時）。"],
  [11,"Which U.S. state has the largest time difference from Washington, D.C. (and does not observe Daylight Saving Time along with Arizona)?",["California","Alaska","Hawaii","Washington"],2,"首都ワシントンD.C.との時差が最も大きい州はハワイ州（冬は5時間差、夏時間中はハワイが夏時間を行わないため6時間差）です。"],
  [11,"What English mnemonic phrase helps Americans remember how to adjust their clocks for Daylight Saving Time in the spring and fall?",["Early to bed, early to rise","Spring forward, fall back (春に1時間進め、秋に1時間戻す)","East is ahead, West is behind","Time flies when it's warm"],1,"夏時間（Daylight Saving Time）の切り替えでは、3月の第2日曜日に時計を1時間進め、11月の第1日曜日に1時間戻すことを「Spring forward, fall back」という語呂合わせで覚えます。"],
  [11,"When shopping in most U.S. stores, why is the final price you pay at the cash register higher than the price tag on the shelf?",["Because a mandatory tip is added","Because state and local Sales Tax is added at the register (tax-exclusive pricing)","Because credit cards cost extra","Because bags cost 20%"],1,"アメリカでは州や郡・市ごとに消費税（Sales Tax）の税率が異なるため、値札は「税抜価格」で表示され、レジ精算時に税金が加算されます。"],
  [11,"What is the civic duty in the U.S. legal system where ordinary registered citizens are summoned by a court to hear evidence and decide a verdict in a trial?",["Military Conscription","Jury Duty (陪審員義務)","Community Service","Filibuster"],1,"合衆国憲法で陪審裁判を受ける権利が保障されているため、アメリカの成人市民には裁判所から召喚された際に「陪審員を務める市民的義務（Jury Duty）」があります。"],
  [11,"Which bird was chosen in 1782 as the national bird and official emblem on the Great Seal of the United States?",["Wild Turkey","Bald Eagle (ハクトウワシ)","California Condor","Peregrine Falcon"],1,"アメリカの国鳥であり、国章（Great Seal）や大統領紋章に描かれている象徴は「ハクトウワシ（Bald Eagle）」です。"],
  [11,"Which flower was designated by President Ronald Reagan in 1986 as the official national floral emblem of the United States?",["Sunflower","Rose (バラ)","Cherry Blossom","Magnolia"],1,"1986年にロナルド・レーガン大統領の署名により、アメリカの国花は「バラ（Rose）」に定められました。"],
  [11,"Which mammal was designated as the National Mammal of the United States in 2016 when President Barack Obama signed the National Bison Legacy Act?",["Grizzly Bear","American Bison (アメリカバイソン / バッファロー)","White-tailed Deer","Mountain Lion"],1,"2016年にオバマ大統領が署名した法律により、アメリカの国獣（National Mammal）には「アメリカバイソン（American Bison）」が指定されました。"],
  [11,"How many stars and how many red-and-white stripes are on the current flag of the United States, and what do they represent?",["50 stars (50 states) and 13 stripes (original 13 colonies)","50 stars and 15 stripes","48 stars and 13 stripes","52 stars and 10 stripes"],0,"星条旗には現在の州の数を表す「50個の星」と、独立時の13植民地を表す「13本の赤と白の縞（ストライプ）」が描かれています。"],
  [11,"In the 'Pledge of Allegiance,' what are the closing six words: '...one Nation under God, indivisible, ___ ___ ___ ___ ___ ___'?",["forever and ever amen","with liberty and justice for all","land of the free and brave","united we stand together"],1,"フランシス・ベラミーが起草した『忠誠の誓い（Pledge of Allegiance）』は、「...one Nation under God, indivisible, with liberty and justice for all.（すべての人に自由と正義が約束された、神の下の分割すべからざる一つの国）」と結ばれます。"],

  // 13. 科学①：発明家と技術革新 (#301–#325)
  [12,"Which Founding Father and scientist performed the famous 1752 kite experiment in a thunderstorm and invented the lightning rod and bifocal glasses?",["Thomas Jefferson","Benjamin Franklin","Alexander Hamilton","Samuel Adams"],1,"建国の父ベンジャミン・フランクリンは科学者・発明家としても著名で、凧の実験によって雷が電気であることを証明し、避雷針や遠近両用メガネを発明しました。"],
  [12,"Who invented the 'Cotton Gin' (綿繰り機) in 1793 and pioneered the use of interchangeable parts in manufacturing?",["Robert Fulton","Eli Whitney","Cyrus McCormick","Elias Howe"],1,"イーライ・ホイットニーは1793年に綿繰り機（Cotton Gin）を発明して南部の綿花生産を飛躍させ、互換性部品による工業生産方式も確立しました。"],
  [12,"Which American engineer built the first commercially successful steamboat, the 'Clermont,' which steamed up the Hudson River in 1807?",["Robert Fulton","Peter Cooper","George Stephenson","Rudolf Diesel"],0,"ロバート・フルトンは1807年に外輪蒸気船「クラーモント号」を建造し、ニューヨークのハドソン川で世界初の商業蒸気船運航に成功しました。"],
  [12,"Who invented the single-wire electric telegraph and co-developed the dot-and-dash code that bears his name, sending the message 'What hath God wrought' in 1844?",["Alexander Graham Bell","Samuel Morse","Guglielmo Marconi","Thomas Edison"],1,"画家でもあったサミュエル・モールスは電信機と「モールス信号（Morse Code）」を発明し、1844年にワシントン〜ボルティモア間で初の長距離電信を送りました。"],
  [12,"Which American inventor discovered the 'vulcanization' (加硫法) of rubber in 1839, lending his name to a famous tire company?",["Harvey Firestone","Charles Goodyear","John Dunlop","B.F. Goodrich"],1,"チャールズ・グッドイヤーは1839年に生ゴムに硫黄を加えて加熱し弾性と強度を高める「加硫法」を発見しました。"],
  [12,"Who demonstrated the first safety elevator brake at the 1854 New York World's Fair, making modern skyscrapers possible?",["Louis Sullivan","Elisha Otis","Andrew Carnegie","George Pullman"],1,"エリシャ・オーチスが1853〜1854年に落下防止安全装置付きエレベーターを発明したことで、都市の高層ビル（摩天楼）の建設が可能になりました。"],
  [12,"Who received the first U.S. patent for the telephone in 1876 and spoke the famous first words 'Mr. Watson, come here, I want to see you'?",["Thomas Edison","Alexander Graham Bell","Nikola Tesla","Elisha Gray"],1,"スコットランド出身でボストン大学教授だったアレクサンダー・グラハム・ベルが1876年に電話機の特許を取得し、後のAT&T（ベル・システム）の礎を築きました。"],
  [12,"Which prolific American inventor, nicknamed the 'Wizard of Menlo Park' (in New Jersey), held 1,093 U.S. patents including the phonograph, kinetoscope, and incandescent light bulb?",["Nikola Tesla","Thomas Edison","George Westinghouse","Henry Ford"],1,"ニュージャージー州メンローパークに世界初の産業研究所を設立した「発明王」トーマス・エジソンは、蓄音機・白熱電球・覗き眼鏡式映写機など1,093件の米国特許を取得しました。"],
  [12,"Which Serbian-American inventor and electrical engineer pioneered the Alternating Current (AC) electrical system, competing against Edison's Direct Current (DC) in the 'War of the Currents'?",["Guglielmo Marconi","Nikola Tesla","Michael Faraday","Enrico Fermi"],1,"ニコラ・テスラは交流（AC）送電システムや誘導モーターを開発してエジソンの直流（DC）との「電流戦争」に勝利し、その名はEVメーカーのテスラ社にも冠されています。"],
  [12,"Who founded the Eastman Kodak Company in Rochester, New York in 1888, popularizing roll film and snapshot photography with the slogan 'You press the button, we do the rest'?",["Edwin Land","George Eastman","Mathew Brady","Ansel Adams"],1,"ジョージ・イーストマンはニューヨーク州ロチェスターでコダック社を創業し、ロールフィルムと小型カメラによって写真撮影を一般大衆に広めました。"],
  [12,"Which two brothers from Dayton, Ohio achieved the world's first controlled, powered airplane flight at Kitty Hawk, North Carolina on December 17, 1903?",["Warner Brothers","Orville and Wilbur Wright (The Wright Brothers)","Mayo Brothers","Dodge Brothers"],1,"オハイオ州デイトン出身のライト兄弟（オービルとウィルバー）は、1903年12月17日にノースカロライナ州キティホークでライトフライヤー号による世界初の有人動力飛行に成功しました。"],
  [12,"Which U.S. state uses the slogan 'First in Flight' on its license plates to commemorate the Wright Brothers' 1903 flight at Kitty Hawk?",["Ohio","North Carolina","Virginia","South Carolina"],1,"キティホークがあるノースカロライナ州は、自動車のナンバープレートに「First in Flight（初飛行の地）」の標語を掲げています（ライト兄弟の出身地オハイオ州は「Birthplace of Aviation」）。"],
  [12,"Who revolutionized automobile manufacturing in Highland Park, Michigan in 1913 by introducing the moving assembly line for the Model T?",["Ransom Olds","Henry Ford","Walter Chrysler","Alfred P. Sloan"],1,"ヘンリー・フォードは1913年にベルトコンベア式移動組み立てラインを導入し、T型フォードの製造時間を大幅に短縮して大衆車時代を切り開きました。"],
  [12,"Which American engineer invented modern electrical air conditioning in 1902, transforming population growth across the southern 'Sun Belt'?",["Elisha Otis","Willis Carrier","Clarence Birdseye","Philo Farnsworth"],1,"ウィリス・キャリアが1902年に近代的なエアコン（空調設備）を発明したことで、高温多湿なアメリカ南部・南西部（サンベルト）の都市発展が可能になりました。"],
  [12,"Which African American agricultural scientist at the Tuskegee Institute became famous for promoting crop rotation and developing hundreds of uses for peanuts and sweet potatoes?",["Booker T. Washington","George Washington Carver","Percy Julian","Charles Drew"],1,"ジョージ・ワシントン・カーヴァーは南部農業の土壌回復のためピーナッツやサツマイモの輪作を奨励し、「ピーナッツ博士」として尊敬を集めました。"],
  [12,"Which American physicist and inventor launched the world's first liquid-fueled rocket in Auburn, Massachusetts on March 16, 1926?",["Wernher von Braun","Robert H. Goddard","Theodore von Kármán","Carl Sagan"],1,"ロバート・ゴダードは1926年に世界初の液体燃料ロケットの打ち上げに成功した「近代ロケット工学の父」であり、NASAのゴダード宇宙飛行センターにその名が冠されています。"],
  [12,"Who demonstrated the first all-electronic television system in San Francisco in 1927 at the age of 21?",["David Sarnoff","Philo Farnsworth","Lee de Forest","Edwin Armstrong"],1,"アイダホ州の農村で育った発明家フィロ・ファーンズワースは、1927年に21歳で世界初の完全電子式テレビの映像伝送に成功しました。"],
  [12,"Which chemist at the DuPont company invented 'Nylon' in 1935, the world's first fully synthetic fiber?",["Leo Baekeland","Wallace Carothers","Stephanie Kwolek","Roy Plunkett"],1,"デュポン社の化学者ウォーレス・カロザースは1935年に世界初の合成繊維「ナイロン（Nylon）」を発明しました（女性用ストッキングやパラシュートに革命を起こしました）。"],
  [12,"Which engineer at Raytheon accidentally invented the 'Microwave Oven' in 1945 after noticing that radar magnetron waves melted a chocolate bar in his pocket?",["Willis Carrier","Percy Spencer","Chester Carlson","Jack Kilby"],1,"レイセオン社の技師パーシー・スペンサーは、レーダー用のマグネトロン実験中にポケットのチョコレートが溶けたことから1945年に電子レンジ（Microwave Oven）を発明しました。"],
  [12,"Who co-founded Polaroid Corporation and invented the instant camera in 1948?",["George Eastman","Edwin H. Land","Chester Carlson","Harold Edgerton"],1,"エドウィン・ランドは偏光板（ポラロイド）や撮影したその場で現像できるインスタントカメラを発明しました。"],
  [12,"Which female chemist at DuPont invented 'Kevlar' in 1965, a lightweight synthetic fiber five times stronger than steel used in bulletproof vests?",["Rachel Carson","Stephanie Kwolek","Grace Hopper","Rosalind Franklin"],1,"デュポン社の女性化学者ステファニー・クオレクは1965年に同じ重さの鋼鉄の5倍の強度を持つアラミド繊維「ケブラー（Kevlar）」を発明し、防弾チョッキなどで多くの命を救いました。"],
  [12,"What is the name of the U.S. government agency within the Department of Commerce that issues patents and registers trademarks?",["FCC","USPTO (United States Patent and Trademark Office)","NIST","FTC"],1,"アメリカの特許権および商標権の審査・登録を管轄する商務省傘下の機関は「米国特許商標庁（USPTO）」です。"],
  [12,"Which 19th-century American inventor developed the 'QWERTY' keyboard layout for the typewriter in Milwaukee, Wisconsin?",["Samuel Morse","Christopher Latham Sholes","Ottmar Mergenthaler","Isaac Singer"],1,"現在のパソコンやスマートフォンでも使われている「QWERTY配列」のタイプライターを1860〜70年代に開発したのはクリストファー・レイサム・ショールズです。"],
  [12,"Who invented 'Xerography' (electrophotography / dry photocopying) in 1938, leading to the modern Xerox photocopier?",["Chester Carlson","Gary Starkweather","Charles Babbage","Herman Hollerith"],0,"チェスター・カールソンは1938年に乾式静電複写技術「ゼログラフィ」を発明し、ゼロックス社のコピー機を生み出しました。"],
  [12,"Which American test pilot became the first human to break the 'Sound Barrier' (flying faster than Mach 1) in the Bell X-1 rocket plane in October 1947?",["Charles Lindbergh","Chuck Yeager","John Glenn","Neil Armstrong"],1,"チャック・イェーガーは1947年10月14日、ロケット実験機ベルX-1に搭乗して人類で初めて音速の壁（マッハ1）を突破しました。"],

  // 14. 科学②：宇宙開発・NASA・航空 (#326–#350)
  [13,"What does the acronym 'NASA' (established in 1958 by President Dwight D. Eisenhower) stand for?",["National American Space Agency","National Aeronautics and Space Administration (アメリカ航空宇宙局)","North American Satellite Authority","National Astrological and Space Association"],1,"1958年にアイゼンハワー大統領の下で設立されたNASAは「National Aeronautics and Space Administration（アメリカ航空宇宙局）」の略です。"],
  [13,"In which U.S. state is NASA's John F. Kennedy Space Center (the primary launch site for Apollo, the Space Shuttle, and Artemis) located?",["Texas","Florida (Merritt Island / Cape Canaveral)","California","Alabama"],1,"アポロ計画やスペースシャトルなどのロケット打ち上げ拠点である「ケネディ宇宙センター」は、フロリダ州メリット島（ケープカナベラル隣接）にあります。"],
  [13,"In which city and state is NASA's Lyndon B. Johnson Space Center (home to Mission Control and astronaut training, famous for the phrase 'Houston, we have a problem') located?",["Orlando, Florida","Houston, Texas","Huntsville, Alabama","Pasadena, California"],1,"有人宇宙飛行の管制センター（ミッション・コントロール）や宇宙飛行士の訓練施設がある「ジョンソン宇宙センター」は、テキサス州ヒューストンにあります。"],
  [13,"Where in Southern California is NASA's Jet Propulsion Laboratory (JPL), which manages robotic planetary spacecraft and Mars rovers, located (managed by Caltech)?",["San Diego","Pasadena","San Jose","Sacramento"],1,"火星探査車や惑星探査機の開発・運用を担うNASAの「ジェット推進研究所（JPL）」は、カリフォルニア州パサデナにありカリフォルニア工科大学（Caltech）が運営しています。"],
  [13,"What was the name of the first U.S. human spaceflight program (1958–1963), whose seven astronauts were known as the 'Original Seven'?",["Project Gemini","Project Mercury (マーキュリー計画)","Project Apollo","Project Artemis"],1,"アメリカ最初の有人宇宙飛行計画は「マーキュリー計画（Project Mercury）」で、その後ジェミニ計画、アポロ計画へと続きました。"],
  [13,"Who became the first American in space (on a suborbital flight in May 1961), and who became the first American to orbit the Earth (in February 1962)?",["Neil Armstrong (suborbital) / Buzz Aldrin (orbit)","Alan Shepard (first in space) / John Glenn (first to orbit Earth)","John Glenn (first in space) / Alan Shepard (first to orbit)","Gus Grissom / Wally Schirra"],1,"1961年5月にアメリカ人初の宇宙飛行（弾道飛行）を果たしたのがアラン・シェパード、1962年2月にアメリカ人初の地球周回軌道飛行に成功したのがジョン・グレンです。"],
  [13,"On what date in 1969 did NASA's Apollo 11 Lunar Module 'Eagle' land on the Moon?",["May 25, 1969","July 4, 1969","July 20, 1969","November 19, 1969"],2,"アポロ11号の月着陸船「イーグル」が月面の「静かの海」に着陸したのは1969年7月20日です。"],
  [13,"Who was the Apollo 11 commander who became the first human to walk on the Moon, saying 'That's one small step for [a] man, one giant leap for mankind'?",["Buzz Aldrin","Neil Armstrong","Michael Collins","Jim Lovell"],1,"「これは一人の人間にとっては小さな一歩だが、人類にとっては偉大な飛躍である」の言葉と共に月面に最初の一歩を記したのはニール・アームストロング船長です。"],
  [13,"Who were the other two astronauts on the historic Apollo 11 mission alongside Neil Armstrong?",["John Glenn and Alan Shepard","Buzz Aldrin (walked on the Moon) and Michael Collins (Command Module pilot)","Jim Lovell and Pete Conrad","Eugene Cernan and Harrison Schmitt"],1,"アポロ11号の乗組員3名は、船長ニール・アームストロング、共に月面を歩いたバズ・オルドリン、司令船コロンビアで月周回軌道を留守番したマイケル・コリンズです。"],
  [13,"What was the giant 110-meter-tall three-stage rocket, developed under Wernher von Braun at Huntsville, Alabama, that launched the Apollo astronauts to the Moon?",["Falcon Heavy","Saturn V (サターンV型ロケット)","Atlas V","Titan II"],1,"アポロ計画で人類を月へ送り届けた全長110mの巨大ロケットは、ヴェルナー・フォン・ブラウンらが開発した「サターンV（ファイブ）型ロケット」です。"],
  [13,"Which twin NASA robotic probes, launched in 1977 carrying the 'Golden Record,' became the first human-made objects to enter interstellar space?",["Pioneer 10 and 11","Voyager 1 and Voyager 2 (ボイジャー1号・2号)","Viking 1 and 2","Mariner 9 and 10"],1,"1977年に打ち上げられ、木星・土星・天王星・海王星を探査した後に太陽圏を脱出して星間空間へ到達した探査機は「ボイジャー1号・2号」です。"],
  [13,"What was the name of the first NASA Space Shuttle orbiter to fly in space, launched on April 12, 1981?",["Challenger","Columbia (コロンビア)","Discovery","Atlantis"],1,"1981年4月に世界初の再使用型有人宇宙船スペースシャトルの初飛行（STS-1）を行ったオービターは「コロンビア（Columbia）」です。"],
  [13,"Who became the first American woman in space aboard the Space Shuttle Challenger in June 1983?",["Mae Jemison","Sally Ride (サリー・ライド)","Christa McAuliffe","Peggy Whitson"],1,"物理学者で宇宙飛行士のサリー・ライド（Sally Ride）は、1983年6月にスペースシャトル・チャレンジャー号に搭乗し、アメリカ人女性として初めて宇宙へ行きました（メイ・ジェミソンはアフリカ系女性初）。"],
  [13,"Who was the Japanese American payload specialist who flew aboard the Space Shuttle Discovery in January 1985 and tragically perished in the Challenger disaster in January 1986?",["Mamoru Mohri","Ellison Onizuka (エリソン・オニヅカ)","Koichi Wakata","Soichi Noguchi"],1,"ハワイ出身の日系アメリカ人宇宙飛行士エリソン・オニヅカは、1985年に日系人初の宇宙飛行を果たしましたが、翌1986年1月のチャレンジャー号爆発事故で殉職しました。"],
  [13,"Which famous space telescope was launched into low Earth orbit by the Space Shuttle Discovery in April 1990 and revolutionized astronomy?",["Chandra X-ray Observatory","Hubble Space Telescope (ハッブル宇宙望遠鏡)","Spitzer Space Telescope","Kepler Space Telescope"],1,"1990年4月にスペースシャトル・ディスカバリー号で軌道に投入された「ハッブル宇宙望遠鏡」は、大気の揺らぎのない鮮明な天体画像で宇宙観測に革命をもたらしました。"],
  [13,"Which next-generation infrared space telescope, featuring a 6.5-meter gold-coated segmented mirror, was launched on December 25, 2021 as the successor to Hubble?",["Roman Space Telescope","James Webb Space Telescope (JWST / ジェイムズ・ウェブ宇宙望遠鏡)","Galileo Telescope","Cassini Telescope"],1,"2021年12月に打ち上げられた「ジェイムズ・ウェブ宇宙望遠鏡（JWST）」は、アポロ計画時のNASA長官の名を冠し、初期宇宙や系外惑星の赤外線観測を行っています。"],
  [13,"Which NASA Mars rover landed in Jezero Crater in February 2021, carrying the small robotic helicopter 'Ingenuity' (which achieved the first powered flight on another planet)?",["Sojourner","Spirit","Curiosity","Perseverance (パーサヴィアランス)"],3,"2021年2月に火星のジェゼロ・クレーターに着陸した探査車「パーサヴィアランス（忍耐）」は、小型ヘリコプター「インジェニュイティ」による地球外の惑星での初飛行を成功させました。"],
  [13,"What is the name of the current NASA-led international lunar exploration program (named after Apollo's twin sister in Greek mythology) aiming to return humans to the Moon?",["Project Gemini","Artemis Program (アルテミス計画)","Project Orion","Lunar Gateway Program"],1,"ギリシャ神話のアポロンの双子の姉（月の女神）にちなんだ「アルテミス計画（Artemis Program）」は、日本なども参加して月面への有人着陸と持続的探査を目指す計画です。"],
  [13,"Which private aerospace company was founded by Elon Musk in 2002 and developed the reusable 'Falcon 9' rocket, 'Crew Dragon' spacecraft, and 'Starship'?",["Blue Origin","SpaceX (スペースX)","Virgin Galactic","Rocket Lab"],1,"イーロン・マスクが2002年に設立した「スペースX（SpaceX）」は、ロケット第1段の垂直着陸・再利用や民間初のISS有人輸送（クルードラゴン）を実現しました。"],
  [13,"Which private aerospace company was founded in 2000 by Amazon founder Jeff Bezos and developed the 'New Shepard' and 'New Glenn' rockets?",["SpaceX","Blue Origin (ブルーオリジン)","Sierra Space","United Launch Alliance"],1,"Amazon創業者のジェフ・ベゾスが設立した宇宙開発企業は「ブルーオリジン（Blue Origin）」です。"],
  [13,"Which 20th-century American astronomer at Mount Wilson Observatory proved that other galaxies exist beyond the Milky Way and that the universe is expanding?",["Clyde Tombaugh","Edwin Hubble (エドウィン・ハッブル)","Carl Sagan","Harlow Shapley"],1,"エドウィン・ハッブルは1920年代にウィルソン山天文台での観測から、銀河系外に他の銀河が存在することと宇宙が膨張していること（ハッブル＝ルメートルの法則）を発見しました。"],
  [13,"Which young American astronomer discovered Pluto in 1930 at the Lowell Observatory in Flagstaff, Arizona?",["Percival Lowell","Clyde Tombaugh (クライド・トンボー)","Gerard Kuiper","Mike Brown"],1,"冥王星（Pluto、2006年より準惑星）は1930年にアリゾナ州のローウェル天文台でクライド・トンボーによって発見されました（2015年にNASAの探査機ニュー・ホライズンズが接近探査）。"],
  [13,"Which Cornell University astronomer and science communicator hosted the 1980 TV series 'Cosmos' and described Earth photographed from 6 billion km away as a 'Pale Blue Dot'?",["Neil deGrasse Tyson","Carl Sagan (カール・セーガン)","Richard Feynman","Stephen Hawking"],1,"天文学者カール・セーガンは科学番組『コスモス』やSF小説『コンタクト』で知られ、ボイジャー1号が撮影した地球の写真を「ペイル・ブルー・ドット（淡く青い点）」と表現しました。"],
  [13,"Which museum on the National Mall in Washington, D.C. displays the 1903 Wright Flyer, the Spirit of St. Louis, and the Apollo 11 Command Module Columbia?",["American Museum of Natural History","Smithsonian National Air and Space Museum (国立航空宇宙博物館)","Kennedy Space Center","Intrepid Museum"],1,"ワシントンD.C.にあるスミソニアン協会の「国立航空宇宙博物館（National Air and Space Museum）」には、ライトフライヤー号やアポロ11号司令船などの実物が展示されています。"],
  [13,"Which African American female mathematician at NASA calculated orbital trajectories for Alan Shepard, John Glenn, and Apollo 11, and was portrayed in the 2016 film 'Hidden Figures'?",["Dorothy Vaughan","Katherine Johnson (キャサリン・ジョンソン)","Mary Jackson","Sally Ride"],1,"映画『ドリーム（原題：Hidden Figures）』の主人公となったNASAの数学者キャサリン・ジョンソンは、マーキュリー計画やアポロ11号の軌道計算に多大な貢献を果たしました。"],

  // 15. 科学③：物理・化学・ノーベル賞 (#351–#375)
  [14,"Where does the United States rank among all countries in the total number of Nobel Prizes won (with over 400 laureates)?",["1st in the world","2nd in the world","3rd in the world","4th in the world"],0,"アメリカ合衆国はノーベル賞の受賞者数が400名を超えており、世界の国別ランキングで圧倒的第1位です。"],
  [14,"Who was the very first American scientist to win a Nobel Prize in a science category, winning the 1907 Nobel Prize in Physics for measuring the speed of light?",["Robert Millikan","Albert A. Michelson (アルバート・マイケルソン)","Arthur Compton","Ernest Lawrence"],1,"マイケルソン・モーリーの実験や光速の精密測定で知られる物理学者アルバート・マイケルソンは、1907年にアメリカ人として初めて科学部門のノーベル賞（物理学賞）を受賞しました。"],
  [14,"Which American physicist at Caltech won the 1923 Nobel Prize in Physics for his 'oil-drop experiment' that measured the elementary electric charge of the electron?",["Albert Michelson","Robert A. Millikan (ロバート・ミリカン)","Carl Anderson","Edwin McMillan"],1,"ロバート・ミリカンは「ミリカンの油滴実験」によって電子の電気素量を精密に測定し、1923年にノーベル物理学賞を受賞しました。"],
  [14,"Which German-born physicist, author of the Theory of Relativity (E = mc²), emigrated to the United States in 1933 and worked at the Institute for Advanced Study in Princeton, New Jersey?",["Niels Bohr","Albert Einstein (アルベルト・アインシュタイン)","Werner Heisenberg","Max Planck"],1,"相対性理論で知られるアルベルト・アインシュタインは、ナチス政権が誕生した1933年にアメリカへ亡命し、ニュージャージー州のプリンストン高等研究所で後半生を送りました。"],
  [14,"At which university in Illinois did physicist Enrico Fermi achieve the world's first artificial, self-sustaining nuclear chain reaction (Chicago Pile-1) in December 1942?",["Harvard University","University of Chicago (シカゴ大学)","Columbia University","UC Berkeley"],1,"イタリアから亡命した物理学者エンリコ・フェルミは、1942年12月にシカゴ大学のフットボール競技場スタンド下に設けた実験炉「シカゴ・パイル1号」で人類初の制御された核分裂連鎖反応に成功しました。"],
  [14,"Which American theoretical physicist served as the scientific director of the Manhattan Project's Los Alamos Laboratory in New Mexico during World War II?",["Richard Feynman","J. Robert Oppenheimer (ロバート・オッペンハイマー)","Edward Teller","Ernest Lawrence"],1,"マンハッタン計画においてニューメキシコ州ロスアラモス研究所の初代所長を務め、「原爆の父」と呼ばれた理論物理学者はJ・ロバート・オッペンハイマーです。"],
  [14,"What was the code name of the world's first nuclear explosion test, conducted on July 16, 1945 in the desert near Alamogordo, New Mexico?",["Operation Crossroads","Trinity Test (トリニティ実験)","Project Ivory","Manhattan Test"],1,"1945年7月16日にニューメキシコ州アラモゴード近郊の砂漠で実施された人類初の核実験のコードネームは「トリニティ実験（Trinity Test）」です。"],
  [14,"Which charismatic American physicist won the 1965 Nobel Prize in Physics (with Shin'ichiro Tomonaga and Julian Schwinger) for Quantum Electrodynamics (QED) and created 'Feynman Diagrams'?",["Murray Gell-Mann","Richard P. Feynman (リチャード・ファインマン)","Steven Weinberg","Sheldon Glashow"],1,"リチャード・ファインマンは量子電磁力学（QED）の研究で朝永振一郎らと共に1965年ノーベル物理学賞を受賞し、『ご冗談でしょう、ファインマンさん』などの著作でも親しまれました。"],
  [14,"Which American physicist at Caltech won the 1969 Nobel Prize in Physics for proposing 'Quarks' as the fundamental building blocks of protons and neutrons?",["Richard Feynman","Murray Gell-Mann (マレー・ゲルマン)","Leon Lederman","Frank Wilczek"],1,"陽子や中性子を構成する素粒子「クォーク（Quark）」の概念を提唱し命名したのは、アメリカの理論物理学者マレー・ゲルマンです。"],
  [14,"Which American physicist is the ONLY person in history to win the Nobel Prize in Physics TWICE (in 1956 for the transistor and in 1972 for the BCS theory of superconductivity)?",["Linus Pauling","John Bardeen (ジョン・バーディーン)","Frederick Sanger","Marie Curie"],1,"ジョン・バーディーンは、トランジスタの発明（1956年）と超伝導のBCS理論（1972年）により、史上唯一ノーベル物理学賞を2度受賞した人物です。"],
  [14,"Which American chemist is the ONLY person in history to win TWO unshared (solo) Nobel Prizes—winning the Nobel Prize in Chemistry (1954) and the Nobel Peace Prize (1962)?",["Glenn Seaborg","Linus Pauling (ライナス・ポーリング)","Harold Urey","Norman Borlaug"],1,"量子化学のライナス・ポーリングは、1954年にノーベル化学賞、1962年に核実験反対運動でノーベル平和賞を受賞し、共同受賞なしの単独で2度ノーベル賞を受賞した史上唯一の人物です。"],
  [14,"Which American chemist at the University of Chicago won the 1960 Nobel Prize in Chemistry for developing 'Radiocarbon Dating' (Carbon-14 dating) used in archaeology?",["Gilbert Lewis","Willard Libby (ウィラード・リビー)","Melvin Calvin","Paul Flory"],1,"考古学や地質学で遺跡・化石の年代を特定する「放射性炭素年代測定法（炭素14法）」を開発したのはアメリカの化学者ウィラード・リビーです。"],
  [14,"Which American nuclear chemist at UC Berkeley co-discovered 10 transuranium elements (including Plutonium and Americium) and has Element 106 named after him?",["Ernest Lawrence","Glenn T. Seaborg (グレン・シーボーグ)","Edwin McMillan","Harold Urey"],1,"カリフォルニア大学バークレー校のグレン・シーボーグはプルトニウムやアメリシウムなど10個の超ウラン元素を発見し、106番元素シーボーギウム（Sg）に名を残しています。"],
  [14,"Which two chemical elements on the Periodic Table are named directly after the United States/Americas and the state of California?",["Columbium and Virginium","Americium (Am, 95) and Californium (Cf, 98)","Texium and Floridium","Washingtonium and Yorkium"],1,"周期表の元素のうち、95番元素「アメリシウム（Americium）」と98番元素「カリホルニウム（Californium）」（さらに97番バークリウム、117番テネシン）はアメリカにちなんで命名されています。"],
  [14,"Which Element 117 on the Periodic Table was officially named in 2016 in honor of the U.S. state home to Oak Ridge National Laboratory and Vanderbilt University?",["Californium","Tennessine (Ts / テネシン)","Americium","Livermorium"],1,"2016年に正式命名された117番元素「テネシン（Tennessine：Ts）」は、オークリッジ国立研究所などがあるテネシー州にちなんで名付けられました。"],
  [14,"Which American physicist built the first working 'Laser' in 1960 at Hughes Research Laboratories in California, following theoretical work by Charles Townes?",["Gordon Gould","Theodore Maiman (セドドア・メイマン)","Arthur Schawlow","Nicolaas Bloembergen"],1,"チャールズ・タウンズらのメーザー・レーザー理論に基づき、1960年にカリフォルニアで世界初のルビー・レーザー発振に成功したのはセオドア・メイマンです。"],
  [14,"Which American scientist won the 2019 Nobel Prize in Chemistry at age 97 (alongside Stanley Whittingham and Akira Yoshino) for developing the Lithium-ion battery?",["Richard Smalley","John B. Goodenough (ジョン・グッドイナフ)","Alan Heeger","George Olah"],1,"テキサス大学教授のジョン・グッドイナフは、スマートフォンやEVに不可欠なリチウムイオン電池の正極材料を開発し、2019年に吉野彰氏らと共に史上最高齢（97歳）でノーベル化学賞を受賞しました。"],
  [14,"Which U.S. scientific project (with twin detectors in Hanford, Washington and Livingston, Louisiana) made the historic first direct detection of 'Gravitational Waves' in September 2015?",["CERN","LIGO (Laser Interferometer Gravitational-Wave Observatory)","Fermilab","SETI"],1,"アインシュタインが100年前に予言した「重力波（Gravitational Waves）」を2015年に世界で初めて直接観測したのは、ワシントン州とルイジアナ州にあるアメリカの重力波望遠鏡「LIGO（ライゴ）」です（2017年ノーベル物理学賞）。"],
  [14,"Which chemist at DuPont accidentally discovered 'Teflon' (PTFE, used in non-stick frying pans) in 1938?",["Wallace Carothers","Roy J. Plunkett (ロイ・プランケット)","Leo Baekeland","Charles Goodyear"],1,"フライパンの焦げ付き防止コーティングなどで知られるフッ素樹脂「テフロン（Teflon）」は、1938年にデュポン社の化学者ロイ・プランケットによって偶然発見されました。"],
  [14,"Which American agronomist, known as the 'Father of the Green Revolution,' won the 1970 Nobel Peace Prize for developing high-yielding, disease-resistant wheat varieties that saved hundreds of millions from famine?",["George Washington Carver","Norman Borlaug (ノーマン・ボーローグ)","Luther Burbank","Rachel Carson"],1,"アイオワ州出身の農学者ノーマン・ボーローグは、高収量の短稈コムギ品種を開発して「緑の革命（Green Revolution）」を主導し、1970年にノーベル平和賞を受賞しました。"],
  [14,"What is the name of the premier U.S. national Particle Physics and Accelerator Laboratory located near Chicago in Batavia, Illinois?",["Brookhaven Lab","Fermilab (フェルミ国立加速器研究所)","Sandia Lab","Argonne Lab"],1,"イリノイ州シカゴ郊外にあるアメリカの素粒子物理学の中心拠点は「フェルミ国立加速器研究所（Fermilab）」です。"],
  [14,"What is the name of the independent federal agency created by Congress in 1950 to fund fundamental scientific research and education across all non-medical fields of science and engineering?",["NIH","NSF (National Science Foundation / アメリカ国立科学財団)","DARPA","NOAA"],1,"アメリカの大学や研究機関における基礎科学・工学研究に助成金を交付する連邦独立機関は「国立科学財団（NSF）」です（医学分野はNIH）。"],
  [14,"Which prestigious, peer-reviewed weekly scientific journal has been published in the United States since 1880 by the American Association for the Advancement of Science (AAAS) (with initial financial backing from Thomas Edison)?",["Nature","Science (サイエンス)","The Lancet","Cell"],1,"イギリスの『Nature』と並び世界で最も権威ある総合学術雑誌であるアメリカの『Science（サイエンス）』は、1880年にエジソンらの出資で創刊され、米国科学振興協会（AAAS）が発行しています。"],
  [14,"Which six universities in the United States top the global rankings in total Nobel Prize affiliations?",["Harvard, UC Berkeley, University of Chicago, MIT, Columbia, and Stanford","Ohio State, Texas A&M, Penn State, Florida, Michigan, and UCLA","Georgetown, Duke, Vanderbilt, Rice, Emory, and Notre Dame","Rutgers, Indiana, Purdue, Iowa, Kansas, and Oregon"],0,"ハーバード大学、UCバークレー、シカゴ大学、MIT（マサチューセッツ工科大学）、コロンビア大学、スタンフォード大学は、それぞれ100名近いノーベル賞受賞者を輩出・擁する世界の学術研究の頂点です。"],
  [14,"Which American physicist at UC Berkeley invented the 'Cyclotron' (particle accelerator) in 1929, winning the 1939 Nobel Prize in Physics and having two national laboratories named after him?",["Robert Oppenheimer","Ernest O. Lawrence (アーネスト・ローレンス)","Luis Alvarez","Emilio Segrè"],1,"円形粒子加速器「サイクロトロン」を発明したアーネスト・ローレンスは1939年にノーベル物理学賞を受賞し、ローレンス・バークレー国立研究所や103番元素ローレンシウムに名を残しています。"],

  // 16. 科学④：IT・医学・バイオ・環境 (#376–#400)
  [15,"What was the name of the first programmable, electronic, general-purpose digital computer, unveiled at the University of Pennsylvania in February 1946 by John Mauchly and J. Presper Eckert?",["UNIVAC","ENIAC (エニアック)","IBM 701","Altair 8800"],1,"1946年にペンシルベニア大学でジョン・モークリーとプレスパー・エッカートが開発した真空管式の汎用電子計算機は「ENIAC（エニアック）」です。"],
  [15,"At which renowned industrial research laboratory in Murray Hill, New Jersey did John Bardeen, Walter Brattain, and William Shockley invent the 'Transistor' in 1947?",["Xerox PARC","Bell Labs (ベル研究所)","IBM Watson Center","Lincoln Lab"],1,"現代のあらゆる電子機器・コンピュータの基礎となった「トランジスタ」は1947年にニュージャージー州のAT&Tベル研究所（Bell Labs）で発明されました（UNIXやC言語も同研究所で誕生）。"],
  [15,"Which two American engineers independently invented the 'Integrated Circuit' (IC / Microchip) in 1958–1959 at Texas Instruments and Fairchild Semiconductor?",["Steve Jobs and Steve Wozniak","Jack Kilby (Texas Instruments) and Robert Noyce (Fairchild / Intel)","Bill Gates and Paul Allen","Vint Cerf and Bob Kahn"],1,"半導体チップ上に複数の素子を集積する「集積回路（IC）」は、1958〜59年にジャック・キルビー（2000年ノーベル物理学賞）とロバート・ノイス（Intel共同創業者）によって発明されました。"],
  [15,"Which co-founder of Intel formulated the famous 1965 observation ('___'s Law') that the number of transistors on a microchip doubles roughly every two years?",["Andy Grove","Gordon Moore (ゴードン・ムーア / ムーアの法則)","Robert Noyce","Jensen Huang"],1,"「半導体の集積密度は約1.5〜2年ごとに2倍になる」という半導体産業の成長経験則は、インテル共同創業者ゴードン・ムーアが1965年に提唱した「ムーアの法則（Moore's Law）」です。"],
  [15,"What was the name of the 1969 packet-switching network funded by the U.S. Department of Defense (ARPA) that connected UCLA and Stanford, becoming the direct precursor to the modern Internet?",["Ethernet","ARPANET (アーパネット)","World Wide Web","Intranet"],1,"1969年に米国防総省の高等研究計画局（ARPA、現DARPA）がカリフォルニア大学ロサンゼルス校（UCLA）とスタンフォード研究所などを結んで構築したインターネットの原型は「ARPANET」です。"],
