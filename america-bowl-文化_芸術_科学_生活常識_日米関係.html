  [15,"Which two American computer scientists designed the 'TCP/IP' communication protocols in the 1970s and are widely recognized as the 'Fathers of the Internet'?",["Larry Page and Sergey Brin","Vint Cerf and Bob Kahn (ヴィント・サーフとボブ・カーン)","Marc Andreessen and Eric Bina","Dennis Ritchie and Ken Thompson"],1,"インターネットの根幹である通信プロトコル「TCP/IP」を開発し「インターネットの父」と称されるアメリカの科学者は、ヴィント・サーフとボブ・カーンです。"],
  [15,"Which American engineer at Stanford Research Institute (SRI) invented the 'Computer Mouse' and demonstrated hypertext and video conferencing in his famous 1968 'Mother of All Demos'?",["Alan Kay","Douglas Engelbart (ダグラス・エンゲルバート)","Ivan Sutherland","Ray Tomlinson"],1,"コンピュータの「マウス」を発明し、1968年にサンフランシスコでウィンドウ画面・ハイパーテキスト・ビデオ会議を実演したのはダグラス・エンゲルバートです。"],
  [15,"Which satellite-based radionavigation system, originally developed by the U.S. Department of Defense in the 1970s and opened for civilian use globally, is used in smartphones and car navigation?",["GLONASS","GPS (Global Positioning System)","Galileo","Radar"],1,"米国防総省が開発し米宇宙軍が運用する全地球測位システムは「GPS（Global Positioning System）」です。"],
  [15,"Which U.S. Navy Rear Admiral and computer pioneer developed the first compiler, helped create the COBOL programming language, and popularized the term 'computer bug'?",["Ada Lovelace","Grace Hopper (グレース・ホッパー)","Margaret Hamilton","Katherine Johnson"],1,"米海軍少将で計算機科学者のグレース・ホッパーは、コンパイラや事務処理言語COBOLの開発を主導し、リレーに挟まった蛾から「バグ（Bug）」「デバッグ」の言葉を広めました。"],
  [15,"At which hospital in Boston, Massachusetts did dentist William T. G. Morton perform the first successful public demonstration of ether surgical anesthesia in October 1846?",["Johns Hopkins Hospital","Massachusetts General Hospital (マサチューセッツ総合病院)","Mayo Clinic","Mount Sinai Hospital"],1,"1846年10月にボストンのマサチューセッツ総合病院（MGH）でウィリアム・モートンがエーテルによる全身麻酔手術の公開実験に成功し、近代外科医学の扉を開きました。"],
  [15,"Which American medical researcher developed the first safe and effective inactivated Polio Vaccine in 1955 and famously refused to patent it ('Could you patent the sun?')?",["Albert Sabin","Jonas Salk (ジョナス・ソーク)","Anthony Fauci","Maurice Hilleman"],1,"ジョナス・ソークは1955年に不活化ポリオワクチンを開発して世界中の子どもたちを小児麻痺から救い、「太陽に特許はあるかね？」と述べて特許を取得せず無償公開しました。"],
  [15,"Which American biologist co-discovered the double-helix structure of DNA in 1953 alongside British scientist Francis Crick, winning the 1962 Nobel Prize in Physiology or Medicine?",["Craig Venter","James D. Watson (ジェームズ・ワトソン)","Francis Collins","Har Gobind Khorana"],1,"アメリカの生物学者ジェームズ・ワトソンは、1953年にフランシス・クリックと共にDNAの二重らせん構造を解明し、モーリス・ウィルキンスと共に1962年ノーベル生理学・医学賞を受賞しました。"],
  [15,"Which American biochemist won the 1993 Nobel Prize in Chemistry for inventing the 'Polymerase Chain Reaction' (PCR) method used to amplify DNA sequences?",["Arthur Kornberg","Kary Mullis (キャリー・マリス)","Paul Berg","Walter Gilbert"],1,"微量のDNAを短時間で大量に増幅する「PCR法（ポリメラーゼ連鎖反応）」を1983年に考案したのは、アメリカの生化学者キャリー・マリスです。"],
  [15,"Which international scientific research effort, led by the U.S. National Institutes of Health (NIH) from 1990 to 2003, successfully mapped and sequenced all human genes?",["Manhattan Project","Human Genome Project (ヒトゲノム計画)","BRAIN Initiative","ENCODE Project"],1,"1990年にアメリカ（NIHおよびエネルギー省）が主導して開始し、2003年にヒトの全DNA塩基配列の解読を完了させた国際プロジェクトは「ヒトゲノム計画（Human Genome Project）」です。"],
  [15,"Which American biochemist at UC Berkeley won the 2020 Nobel Prize in Chemistry (with Emmanuelle Charpentier) for developing the 'CRISPR-Cas9' genome-editing technology?",["Carolyn Bertozzi","Jennifer Doudna (ジェニファー・ダウドナ)","Frances Arnold","Barbara McClintock"],1,"DNAを自在に書き換える革新的なゲノム編集技術「CRISPR-Cas9（クリスパー・キャスナイン）」を開発し、2020年ノーベル化学賞を受賞したUCバークレー教授はジェニファー・ダウドナです。"],
  [15,"Which two scientists at the University of Pennsylvania won the 2023 Nobel Prize in Physiology or Medicine for their nucleoside base modification discoveries that enabled mRNA COVID-19 vaccines?",["James Allison and Tasuku Honjo","Katalin Karikó and Drew Weissman (カタリン・カリコとドリュー・ワイスマン)","Harvey Alter and Charles Rice","David Julius and Ardem Patapoutian"],1,"ペンシルベニア大学でmRNAの炎症反応を抑える修飾技術を発見し、新型コロナmRNAワクチンの実用化を可能にして2023年ノーベル生理学・医学賞を受賞したのはカタリン・カリコとドリュー・ワイスマンです。"],
  [15,"Where in Georgia is the headquarters of the U.S. 'CDC' (Centers for Disease Control and Prevention), the federal agency protecting public health against infectious diseases?",["Washington, D.C.","Atlanta, Georgia","Bethesda, Maryland","Boston, Massachusetts"],1,"感染症対策や公衆衛生を担うアメリカの「疾病予防管理センター（CDC）」の本部は、ジョージア州アトランタにあります。"],
  [15,"Where in Maryland (just north of Washington, D.C.) is the headquarters of the 'NIH' (National Institutes of Health), the world's largest public biomedical research agency?",["Baltimore","Bethesda, Maryland","Annapolis","Arlington"],1,"27の研究所・センターを擁する世界最大の医学・生命科学研究機関「アメリカ国立衛生研究所（NIH）」の本部は、メリーランド州ベセスダにあります。"],
  [15,"Which federal agency within the Department of Health and Human Services regulates the safety of food, prescription drugs, vaccines, medical devices, and cosmetics in the U.S.?",["USDA","FDA (Food and Drug Administration / アメリカ食品医薬品局)","EPA","CDC"],1,"食品や医薬品・ワクチン・医療機器・化粧品の承認と安全規制を管轄する連邦機関は「アメリカ食品医薬品局（FDA）」です。"],
  [15,"Which American marine biologist published the landmark 1962 book 'Silent Spring' (沈黙の春), warning of the dangers of synthetic pesticides like DDT and sparking the modern environmental movement?",["Jane Goodall","Rachel Carson (レイチェル・カーソン)","Sylvia Earle","Marjory Stoneman Douglas"],1,"海洋生物学者レイチェル・カーソンが1962年に発表した『沈黙の春（Silent Spring）』は、DDTなどの化学農薬による生態系破壊を告発し、環境保護運動の原点となりました。"],
  [15,"In what year was the first 'Earth Day' celebrated across the United States (on April 22), and which federal environmental agency was established later that same year under President Nixon?",["1962 / National Park Service","1970 / EPA (Environmental Protection Agency / 環境保護庁)","1980 / NOAA","1992 / FEMA"],1,"1970年4月22日にアメリカで第1回「アースデイ（地球の日）」が開催され、同年12月にニクソン政権下で「環境保護庁（EPA）」が設立されました。"],
  [15,"Which major transform fault line runs approximately 1,200 km through California, marking the boundary between the Pacific Plate and the North American Plate and causing major earthquakes (such as the 1906 San Francisco earthquake)?",["New Madrid Fault","San Andreas Fault (サンアンドレアス断層)","Cascadia Fault","Hayward Fault"],1,"カリフォルニア州を縦断する太平洋プレートと北米プレートの境界の横ずれ断層は「サンアンドレアス断層（San Andreas Fault）」で、1906年サンフランシスコ地震などを引き起こしました。"],
  [15,"What is the name of the meteorological scale (rated from EF0 to EF5) developed at the University of Chicago by Japanese-American meteorologist Tetsuya Theodore Fujita to measure tornado intensity?",["Saffir-Simpson Scale","Fujita Scale / Enhanced Fujita Scale (藤田スケール / EFスケール)","Richter Scale","Beaufort Scale"],1,"シカゴ大学教授だった気象学者・藤田哲也博士が1971年に考案した竜巻（トルネード）の強さを被害状況から分類する尺度は「藤田スケール（Fスケール、現在は改良藤田スケール：EF0〜EF5）」です（ハリケーンはサファ・シンプソン・スケール）。"],
  [15,"Which two American seismologists at Caltech developed the famous 1935 logarithmic scale used to measure the magnitude of earthquakes?",["Harry Hess and Alfred Wegener","Charles Richter and Beno Gutenberg (チャールズ・リヒターとベノー・グーテンベルク)","Fujita and Saffir","Mercalli and Omori"],1,"カリフォルニア工科大学の地震学者チャールズ・リヒター（およびベノー・グーテンベルク）は1935年に地震の規模（マグニチュード）を表す「リヒター・スケール」を考案しました。"],
  [15,"What is the name of the federal scientific agency within the Department of Commerce that monitors the oceans, major waterways, atmosphere, and national weather warnings (NWS)?",["USGS","NOAA (National Oceanic and Atmospheric Administration / アメリカ海洋大気庁)","EPA","FEMA"],1,"ハリケーンや竜巻などの気象警報（NWS）、海洋調査、気候変動観測を担う商務省傘下の科学機関は「アメリカ海洋大気庁（NOAA：ノア）」です。"],

  // ==================== PART 3: 日米関係 (100問: #401–#500) ====================
  // 17. 日米①：幕末の開国と遣米使節 (#401–#412)
  [16,"Which young Japanese fisherman from Tosa was rescued in 1841 by the American whaling ship 'John Howland' (Captain Whitfield) and became the first Japanese to live and study in the U.S.?",["Hikozo Hamada (Joseph Heco)","John Manjiro (Nakahama Manjiro)","Ranald MacDonald","Sakamoto Ryoma"],1,"1841年に遭難しアメリカの捕鯨船ジョン・ハウランド号（ホイットフィールド船長）に救助されたジョン万次郎（中浜万次郎）は、マサチューセッツ州フェアヘイブンで学び、帰国後に幕府の通訳として貢献しました。"],
  [16,"In what year did U.S. Navy Commodore Matthew C. Perry first arrive at Uraga (at the entrance to Edo Bay) with four 'Black Ships'?",["1848","1853","1858","1860"],1,"アメリカ東インド艦隊司令長官マシュー・ペリー代将が4隻の黒船（旗艦サスケハナ号など）を率いて浦賀に来航したのは1853年（嘉永6年）です。"],
  [16,"Which 13th U.S. President sent the official letter carried by Commodore Matthew Perry requesting the Tokugawa Shogunate to open Japan's ports?",["James K. Polk","Millard Fillmore","Franklin Pierce","James Buchanan"],1,"ペリーが幕府に提出した開国を求める親書を送ったのは、第13代ミラード・フィルモア大統領です。"],
  [16,"Which treaty signed in March 1854 between Commodore Perry and the Tokugawa Shogunate ended Japan's national seclusion and opened the ports of Shimoda and Hakodate?",["Treaty of Amity and Commerce","Convention of Kanagawa (U.S.-Japan Treaty of Peace and Amity / 日米和親条約)","Treaty of Portsmouth","Treaty of San Francisco"],1,"1854年3月に横浜で締結された「日米和親条約（神奈川条約 / Convention of Kanagawa）」により、下田と箱館（函館）の2港が開港されました。"],
  [16,"Who arrived in Shimoda in 1856 as the first United States Consul General to Japan, setting up the first American consulate at Gyokusen-ji Temple?",["Matthew Perry","Townsend Harris (タウンゼント・ハリス)","Henry Heusken","Rutherford Alcock"],1,"1856年に初代駐日アメリカ総領事として下田に着任し、玉泉寺に総領事館を開設したのはタウンゼント・ハリスです。"],
  [16,"Which treaty signed in July 1858 aboard the USS Powhatan established commercial trade between the U.S. and Japan and opened Kanagawa (Yokohama), Nagasaki, Niigata, Hyogo (Kobe), and Hakodate?",["Convention of Kanagawa","Treaty of Amity and Commerce (Harris Treaty / 日米修好通商条約)","Treaty of Ghent","Burlington Treaty"],1,"1858年7月に大老・井伊直弼の下でハリスと締結された「日米修好通商条約（ハリス条約）」により、横浜・長崎・新潟・神戸・函館の5港での自由貿易が始まりました。"],
  [16,"In what year did the Tokugawa Shogunate dispatch its first official diplomatic mission to the United States (the Man'en Gannen Embassy) to exchange ratifications of the Harris Treaty?",["1854","1860","1867","1871"],1,"日米修好通商条約の批准書交換のため、幕府が初の公式外交使節団「万延元年遣米使節」をワシントンD.C.へ派遣したのは1860年です。"],
  [16,"Who served as the Chief Ambassador (正使) of the 1860 Japanese Embassy to the United States, accompanied by Vice Ambassador Muragaki Norimasa and censor Oguri Tadamasa?",["Iwase Tadanari","Shinmi Masaoki (新見正興)","Katsu Kaishu","Iwakura Tomomi"],1,"1860年の万延元年遣米使節の正使は外国奉行の新見正興（しんみまさおき）、副使は村垣範正、目付（監察）は小栗忠順が務め、米軍艦ポーハタン号で太平洋を渡りました。"],
  [16,"Which Japanese screw-driven warship, captained by Katsu Kaishu with Fukuzawa Yukichi and John Manjiro aboard, escorted the 1860 mission across the Pacific to San Francisco?",["Kaiyo Maru","Kanrin Maru (咸臨丸)","Mikasa","Chogei Maru"],1,"勝海舟が艦長を務め、福沢諭吉やジョン万次郎らが乗船して1860年にサンフランシスコへの太平洋横断に成功した幕府の蒸気軍艦は「咸臨丸（Kanrin Maru）」です。"],
  [16,"Which 15th U.S. President warmly received the 1860 Japanese diplomatic mission in the East Room of the White House in Washington, D.C.?",["Millard Fillmore","James Buchanan","Abraham Lincoln","Ulysses S. Grant"],1,"1860年5月、ワシントンD.C.のホワイトハウスで万延元年遣米使節を歓迎し批准書を交換した大統領は、南北戦争直前の第15代ジェームズ・ブキャナン大統領です。"],
  [16,"In which American city did the 1860 Japanese Embassy receive a massive ticker-tape-style parade up Broadway, inspiring Walt Whitman to write the poem 'A Broadway Pageant'?",["San Francisco","New York City","Boston","Philadelphia"],1,"1860年6月に遣米使節がニューヨーク市を訪れた際、ブロードウェイで大歓迎パレードが行われ、詩人ウォルト・ホイットマンは記念詩『ブロードウェイのページェント』を詠みました。"],
  [16,"Which young samurai left Hakodate secretly in 1864 to study at Phillips Academy and Amherst College in Massachusetts, becoming the first Japanese to earn a college degree in the West and later founding Doshisha in Kyoto?",["Mori Arinori","Joseph Hardy Neesima (Niijima Jo / 新島襄)","Uchimura Kanzo","Nitobe Inazo"],1,"1864年に函館から渡米してマサチューセッツ州のアマースト大学で日本人初の学士号を取得し、帰国後に京都で同志社英学校（現・同志社大学）を創立したのは新島襄（ジョセフ・ハーディ・新島）です。"],

  // 18. 日米②：明治・大正とポーツマス条約 (#413–#425)
  [17,"Who led the Meiji government's grand diplomatic mission (1871–1873)—including Kido Takayoshi, Okubo Toshimichi, and Ito Hirobumi—which visited the United States for over seven months before touring Europe?",["Saigo Takamori","Iwakura Tomomi (Iwakura Mission / 岩倉使節団)","Okuma Shigenobu","Yamagata Aritomo"],1,"1871年（明治4年）から1873年にかけて欧米諸国を歴訪した明治政府の使節団は、右大臣・岩倉具視を特命全権大使とする「岩倉使節団（Iwakura Mission）」です。"],
  [17,"Who was the youngest of the five female students (at age 6) sent to the U.S. with the 1871 Iwakura Mission, who later studied biology at Bryn Mawr College, founded Tsuda University, and appears on the new 5,000-yen note?",["Oyama Sutematsu","Tsuda Umeko (津田梅子)","Ueda Teiko","Higuchi Ichiyo"],1,"1871年に満6歳で岩倉使節団に同行してアメリカへ留学し、のちブリンマー大学で学び女子英学塾（現・津田塾大学）を創設したのは津田梅子（2024年発行の新5,000円札の肖像）です。"],
  [17,"Which 18th U.S. President met the Iwakura Mission at the White House in 1872 and later visited Meiji Japan for two months in 1879 as a former President, meeting Emperor Meiji in Tokyo?",["Andrew Johnson","Ulysses S. Grant (ユリシーズ・グラント)","Rutherford B. Hayes","Theodore Roosevelt"],1,"第18代ユリシーズ・S・グラント大統領は1872年に岩倉使節団を歓迎し、退任後の1879年に世界一周の途上で来日して明治天皇と会見しました。"],
  [17,"Which American educator from Massachusetts served as the first vice-principal of Sapporo Agricultural College (now Hokkaido University) in 1876–1877, leaving the famous parting words 'Boys, be ambitious!'?",["Edward S. Morse","William S. Clark (ウィリアム・スミス・クラーク)","David Murray","Lafcadio Hearn"],1,"マサチューセッツ農科大学学長から札幌農学校の初代教頭として招かれ、「少年よ、大志を抱け（Boys, be ambitious!）」の言葉を残したのはウィリアム・S・クラーク博士です。"],
  [17,"Which American zoologist from Maine discovered and excavated the 'Omori Shell Mounds' (大森貝塚) in Tokyo in 1877 while riding a train from Yokohama, introducing modern archaeology to Japan?",["Ernest Fenollosa","Edward S. Morse (エドワード・モース)","Townsend Harris","Charles Whitman"],1,"1877年に横浜から新橋へ向かう汽車の窓から大森貝塚を発見・発掘し、東京大学初代動物学教授として近代考古学・動物学を伝えたアメリカ人学者はエドワード・S・モースです。"],
  [17,"Which Harvard-educated American art historian came to Japan in 1878 and worked closely with his student Okakura Tenshin to preserve traditional Japanese art and establish the Tokyo Fine Arts School?",["Edward Morse","Ernest Fenollosa (アーネスト・フェノロサ)","Frank Lloyd Wright","William Sturgis Bigelow"],1,"ハーバード大学出身のアーネスト・フェノロサは、教え子の岡倉天心と共に廃仏毀釈の風潮のなかで日本美術の価値を再評価し、東京美術学校（現・東京藝術大学）設立に尽力しました。"],
  [17,"Which American medical missionary arrived in Kanagawa in 1859, founded what became Meiji Gakuin University, compiled the first Japanese-English dictionary, and created the standard romanization system for Japanese?",["Guido Verbeck","James Curtis Hepburn (ジェームス・カーティス・ヘボン)","Samuel Robbins Brown","Williams Channing"],1,"アメリカ長老派の医療宣教師ジェームス・カーティス・ヘボンは、日本初の和英辞典『和英語林集成』を編纂して「ヘボン式ローマ字」を考案し、明治学院の創設者となりました。"],
  [17,"Which American-educated Japanese scholar (a Johns Hopkins alumnus and Quaker married to an American from Philadelphia) wrote the bestselling 1900 book 'Bushido: The Soul of Japan' in English?",["Okakura Tenshin","Nitobe Inazo (新渡戸稲造)","Uchimura Kanzo","Takahashi Korekiyo"],1,"ジョンズ・ホプキンス大学に留学した新渡戸稲造は、1900年にカリフォルニアで英文著書『武士道（Bushido: The Soul of Japan）』を著し、セオドア・ルーズベルト大統領ら欧米知識人に広く読まれました。"],
  [17,"Which September 1905 peace treaty, mediated by U.S. President Theodore Roosevelt, officially ended the Russo-Japanese War?",["Treaty of Ghent","Treaty of Portsmouth (ポーツマス条約)","Treaty of Paris","Treaty of Versailles"],1,"第26代セオドア・ルーズベルト大統領の仲介により1905年9月に締結され、日露戦争を終結させた講和条約は「ポーツマス条約」です（ルーズベルトはこの功績で1906年に米国人初のノーベル平和賞を受賞）。"],
  [17,"In which New England state (and at the adjacent naval shipyard across the Piscataqua River in Kittery, Maine) was the 1905 Portsmouth Peace Conference held?",["Massachusetts","New Hampshire (Portsmouth)","Rhode Island","Connecticut"],1,"ポーツマス講和会議は、ニューハンプシャー州ポーツマス（および川向かいのメイン州キタリーにあるポーツマス海軍造船所）で開催されました。"],
  [17,"Who served as Japan's Foreign Minister and Chief Plenipotentiary negotiator opposite Russia's Sergei Witte at the 1905 Portsmouth Peace Conference?",["Ito Hirobumi","Komura Jutaro (小村寿太郎)","Katsura Taro","Mutsu Munemitsu"],1,"ハーバード大学法科大学院（Harvard Law School）に学んだ外務大臣・小村寿太郎が、1905年のポーツマス講和会議で日本側全権代表を務めました。"],
  [17,"Which Japanese bacteriologist moved to the U.S. in 1900 and became a world-renowned researcher on syphilis and yellow fever at the Rockefeller Institute for Medical Research in New York?",["Kitasato Shibasaburo","Hideyo Noguchi (野口英世)","Jokichi Takamine","Kikunae Ikeda"],1,"野口英世は1900年に渡米し、ペンシルベニア大学を経てニューヨークのロックフェラー医学研究所で梅毒スピロヘータや黄熱病の研究に生涯を捧げました。"],
  [17,"At which 1921–1922 international conference hosted by U.S. President Warren G. Harding in Washington, D.C. did the U.S., Britain, Japan, France, and Italy agree to naval disarmament (a 5:5:3 ratio in capital ships)?",["Geneva Naval Conference","Washington Naval Conference (ワシントン会議)","London Naval Conference","Bretton Woods Conference"],1,"1921〜1922年にハーディング大統領の提唱でワシントンD.C.で開催された「ワシントン会議」により、主力艦保有比率を米5：英5：日3とするワシントン海軍軍縮条約や四カ国条約・九カ国条約が結ばれました。"],

  // 19. 日米③：桜寄贈・日米協会・大会 (#426–#438)
  [18,"In what year did Japan (Mayor Yukio Ozaki of Tokyo) gift approximately 3,000 cherry blossom trees to Washington, D.C. as a symbol of peace and friendship between Japan and the United States?",["1905","1912","1917","1927"],1,"日米の平和と親善の象徴として、東京市の尾崎行雄市長からワシントンD.C.へ約3,000本の桜の苗木が贈られたのは1912年（明治45年）です。"],
  [18,"Around which famous reservoir along the Potomac River in Washington, D.C. were the 1912 Japanese cherry blossom trees planted?",["Reflecting Pool","Tidal Basin (タイダルベイスン)","Chesapeake Bay","Georgetown Reservoir"],1,"1912年に日本から寄贈された桜は、ワシントンD.C.のポトマック河畔にある「タイダルベイスン（Tidal Basin）」の周囲に植えられ、毎春の全米桜祭りの中心となっています。"],
  [18,"Which U.S. First Lady (wife of the 27th President) and which Japanese Ambassador's wife planted the first two cherry trees together on the northern bank of the Tidal Basin on March 27, 1912?",["Edith Roosevelt and Sutematsu Oyama","Helen Herron Taft and Viscountess Iwa Chinda (タフト大統領夫人と珍田捨巳駐米大使夫人)","Ellen Wilson and Umeko Tsuda","Grace Coolidge and Haruko Hatoyama"],1,"1912年3月27日、第27代ウィリアム・ハワード・タフト大統領のヘレン・タフト夫人と珍田捨巳駐米大使の伊倭子（いわこ）夫人が、タイダルベイスン北岸に最初の2本のソメイヨシノを植樹しました。"],
  [18,"Which prominent Japanese chemist living in New York (discoverer of adrenaline and Takadiastase) and which American writer/geographer (first female board member of National Geographic) initiated the 1912 cherry tree gift?",["Hideyo Noguchi and Rachel Carson","Jokichi Takamine and Eliza Ruhamah Scidmore (高峰譲吉とエリザ・シドモア)","Kitasato Shibasaburo and Clara Barton","Shinzo Takatsuji and Pearl S. Buck"],1,"ワシントンD.C.への桜寄贈は、紀行作家エリザ・シドモアの発案とニューヨーク在住の化学者・高峰譲吉博士の資金援助・奔走によって実現しました。"],
  [18,"Which American native flowering tree did the United States gift to Tokyo in 1915 as a token of gratitude for Japan's 1912 gift of cherry blossom trees?",["Magnolia","Flowering Dogwood (ハナミズキ)","Red Maple","Jacaranda"],1,"1912年の桜寄贈への返礼として、1915年にアメリカから日本（東京市）へ贈られた花木は「ハナミズキ（Flowering Dogwood / アメリカヤマボウシ）」です。"],
  [18,"In what year (Taisho 6) was the America-Japan Society (一般社団法人日米協会), Japan's oldest U.S.–Japan private exchange organization, founded?",["1905","1912","1917","1945"],2,"一般社団法人日米協会は、1917年（大正6年）に創立された日本で最も長い歴史と伝統を持つ日米民間交流団体です。"],
  [18,"Who served as the first President (初代会長) of the America-Japan Society when it was founded in 1917?",["Shigeru Yoshida","Kentaro Kaneko (金子堅太郎)","Eiichi Shibusawa","Inazo Nitobe"],1,"1917年に創立された日米協会の初代会長には、ハーバード大学に学び大日本帝国憲法の起草や日露戦争時の対米外交に尽力した政治家・金子堅太郎が就任しました。"],
  [18,"Which two prominent postwar Prime Ministers of Japan served among the past Presidents (歴代会長) of the America-Japan Society?",["Hayato Ikeda and Eisaku Sato","Shigeru Yoshida and Nobusuke Kishi (吉田茂・岸信介)","Kakuei Tanaka and Yasuhiro Nakasone","Takeo Fukuda and Masayoshi Ohira"],1,"日米協会の歴代会長には、戦後の講和を成し遂げた吉田茂（第4代会長）や日米安保改定を行った岸信介（第5代会長）など首相経験者や駐米大使経験者が就任しています。"],
  [18,"Who currently serves as the 9th President (第9代会長) of the America-Japan Society, having previously served as Japan's Ambassador to the United States (2008–2012)?",["Ryozo Kato","Ichiro Fujisaki (藤崎一郎)","Kenichiro Sasae","Shinsuke Sugiyama"],1,"日米協会の現在の第9代会長は、元駐米大使の藤崎一郎氏です。"],
  [18,"To commemorate which milestone in 2017 did the America-Japan Society plan the 'America Bowl' competition for Japanese high school students?",["The 50th anniversary of the return of Okinawa","The 100th anniversary of the founding of the America-Japan Society (日米協会創立100周年記念事業)","The 150th anniversary of the Meiji Restoration","The 200th anniversary of U.S. Independence"],1,"「アメリカボウル大会」は、2017年の一般社団法人日米協会創立100周年記念事業の一つとして企画され、第1回大会が2018年に開催されました。"],
  [18,"According to the official America Bowl guide, what does the word 'Bowl' mean in the name 'America Bowl'?",["A round dining dish","A game or competition/tournament (ゲームや大会)","A concert amphitheater","A geographic basin"],1,"アメリカボウルにおける「ボウル（Bowl）」とは、スーパーボウルやローズボウルなどと同様に「ゲームや大会」を意味します。"],
  [18,"In the preliminary round of the America Bowl, how many points is each of the 5 special 'Bonus Questions' worth, compared to 1 point for regular questions?",["2 points","3 points","5 points","10 points"],1,"アメリカボウル予選では通常問題は1問1点ですが、5問出題されるボーナス問題は1問につき「3点」が配点されます。"],
  [18,"What is the name of the cultural exchange event held between the preliminary and final rounds of the America Bowl, where high school students from across Japan interact in English?",["AMERICA QUIZ RELAY","TOMODACHI BINGO","SAKURA DEBATE","KAKEHASHI TRIVIA"],1,"予選と決勝戦の間には、全国の参加高校生が英語を通して交流するカルチャーイベント「TOMODACHI BINGO」が開催されます。"],

  // 20. 日米④：太平洋戦争と日系米国人 (#439–#450)
  [19,"On what date (Hawaii local time) did the Attack on Pearl Harbor take place on the island of Oahu, bringing the United States into World War II?",["November 11, 1941","December 7, 1941","December 8, 1941","June 6, 1942"],1,"真珠湾攻撃（Attack on Pearl Harbor）はハワイ現地時間の1941年12月7日朝（日本時間12月8日未明）に発生し、アメリカの第二次世界大戦参戦の契機となりました。"],
  [19,"Which U.S. President addressed Congress on December 8, 1941, declaring that December 7, 1941 was 'a date which will live in infamy' (屈辱の日)?",["Woodrow Wilson","Franklin D. Roosevelt","Harry S. Truman","Dwight D. Eisenhower"],1,"真珠湾攻撃の翌日である1941年12月8日、第32代フランクリン・D・ルーズベルト大統領が連邦議会で有名な「屈辱の日（Infamy Speech）」演説を行い、対日宣戦布告が可決されました。"],
  [19,"Which U.S. Navy battleship sunk during the 1941 Attack on Pearl Harbor now lies beneath a white memorial bridge in Honolulu visited by millions of people?",["USS Missouri","USS Arizona (戦艦アリゾナ / アリゾナ記念館)","USS Lexington","USS Enterprise"],1,"真珠湾攻撃で沈没した「戦艦アリゾナ（USS Arizona）」の船体の上には白亜の「USSアリゾナ記念館」が建てられ、犠牲者の追悼と日米和解の象徴となっています。"],
  [19,"Which Executive Order signed by President Franklin D. Roosevelt on February 19, 1942 led to the forced internment of approximately 120,000 Japanese Americans from the West Coast?",["Executive Order 8802","Executive Order 9066 (大統領令9066号)","Executive Order 9981","Executive Order 10925"],1,"1942年2月19日にフランクリン・D・ルーズベルト大統領が署名した「大統領令9066号（Executive Order 9066）」により、米国市民である二世を含む西海岸の日系人約12万人が内陸部の強制収容所へ送られました。"],
  [19,"Which war relocation center (internment camp) at the foot of the Sierra Nevada in California is the best-known of the ten camps where Japanese Americans were incarcerated during WWII?",["Tule Lake","Manzanar (マンザナー強制収容所)","Heart Mountain","Topaz"],1,"カリフォルニア州東部オーエンズバレーに設けられた「マンザナー強制収容所（Manzanar）」は1万人以上の日系人が収容され、現在は国定史跡として保存されています。"],
  [19,"Which U.S. Army unit composed of Nisei (second-generation Japanese American) soldiers became the most decorated unit for its size and length of service in U.S. military history, fighting under the motto 'Go for Broke!'?",["101st Airborne Division","442nd Regimental Combat Team (第442連隊戦闘団)","Tuskegee Airmen","1st Marine Division"],1,"日系二世の志願兵らで編成された「第442連隊戦闘団（および第100歩兵大隊）」は、ハワイのスローガン「Go for Broke!（当たって砕けろ）」を掲げて欧州戦線で戦い、米国軍事史上最多の勲章を受章しました。"],
  [19,"Which Nisei veteran of the 442nd Regimental Combat Team lost his right arm in Italy, received the Medal of Honor, and represented Hawaii in the U.S. Senate for 50 years (becoming President pro tempore)?",["Spark Matsunaga","Daniel K. Inouye (ダニエル・イノウエ)","Norman Mineta","George Ariyoshi"],1,"ハワイ出身のダニエル・イノウエ上院議員は、第442連隊戦闘団で右腕を失いながらも活躍して名誉勲章を受章し、ハワイ州選出の連邦上院議員・上院仮議長（大統領継承順位第3位）として日米関係に大きく貢献しました。"],
  [19,"Which June 1942 naval battle fought near an atoll northwest of Hawaii was the decisive turning point of the War in the Pacific?",["Battle of the Coral Sea","Battle of Midway (ミッドウェー海戦)","Battle of Leyte Gulf","Battle of Guadalcanal"],1,"真珠湾攻撃から半年後の1942年6月に行われた「ミッドウェー海戦」で米海軍が勝利し、太平洋戦争の主導権がアメリカ側へと移りました。"],
  [19,"Which fierce February–March 1945 Pacific battle is commemorated by the U.S. Marine Corps War Memorial in Arlington, Virginia (visited on the America Bowl trip), depicting six Marines raising the U.S. flag on Mount Suribachi?",["Battle of Saipan","Battle of Iwo Jima (硫黄島の戦い / 硫黄島記念碑)","Battle of Okinawa","Battle of Peleliu"],1,"1945年2〜3月の硫黄島の戦いで摺鉢山に星条旗を掲げる米海兵隊員の姿（ジョー・ローゼンタール撮影）は、ワシントンD.C.対岸のバージニア州アーリントンにある「合衆国海兵隊戦争記念碑（通称：硫黄島記念碑）」のモデルとなりました。"],
  [19,"What was the name of the B-29 Superfortress bomber that dropped the first atomic bomb ('Little Boy') on Hiroshima on August 6, 1945?",["Bockscar","Enola Gay (エノラ・ゲイ)","Spirit of St. Louis","Memphis Belle"],1,"1945年8月6日に広島へ原子爆弾（リトルボーイ）を投下したB-29爆撃機は「エノラ・ゲイ（Enola Gay）」（8月9日に長崎へファットマンを投下したのはボックスカー）です。"],
  [19,"Aboard which U.S. Navy battleship anchored in Tokyo Bay was the Japanese Instrument of Surrender formally signed on September 2, 1945, ending World War II?",["USS Arizona","USS Missouri (戦艦ミズーリ)","USS Enterprise","USS Saratoga"],1,"1945年9月2日、東京湾に停泊した米戦艦「ミズーリ号（USS Missouri）」の甲板上にて降伏文書調印式が行われ、第二次世界大戦が正式に終結しました（現在ミズーリ号はハワイ真珠湾で記念艦として保存されています）。"],
  [19,"Which U.S. President signed the Civil Liberties Act of 1988 (市民の自由法), issuing a formal apology and $20,000 in redress to each surviving Japanese American interned during World War II?",["Jimmy Carter","Ronald Reagan (ロナルド・レーガン)","George H. W. Bush","Bill Clinton"],1,"1988年8月、第40代ロナルド・レーガン大統領が「市民の自由法（Civil Liberties Act of 1988）」に署名し、大戦中の日系アメリカ人強制収容が人種的偏見と戦時ヒステリーによる誤りであったと公式に謝罪・補償しました。"],

  // 21. 日米⑤：戦後占領と平和条約・返還 (#451–#463)
  [20,"Which U.S. Army General served as the Supreme Commander for the Allied Powers (SCAP / GHQ) in Tokyo from 1945 to 1951, overseeing the postwar occupation and democratization of Japan?",["Dwight D. Eisenhower","Douglas MacArthur (ダグラス・マッカーサー)","Matthew Ridgway","Chester Nimitz"],1,"1945年8月に厚木飛行場へ降り立ち、連合国軍最高司令官（SCAP / GHQ）として1951年4月まで日本の占領統治・非軍事化・民主化改革を指揮したのはダグラス・マッカーサー元帥です。"],
  [20,"Which 22-year-old American-born woman, raised in Japan and educated at Tsuda College and Mills College, drafted the women's rights articles (Articles 14 and 24) of the postwar Japanese Constitution at GHQ in February 1946?",["Eleanor Roosevelt","Beate Sirota Gordon (ベアテ・シロタ・ゴードン)","Ruth Benedict","Helen Mears"],1,"ピアニストの父レオ・シロタと共に日本で育ったベアテ・シロタ・ゴードンは、1946年2月にGHQ民政局の憲法草案作成メンバーとして日本国憲法第14条（法の下の平等）と第24条（両性の平等）を起草しました。"],
  [20,"Which American cultural anthropologist wrote the famous 1946 study of Japanese culture, 'The Chrysanthemum and the Sword' (菊と刀), commissioned by the U.S. Office of War Information?",["Margaret Mead","Ruth Benedict (ルース・ベネディクト)","Pearl S. Buck","Helen Keller"],1,"アメリカの文化人類学者ルース・ベネディクトが戦時中の日本研究をもとに1946年に著した『菊と刀（The Chrysanthemum and the Sword）』は、欧米の日本理解と戦後占領政策に大きな影響を与えました。"],
  [20,"Which Detroit bank president came to Japan in 1949 as financial advisor to GHQ to curb postwar hyperinflation ('___ Line') and set the fixed exchange rate of 1 U.S. dollar = 360 yen?",["Carl Shoup","Joseph Dodge (ジョセフ・ドッジ / ドッジ・ライン)","William Draper","George Kennan"],1,"1949年にGHQ経済顧問として来日したデトロイト銀行頭取ジョセフ・ドッジは、超均衡予算によるインフレ収束策「ドッジ・ライン」を実施し、1ドル＝360円の単一為替レートを設定しました（翌年にはコロンビア大学のカール・シャウプ博士が税制勧告を実施）。"],
  [20,"In which American city and on what date was the Treaty of Peace with Japan signed by 49 nations, ending the Allied occupation and restoring Japan's sovereignty (effective April 28, 1952)?",["Washington, D.C. on August 15, 1950","San Francisco on September 8, 1951 (サンフランシスコ平和条約)","New York City on April 28, 1952","Seattle on October 19, 1951"],1,"1951年9月8日、カリフォルニア州サンフランシスコのオペラハウスにて49カ国が「サンフランシスコ平和条約」に調印し、翌1952年4月28日に発効して日本は主権を回復しました。"],
  [20,"Which Japanese Prime Minister led the Japanese delegation to California and signed both the Treaty of San Francisco and the original U.S.–Japan Security Treaty on September 8, 1951?",["Shigeru Yoshida (吉田茂)","Ichiro Hatoyama","Tanzan Ishibashi","Hayato Ikeda"],0,"1951年9月にサンフランシスコ平和条約および旧日米安全保障条約に日本側首席全権として署名したのは、吉田茂首相（のちに日米協会第4代会長）です。"],
  [20,"Which special envoy of President Truman (who later served as Secretary of State under President Eisenhower) was the chief American negotiator and architect of the 1951 Treaty of San Francisco?",["Dean Acheson","John Foster Dulles (ジョン・フォスター・ダレス)","George Marshall","Henry Kissinger"],1,"トルーマン大統領の特使として各国との交渉をまとめ、1951年のサンフランシスコ平和条約を起草・主導したのはジョン・フォスター・ダレス（のちアイゼンハワー政権の国務長官）です。"],
  [20,"In what year did Japan join the United Nations (headquartered in New York City) with the support of the United States after restoring diplomatic ties with the Soviet Union?",["1951","1956","1960","1964"],1,"日本は1956年（昭和31年）12月、第11回国連総会において全会一致で80番目の加盟国として国際連合（本部ニューヨーク）への加盟を果たしました。"],
  [20,"Which island group in the Pacific (south of Tokyo, including Chichijima and Iwo Jima) was returned to Japanese administration by the United States in June 1968?",["Amami Islands","Ogasawara Islands (Bonin Islands / 小笠原諸島)","Ryukyu Islands","Kuril Islands"],1,"奄美群島（1953年返還）に続き、1968年6月に佐藤栄作政権下でアメリカから日本へ返還されたのは父島・母島・硫黄島などを含む「小笠原諸島」です。"],
  [20,"On what date in 1972 did the United States officially return administrative rights over Okinawa to Japan, ending 27 years of postwar U.S. administration?",["January 1, 1972","April 28, 1972","May 15, 1972","September 29, 1972"],2,"沖縄の本土復帰（沖縄返還）は1972年（昭和47年）5月15日に実現し、沖縄県が復活しました。"],
  [20,"Which Japanese Prime Minister and which U.S. President agreed in their November 1969 joint communiqué to the return of Okinawa in 1972 under the 'nuclear-free, homeland-level' (核抜き・本土並み) formula?",["Hayato Ikeda and John F. Kennedy","Eisaku Sato and Richard Nixon (佐藤栄作とリチャード・ニクソン)","Kakuei Tanaka and Gerald Ford","Nobusuke Kishi and Dwight D. Eisenhower"],1,"1969年11月のワシントンでの日米首脳会談において、佐藤栄作首相とリチャード・ニクソン大統領が「1972年・核抜き・本土並み」での沖縄返還に合意しました（佐藤首相は1974年にノーベル平和賞を受賞）。"],
  [20,"Which Tokyo-born Harvard University professor of Japanese history was appointed by President John F. Kennedy as U.S. Ambassador to Japan (1961–1966), healing bilateral tensions after the 1960 Anpo protests?",["Mike Mansfield","Edwin O. Reischauer (エドウィン・ライシャワー)","Joseph Grew","George Kennan"],1,"東京生まれでハーバード大学教授の日本学者エドウィン・ライシャワーは、1961年にケネディ大統領から駐日アメリカ大使に任命され、「対等なパートナーシップ」を掲げて日米の相互理解を深めました。"],
  [20,"What is the name of the prestigious U.S. government educational exchange program, initiated in 1946 by a U.S. Senator from Arkansas and launched in Japan in 1952, which has supported over 9,000 Japanese and American scholars?",["Rhodes Scholarship","Fulbright Program (フルブライト・プログラム / 奨学金)","Marshall Scholarship","Peace Corps"],1,"アーカンソー州選出のJ・ウィリアム・フルブライト上院議員の提唱で創設され、1952年から日米間で始まった留学・研究交流制度は「フルブライト・プログラム（日米教育委員会）」です。"],

  // 22. 日米⑥：日米安全保障と首脳外交 (#464–#475)
  [21,"In what year was the current 'Treaty of Mutual Cooperation and Security between the United States and Japan' (現行の日米安全保障条約) signed in Washington, D.C.?",["1951","1955","1960","1970"],2,"1951年の旧安保条約を改定し、アメリカの日本防衛義務や事前協議制を明記した現行の「日米相互協力及び安全保障条約（新安保条約）」は1960年1月に署名・同年6月に発効しました。"],
  [21,"Which Japanese Prime Minister and which U.S. President signed the revised U.S.–Japan Security Treaty at the White House on January 19, 1960?",["Shigeru Yoshida and Harry S. Truman","Nobusuke Kishi and Dwight D. Eisenhower (岸信介とドワイト・D・アイゼンハワー)","Hayato Ikeda and John F. Kennedy","Eisaku Sato and Lyndon B. Johnson"],1,"1960年1月にワシントンD.C.で改定日米安全保障条約に調印したのは、日本の岸信介首相（のち日米協会第5代会長）とアメリカの第34代ドワイト・D・アイゼンハワー大統領です。"],
  [21,"Which two Articles of the 1960 U.S.–Japan Security Treaty are the core pillars—one obligating the U.S. to defend Japan against an armed attack, and the other granting the U.S. the use of bases in Japan for peace and security in the Far East?",["Article 1 and Article 2","Article 5 (defense of Japan) and Article 6 (Far East clause & bases)","Article 9 and Article 10","Article 3 and Article 8"],1,"現行の日米安保条約では、「第5条」で日本の施政下にある領域への武力攻撃に対する日米共同対処（米国の対日防衛義務）、「第6条」で極東の平和と安全のための在日米軍への施設・区域提供が定められています。"],
  [21,"What is the name of the bilateral agreement concluded under Article 6 of the 1960 U.S.–Japan Security Treaty that governs the legal status and operations of U.S. military facilities and personnel in Japan?",["Host Nation Support","U.S.–Japan Status of Forces Agreement (SOFA / 日米地位協定)","ACSA","GSOMIA"],1,"日米安保条約第6条に基づき、在日米軍の施設・区域の利用条件や米軍人・軍属の法的地位（裁判権など）を定めた協定は「日米地位協定（SOFA）」です。"],
  [21,"Which U.S. Navy numbered fleet has its forward-deployed headquarters and aircraft carrier home port in Yokosuka, Kanagawa Prefecture?",["U.S. Third Fleet","U.S. Fifth Fleet","U.S. Sixth Fleet","U.S. Seventh Fleet (アメリカ第7艦隊)"],3,"神奈川県横須賀市の米海軍横須賀基地を母港・司令部とし、西太平洋からインド洋を担当する世界最大規模の前方展開艦隊は「アメリカ第7艦隊（U.S. Seventh Fleet）」です。"],
  [21,"Which U.S. President became the very first sitting (incumbent) American President in history to visit Japan when he traveled to Tokyo and Kyoto in November 1974?",["Dwight D. Eisenhower","Richard Nixon","Gerald Ford (ジェラルド・フォード)","Jimmy Carter"],2,"現職のアメリカ合衆国大統領として史上初めて来日したのは、1974年11月に東京と京都を公式訪問した第38代ジェラルド・フォード大統領です。"],
  [21,"In what year did Emperor Showa and Empress Kojun make the historic first visit by a reigning Japanese Emperor to the United States, meeting President Ford at the White House and visiting Disneyland?",["1952","1964","1975","1989"],2,"フォード大統領訪日の翌年である1975年（昭和50年）9〜10月、昭和天皇と香淳皇后が歴代天皇として初めてアメリカを公式訪問し、ホワイトハウスやニューヨーク、アナハイムのディズニーランドなどを巡られました。"],
  [21,"Which former U.S. Senate Majority Leader served as the longest-serving U.S. Ambassador to Japan (1977–1988) under both Presidents Carter and Reagan, famously calling the U.S.–Japan relationship 'the most important bilateral relationship in the world, bar none'?",["Edwin Reischauer","Mike Mansfield (マイク・マンスフィールド)","Howard Baker","Tom Foley"],1,"民主党の上院院内総務からカーター・レーガン両政権で11年間にわたり駐日米大使を務めたマイク・マンスフィールドは、「日米関係は世界で最も重要な二国間関係（bar none）である」という言葉を広めました。"],
  [21,"Which Japanese Prime Minister and which U.S. President built a close personal bond in the 1980s to strengthen the Western alliance, famously calling each other 'Ron and Yasu'?",["Masayoshi Ohira and Jimmy Carter","Yasuhiro Nakasone and Ronald Reagan (中曽根康弘とロナルド・レーガン)","Noboru Takeshita and George H. W. Bush","Junichiro Koizumi and George W. Bush"],1,"1980年代に日米の安保・経済協力を推進し、ファーストネームで呼び合う親密な首脳関係を築いたのは中曽根康弘首相（Yasu）とロナルド・レーガン大統領（Ron）の「ロン・ヤス関係」です。"],
  [21,"Which daughter of President John F. Kennedy served as the first female U.S. Ambassador to Japan from 2013 to 2017 under President Barack Obama?",["Maria Shriver","Caroline Kennedy (キャロライン・ケネディ)","Kerry Kennedy","Susan Rice"],1,"第35代ジョン・F・ケネディ大統領の長女キャロライン・ケネディは、2013年から2017年まで女性初の駐日アメリカ大使を務め、オバマ大統領の広島訪問と安倍首相の真珠湾訪問を実現させました。"],
  [21,"Which U.S. President became the first sitting American President to visit the Hiroshima Peace Memorial Park in May 2016, followed by Prime Minister Shinzo Abe's visit to Pearl Harbor in December 2016?",["Bill Clinton","George W. Bush","Barack Obama (バラク・オバマ)","Joe Biden"],2,"2016年5月、伊勢志摩サミットの際に第44代バラク・オバマ大統領が現職の米大統領として初めて広島平和記念公園を訪問し、同年12月には安倍晋三首相がオバマ大統領と共にハワイの真珠湾（アリゾナ記念館）を訪問して和解のメッセージを発信しました。"],
  [21,"What is the name of the four-nation strategic framework ('The Quad') comprising the United States, Japan, Australia, and India that cooperates to advance a 'Free and Open Indo-Pacific' (FOIP)?",["AUKUS","The Quad (Quadrilateral Security Dialogue / 日米豪印戦略対話)","Five Eyes","APEC"],1,"「自由で開かれたインド太平洋（FOIP）」の実現に向けて日本・アメリカ・オーストラリア・インドの4カ国が連携する枠組みは「クアッド（Quad / 日米豪印戦略対話）」と呼ばれます。"],

  // 23. 日米⑦：経済摩擦と文化・スポーツ交流 (#476–#488)
  [22,"In the postwar U.S.–Japan trade friction (日米貿易摩擦) from the 1960s to the 1980s, which industries became major sources of dispute as Japanese exports to the U.S. surged?",["Textiles, Steel, Color TVs, Automobiles, and Semiconductors","Coal, Timber, Wheat, and Fur","Airlines, Railroads, and Pharmaceuticals","Tourism, Movies, and Music"],0,"1960年代から1980年代にかけての日米貿易摩擦では、繊維（日米繊維交渉）に始まり、鉄鋼、カラーテレビ、自動車（対米輸出自主規制・米国現地生産化）、半導体・農産物（牛肉・オレンジ）が次々と交渉テーマとなりました。"],
  [22,"At which New York City hotel on September 22, 1985 did the G5 nations (U.S., Japan, West Germany, U.K., and France) agree to intervene in currency markets to correct the overvalued U.S. dollar, causing a rapid appreciation of the yen (円高)?",["Waldorf Astoria","The Plaza Hotel (Plaza Accord / プラザ合意)","Ritz-Carlton","St. Regis"],1,"1985年9月22日にニューヨークのプラザホテルで開催されたG5（先進5カ国蔵相・中央銀行総裁会議）による「プラザ合意（Plaza Accord）」によってドル高是正の協調介入が行われ、1ドル＝約240円から急速な円高が進みました。"],
  [22,"Which American statistician taught Statistical Quality Control (SQC) to Japanese engineers and managers in 1950, inspiring the establishment of Japan's highest industrial quality award ('The ___ Prize')?",["Peter Drucker","W. Edwards Deming (エドワーズ・デミング / デミング賞)","Frederick Taylor","Michael Porter"],1,"アメリカの統計学者W・エドワーズ・デミング博士は1950年に来日して統計的品質管理を指導し、戦後日本の製造業の品質向上に大きく貢献したことから「デミング賞」が創設されました。"],
  [22,"Which two Japanese films made history at the 96th Academy Awards in Los Angeles in March 2024 by winning Best Animated Feature and Best Visual Effects, respectively?",["Spirited Away and Shin Godzilla","The Boy and the Heron (君たちはどう生きるか) and Godzilla Minus One (ゴジラ-1.0)","Your Name and Drive My Car","Demon Slayer and Seven Samurai"],1,"2024年3月の第96回アカデミー賞では、宮崎駿監督の『君たちはどう生きるか（The Boy and the Heron）』が長編アニメ映画賞、山崎貴監督の『ゴジラ-1.0（Godzilla Minus One）』が日本映画初の視覚効果賞を受賞しました。"],
  [22,"Which American historical drama series set in 1600 Japan, produced by and starring Hiroyuki Sanada on FX/Hulu, won an all-time record 18 Emmy Awards in September 2024?",["The Last Samurai","Shōgun (将軍)","Tokyo Vice","Pachinko"],1,"ジェームズ・クラヴェルの小説を原作とし、真田広之がプロデュース・主演を務めたハリウッド制作のドラマシリーズ『SHOGUN 将軍』は、2024年9月の第76回エミー賞で作品賞・主演男優賞・主演女優賞（アンナ・サワイ）など史上最多18部門を受賞しました。"],

  [23,"What is the name of the monumental fresco painted in 1865 by Constantino Brumidi on the canopy of the U.S. Capitol Rotunda, highlighted in the America Bowl trip reports?",["Washington Crossing the Delaware","The Apotheosis of Washington (ワシントンの神格化)","Signing of the Constitution","Birth of the Republic"],1,"短期米国訪問プログラムのレポートでも圧巻として紹介されている合衆国議会議事堂ロタンダ（大円蓋）の天井画は、初代大統領が13人の女神に囲まれ天上に昇る姿を描いた『ワシントンの神格化（Apotheosis of Washington）』です。"],
  [23,"Which historic 1773 church in Old Town Alexandria, Virginia—where George Washington held a family pew and which America Bowl participants have visited for Sunday service—is preserved as a national landmark?",["Washington National Cathedral","Christ Church in Alexandria (クライストチャーチ)","St. John's Episcopal Church","Old North Church"],1,"ワシントンD.C.対岸のバージニア州アレクサンドリア旧市街にある1773年創建の「クライストチャーチ（Christ Church）」は、ジョージ・ワシントンやロバート・E・リーが通った由緒ある教会で、訪問プログラムでも見学・礼拝参加が行われました。"],
  [23,"What is the name of George Washington's historic plantation estate on the banks of the Potomac River in Virginia, south of Alexandria, visited during the America Bowl program?",["Monticello","Mount Vernon (マウント・バーノン)","Montpelier","Arlington House"],1,"バージニア州のポトマック川沿いにある初代大統領ジョージ・ワシントンの邸宅・農園は「マウント・バーノン（Mount Vernon）」で、米国訪問プログラムの主要訪問先の一つです。"],
  [23,"Which U.S. executive department headquarters in Washington, D.C. (abbreviated 'DOS' in the America Bowl trip report) do students visit to learn about U.S. diplomacy and the Japan Desk?",["Department of the Treasury","U.S. Department of State (DOS / 米国務省)","Department of Commerce","Department of the Interior"],1,"ワシントンD.C.のフォギー・ボトム地区にある「米国務省（DOS: Department of State）」は、アメリカの外交政策の中枢であり、訪問プログラムでも見学・ブリーフィングが行われています。"],
  [23,"Which two major universities located in Washington, D.C. have been visited by America Bowl students on the study tour?",["Harvard University and MIT","Georgetown University and George Washington University (ジョージタウン大学とジョージ・ワシントン大学)","Johns Hopkins University and Duke University","Columbia University and NYU"],1,"ワシントンD.C.にある1789年創立の米国最古のカトリック系名門「ジョージタウン大学」と、ホワイトハウス近くにキャンパスを構える「ジョージ・ワシントン大学」は、訪問プログラムで高校生がキャンパス見学・交流を行う大学です。"],
  [23,"Which Smithsonian museums along the National Mall in Washington, D.C. are most frequently visited on the America Bowl tour to see the original Star-Spangled Banner flag, the Wright Flyer, and the Hope Diamond?",["Hirshhorn Museum and Portrait Gallery","National Museum of American History, National Air and Space Museum, and National Museum of Natural History (国立アメリカ歴史博物館・国立航空宇宙博物館・国立自然史博物館)","Freer Gallery and Renwick Gallery","Postal Museum and Anacostia Museum"],1,"ナショナル・モールに並ぶスミソニアン博物館群のなかでも、「国立アメリカ歴史博物館」「国立航空宇宙博物館」「国立自然史博物館」は、短期米国訪問プログラムで毎年のように訪れる定番の博物館です。"],
  [23,"What is the name of the Japanese Ministry of Foreign Affairs' youth exchange program ('___ Project') mentioned by America Bowl participants as supporting their homestays and school exchanges in the U.S.?",["JET Programme","KAKEHASHI Project (カケハシ・プロジェクト / 対日理解促進交流プログラム)","TOMODACHI Initiative","Tobitate! Study Abroad"],1,"外務省が推進する北米地域との対日理解促進交流プログラム「KAKEHASHI（カケハシ）プロジェクト」を通じて、現地高校での授業体験やホームステイなど日米の架け橋となる交流が行われています。"],
  [23,"How long is the spring-break Washington, D.C. Short-Term U.S. Visit Program awarded to the top three high school teams of the America Bowl?",["3 days","About 1 week (scheduled for March 17–24, 2027)","1 month","1 semester"],1,"アメリカボウル大会で上位3校に入賞したチームのメンバー（3名×3校）は、春季休暇中（第6回大会は2027年3月17日〜3月24日予定）の約1週間のワシントンD.C.短期米国訪問プログラムへ招待されます。"]
];

const QUIZ_DATA = RAW_DATA.map((row, idx) => ({
  id: idx + 1,
  catIdx: row[0],
  cat: CATS[row[0]],
  q: row[1],
  o: row[2],
  a: row[3],
  exp: row[4]
}));

let activePool = [];
let currentIndex = 0;
let userAnswers = {};
let wrongIds = new Set();
let isMockMode = false;
let autoSpeak = false;
let blindMode = false;

function getEnglishVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => v.lang === 'en-US' && v.name.includes('Natural'))
      || voices.find(v => v.lang === 'en-US')
      || voices.find(v => v.lang.startsWith('en'))
      || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => getEnglishVoice();
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

function speakCurrentQuestion(includeOptions = false) {
  if (!('speechSynthesis' in window) || !activePool[currentIndex]) return;
  stopSpeech();
  const q = activePool[currentIndex];
  let text = `Question ${currentIndex + 1}. ${q.q}`;
  if (includeOptions) {
    const labels = ['A', 'B', 'C', 'D'];
    const optsText = q.o.map((opt, i) => `Option ${labels[i]}: ${opt}.`).join(' ');
    text += ` ... ${optsText}`;
  }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  const voice = getEnglishVoice();
  if (voice) utter.voice = voice;
  utter.rate = parseFloat(document.getElementById('rateSelect').value) || 1.0;
  window.speechSynthesis.speak(utter);
}

function toggleAutoSpeak() {
  autoSpeak = !autoSpeak;
  const btn = document.getElementById('autoSpeakBtn');
  btn.textContent = `自動読み上げ: ${autoSpeak ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active-toggle', autoSpeak);
  if (autoSpeak) speakCurrentQuestion(false);
}

function toggleBlindMode() {
  blindMode = !blindMode;
  const btn = document.getElementById('blindModeBtn');
  btn.textContent = `🙈 リスニング専念: ${blindMode ? 'ON' : 'OFF'}`;
  btn.classList.toggle('active-toggle', blindMode);
  renderQuestion(false);
}

function initPool(list, mock = false) {
  stopSpeech();
  activePool = list.map((item, idx) => ({
    ...item,
    isBonus: mock && idx >= 40
  }));
  currentIndex = 0;
  userAnswers = {};
  isMockMode = mock;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  renderQuestion(true);
}

function startCategoryMode() {
  const val = document.getElementById('catSelect').value;
  let filtered = [];
  if (val === 'ALL') {
    filtered = [...QUIZ_DATA];
  } else if (val === 'GROUP_CULTURE') {
    filtered = QUIZ_DATA.filter(q => q.catIdx >= 0 && q.catIdx <= 7);
  } else if (val === 'GROUP_SCIENCE') {
    filtered = QUIZ_DATA.filter(q => q.catIdx >= 8 && q.catIdx <= 15);
  } else if (val === 'GROUP_USJP') {
    filtered = QUIZ_DATA.filter(q => q.catIdx >= 16 && q.catIdx <= 23);
  } else {
    const cIdx = parseInt(val, 10);
    filtered = QUIZ_DATA.filter(q => q.catIdx === cIdx);
  }
  initPool(filtered, false);
}

function startShuffleAll() {
  const shuffled = [...QUIZ_DATA].sort(() => Math.random() - 0.5);
  initPool(shuffled, false);
}

function startMockExam() {
  const shuffled = [...QUIZ_DATA].sort(() => Math.random() - 0.5).slice(0, 45);
  initPool(shuffled, true);
}

function startRetryWrong() {
  if (wrongIds.size === 0) return;
  const retryList = QUIZ_DATA.filter(q => wrongIds.has(q.id));
  initPool(retryList, false);
}

function jumpToQuestion() {
  const num = parseInt(document.getElementById('jumpInput').value, 10);
  if (isNaN(num) || num < 1 || num > activePool.length) return;
  currentIndex = num - 1;
  renderQuestion(true);
}

function calcScore() {
  let pts = 0, maxPts = 0;
  activePool.forEach((q, idx) => {
    const w = q.isBonus ? 3 : 1;
    maxPts += w;
    if (userAnswers[idx] === q.a) pts += w;
  });
  return { pts, maxPts };
}

function renderQuestion(triggerAudio = false) {
  const q = activePool[currentIndex];
  document.getElementById('qProgress').textContent = `Q ${currentIndex + 1} / ${activePool.length} (通し番号 #${q.id})`;
  document.getElementById('qCat').textContent = q.cat;
  document.getElementById('qBonus').style.display = q.isBonus ? 'inline-block' : 'none';
  const sc = calcScore();
  document.getElementById('scoreDisplay').textContent = `Score: ${sc.pts} / ${sc.maxPts}`;

  const answered = userAnswers[currentIndex] !== undefined;
  const qBox = document.getElementById('questionText');
  if (blindMode && !answered) {
    qBox.className = 'question-box blind';
    qBox.textContent = '🎧 リスニング専念モード中（上の「🔊 問題文を読み上げ」を押して音声を聞き、回答すると問題文が表示されます）';
  } else {
    qBox.className = 'question-box';
    qBox.textContent = q.q;
  }

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  ['A', 'B', 'C', 'D'].forEach((label, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = `(${label}) ${q.o[idx]}`;
    if (answered) {
      btn.disabled = true;
      if (idx === q.a) btn.classList.add('correct');
      else if (idx === userAnswers[currentIndex]) btn.classList.add('wrong');
    } else {
      btn.onclick = () => selectAnswer(idx);
    }
    container.appendChild(btn);
  });

  const fb = document.getElementById('feedbackBox');
  if (answered) {
    const isOk = userAnswers[currentIndex] === q.a;
    fb.style.display = 'block';
    fb.innerHTML = `<strong>${isOk ? '✅ Correct!' : '❌ Incorrect'}</strong> — 正解: (${['A','B','C','D'][q.a]}) ${q.o[q.a]}<br>${q.exp}`;
  } else {
    fb.style.display = 'none';
  }

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').textContent = currentIndex === activePool.length - 1 ? '結果を見る →' : '次の問題 →';
  document.getElementById('retryBtn').style.display = wrongIds.size > 0 ? 'inline-block' : 'none';

  if (triggerAudio && autoSpeak) {
    speakCurrentQuestion(false);
  }
}

function selectAnswer(choiceIdx) {
  const q = activePool[currentIndex];
  userAnswers[currentIndex] = choiceIdx;
  if (choiceIdx === q.a) wrongIds.delete(q.id);
  else wrongIds.add(q.id);
  renderQuestion(false);
}

function prevQuestion() {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion(true);
  }
}

function nextQuestion() {
  if (currentIndex < activePool.length - 1) {
    currentIndex++;
    renderQuestion(true);
  } else {
    stopSpeech();
    showResult();
  }
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  const sc = calcScore();
  const pct = Math.round((sc.pts / sc.maxPts) * 100);
  document.getElementById('finalScore').textContent = `${sc.pts} / ${sc.maxPts} pts (${pct}%)`;
  document.getElementById('finalComment').textContent = wrongIds.size > 0
    ? `現在、復習リストに ${wrongIds.size} 問の要注意問題があります。`
    : `素晴らしい成績です！すべての問題をクリアしました！`;
  document.getElementById('retryBtnEnd').style.display = wrongIds.size > 0 ? 'inline-block' : 'none';
}

startCategoryMode();
</script>
