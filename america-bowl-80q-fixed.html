<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>America Bowl Finals 1-on-1 & Listening Trainer</title>
<style>
  :root { --navy: #0f172a; --blue: #1d4ed8; --red: #b91c1c; --gold: #d97706; --bg: #f1f5f9; --correct: #15803d; --wrong: #b91c1c; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 16px; }
  .container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); padding: 24px; }
  h1 { margin: 0 0 6px; color: var(--navy); font-size: 1.45rem; text-align: center; }
  .subtitle { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 16px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #e2e8f0; }
  select, .btn { padding: 8px 13px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.88rem; cursor: pointer; background: #fff; font-weight: 600; color: #1e293b; }
  .btn.navy { background: var(--navy); color: #fff; border-color: var(--navy); }
  .btn.red { background: var(--red); color: #fff; border-color: var(--red); }
  .btn.gold { background: var(--gold); color: #fff; border-color: var(--gold); }
  .btn.active-mode { outline: 3px solid #93c5fd; }
  .audio-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; background: #eff6ff; border: 1px solid #bfdbfe; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
  .audio-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn-audio { background: var(--blue); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
  .status-bar { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-weight: 600; font-size: 0.92rem; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; background: #dbeafe; color: var(--blue); margin-left: 6px; }
  .clue-tag { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; background: #fef3c7; color: #92400e; margin-bottom: 6px; }
  .question-box { font-size: 1.18rem; font-weight: 600; line-height: 1.55; margin: 10px 0 18px; color: #0f172a; min-height: 44px; }
  .blind-mask { background: #e2e8f0; color: #475569; padding: 16px; border-radius: 10px; text-align: center; font-weight: 600; cursor: pointer; font-size: 0.98rem; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  @media (max-width: 560px) { .options { grid-template-columns: 1fr; } }
  .opt-btn { text-align: left; padding: 14px 16px; border-radius: 10px; border: 2px solid #e2e8f0; background: #fff; font-size: 1rem; cursor: pointer; transition: 0.15s; font-weight: 600; color: #1e293b; }
  .opt-btn:hover:not(:disabled) { border-color: var(--blue); background: #eff6ff; }
  .opt-btn.correct { border-color: var(--correct); background: #dcfce7; color: #14532d; font-weight: 700; }
  .opt-btn.wrong { border-color: var(--wrong); background: #fee2e2; color: #7f1d1d; }
  .short-answer-box { display: none; text-align: center; margin-bottom: 16px; padding: 16px; background: #f8fafc; border-radius: 10px; border: 1px dashed #94a3b8; }
  .feedback { display: none; padding: 14px 16px; border-radius: 10px; background: #f1f5f9; margin-bottom: 16px; line-height: 1.55; font-size: 0.95rem; border-left: 5px solid var(--navy); }
  .nav-bar { display: flex; justify-content: space-between; gap: 10px; }
  .nav-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 0.98rem; font-weight: 700; cursor: pointer; background: var(--navy); color: #fff; }
  .nav-btn:disabled { background: #cbd5e1; cursor: not-allowed; }
  .result-screen { display: none; text-align: center; padding: 20px 0; }
  .score-big { font-size: 2.3rem; font-weight: 800; color: var(--navy); margin: 12px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>🏆 America Bowl 決勝＆リスニング 1問1答システム</h1>
  <div class="subtitle">本番仕様：1問につき1つの答え（地理・歴史・日常常識・政治 各20問／全80問）</div>

  <div class="toolbar">
    <select id="catSelect" onchange="filterByCategory()">
      <option value="ALL">全4分野・1問1答 (80問)</option>
      <option value="地理・位置">① 地理：州・都市の位置とランキング (20問)</option>
      <option value="歴史・人物と年代">② 歴史：人物・紙幣・年号と出来事 (20問)</option>
      <option value="日常常識・単位と記念日">③ 日常常識：単位換算・略語・記念日 (20問)</option>
      <option value="政治・権利と判例">④ 政治：憲法修正・最高裁判例・分断問題 (20問)</option>
    </select>
    <button class="btn navy" onclick="shuffleQuestions()">🔀 シャッフル</button>
    <button class="btn gold" id="modeToggleBtn" onclick="toggleAnswerMode()">📝 現在：4択ボタンモード (短答へ切替)</button>
    <button class="btn red" id="retryWrongBtn" onclick="retryWrong()" style="display:none;">🔥 弱点復習 (0)</button>
  </div>

  <div class="audio-bar">
    <div class="audio-controls">
      <button class="btn-audio" onclick="speakCurrentQuestion()">🔊 英語で問題を聴く (Play)</button>
      <label style="font-size:0.85rem; font-weight:600; cursor:pointer;">
        <input type="checkbox" id="blindCheck" onchange="renderQuestion()"> 🎧 リスニング専念 (問題文を隠す)
      </label>
      <label style="font-size:0.85rem; font-weight:600; cursor:pointer;">
        <input type="checkbox" id="autoPlayCheck"> 自動読み上げ
      </label>
    </div>
    <div>
      <label style="font-size:0.82rem; font-weight:600;">速度:</label>
      <select id="rateSelect" style="padding:4px 8px; font-size:0.82rem;">
        <option value="0.85">0.85x (ゆっくり)</option>
        <option value="1.0" selected>1.0x (標準)</option>
        <option value="1.15">1.15x (速め)</option>
      </select>
    </div>
  </div>

  <div id="quizArea">
    <div class="status-bar">
      <div><span id="qProgress">Q 1 / 80</span> <span id="qCat" class="badge">地理・位置</span></div>
      <div id="scoreText">Score: 0 / 0</div>
    </div>

    <div id="clueBadge" class="clue-tag"></div>
    <div id="questionBox" class="question-box"></div>

    <div id="optionsContainer" class="options"></div>

    <div id="shortAnswerContainer" class="short-answer-box">
      <p style="margin:0 0 10px; font-weight:600; color:#475569;">【決勝・短答モード】答えを1つ思い浮かべてからボタンを押してください</p>
      <button class="btn navy" id="revealBtn" onclick="revealShortAnswer()">💡 正解と解説を表示する</button>
      <div id="selfJudgeBtns" style="display:none; margin-top:12px; gap:10px; justify-content:center;">
        <button class="btn" style="background:#15803d;color:#fff;" onclick="recordShortResult(true)">⭕ 正解できた</button>
        <button class="btn" style="background:#b91c1c;color:#fff;" onclick="recordShortResult(false)">❌ 間違えた</button>
      </div>
    </div>

    <div id="feedbackBox" class="feedback"></div>

    <div class="nav-bar">
      <button class="nav-btn" id="prevBtn" onclick="prevQ()">← 前の問題</button>
      <button class="nav-btn" id="nextBtn" onclick="nextQ()">次の問題 →</button>
    </div>
  </div>

  <div id="resultArea" class="result-screen">
    <h2>🏆 演習スコア結果</h2>
    <div id="finalScore" class="score-big"></div>
    <p id="finalMsg"></p>
    <button class="btn navy" onclick="filterByCategory()">もう一度最初から解く</button>
    <button class="btn red" id="retryEndBtn" onclick="retryWrong()">間違えた問題だけ復習する</button>
  </div>
</div>

<script>
const QUIZ_DATA = [
  // ① 地理・位置 (20問：すべて1問1答)
  {id:1, cat:"地理・位置", type:"面積ランキング1位", q:"Which U.S. state is the largest in land area, accounting for about 17% of the nation's territory?", o:["Texas","California","Alaska","Montana"], a:2, exp:"アラスカ州は国土面積の約17%を占める面積最大の州で、2位テキサス州の約2倍の広さがあります[cite: 1]。"},
  {id:2, cat:"地理・位置", type:"面積・人口ランキング2位", q:"Which U.S. state ranks second in both land area and population, and was once an independent republic?", o:["California","Texas","Florida","New York"], a:1, exp:"テキサス州はメキシコと接し、面積・人口ともに全米第2位の州です[cite: 1]。"},
  {id:3, cat:"地理・位置", type:"面積最小の州", q:"Which U.S. state has the smallest land area and was founded by Roger Williams on the principle of religious freedom?", o:["Delaware","Connecticut","Rhode Island","Hawaii"], a:2, exp:"ロードアイランド州は全米で最も面積が小さい州です[cite: 1]。"},
  {id:4, cat:"地理・位置", type:"人口ランキング1位", q:"Which U.S. state has the largest population and is home to both Silicon Valley and Hollywood?", o:["New York","Texas","Florida","California"], a:3, exp:"カリフォルニア州は全米で最も人口が多い州です[cite: 1]。"},
  {id:5, cat:"地理・位置", type:"人口最少の州", q:"Which U.S. state has the smallest population and contains most of Yellowstone National Park?", o:["Wyoming","Vermont","Alaska","Montana"], a:0, exp:"ワイオミング州はイエローストーン国立公園の大部分を含み、全米で最も人口が少ない州です[cite: 1]。"},
  {id:6, cat:"地理・位置", type:"人口密度ランキング1位", q:"Which U.S. state ranks first in population density?", o:["New York","New Jersey","Massachusetts","California"], a:1, exp:"ニュージャージー州は全米で最も人口密度が高い州です[cite: 1]。"},
  {id:7, cat:"地理・位置", type:"首都ワシントンD.C.の位置", q:"Washington, D.C. is located along the Potomac River between Virginia and which other state?", o:["Maryland","Pennsylvania","Delaware","New Jersey"], a:0, exp:"ワシントンD.C.はポトマック川沿いのメリーランド州とバージニア州の間に位置しています[cite: 1]。"},
  {id:8, cat:"地理・位置", type:"本土48州の最東端", q:"Which state is the easternmost in the contiguous 48 states and is famous for lobster production?", o:["Massachusetts","New Hampshire","Maine","Vermont"], a:2, exp:"メイン州は本土48州の中で最も東に位置し、ロブスターの生産で有名です[cite: 1]。"},
  {id:9, cat:"地理・位置", type:"本土48州の最西端", q:"Which state is the westernmost in the contiguous 48 states, with Olympia as its capital?", o:["Oregon","California","Washington","Idaho"], a:2, exp:"ワシントン州（州都オリンピア）は本土48州で最も西に位置する州です[cite: 1]。"},
  {id:10, cat:"地理・位置", type:"隣接する州が最も多い州", q:"Along with Missouri, which other state borders the highest number of neighboring U.S. states, touching eight states in total?", o:["Kentucky","Tennessee","Oklahoma","Illinois"], a:1, exp:"テネシー州とミズーリ州はそれぞれ8つの州と境界を接しており全米最多です[cite: 1]。"},
  {id:11, cat:"地理・位置", type:"アメリカ最古の州都", q:"What is the oldest state capital in the United States, located in the state of New Mexico?", o:["Santa Fe","Austin","Phoenix","Denver"], a:0, exp:"ニューメキシコ州のサンタフェ（Santa Fe）はアメリカで最古の州都です[cite: 1]。"},
  {id:12, cat:"地理・位置", type:"平均標高が最も高い州", q:"Which state has the highest average elevation in the United States and is nicknamed the 'Centennial State'?", o:["Utah","Montana","Wyoming","Colorado"], a:3, exp:"コロラド州は平均標高が約2,073mで全州中1位であり、独立100周年昇格にちなんでCentennial Stateと呼ばれます[cite: 1]。"},
  {id:13, cat:"地理・位置", type:"コロラド州の州都", q:"What is the capital of Colorado, nicknamed the 'Mile-High City'?", o:["Salt Lake City","Denver","Cheyenne","Boise"], a:1, exp:"コロラド州の州都デンバー（Denver）は標高約1マイルにあることから「Mile-High City」と呼ばれます[cite: 1]。"},
  {id:14, cat:"地理・位置", type:"最も乾燥している州", q:"Which state is the driest in the United States, recording only about 23 centimeters of annual precipitation?", o:["Arizona","New Mexico","Nevada","Utah"], a:2, exp:"ネバダ州はグレートベースン砂漠を含み、年間降水量が全米最少の最も乾燥している州です[cite: 1]。"},
  {id:15, cat:"地理・位置", type:"州の形状と歴史", q:"Which state, known for its panhandle, was the terminus of the 'Trail of Tears'?", o:["Texas","Oklahoma","Kansas","Nebraska"], a:1, exp:"オクラホマ州は「涙の道（Trail of Tears）」の終着地です[cite: 1]。同州のパンハンドルは1つで、パンハンドルが2つある唯一の州はウェストバージニア州です。"},
  {id:16, cat:"地理・位置", type:"湖が最も多い州・ミシシッピ川源流", q:"Which state is nicknamed the 'Land of 10,000 Lakes' and contains the source of the Mississippi River?", o:["Wisconsin","Michigan","Minnesota","Missouri"], a:2, exp:"ミネソタ州はミシシッピ川の源流があり、「1万の湖の地」と呼ばれます[cite: 1]。ただし、湖の数が最も多い州はアラスカ州で、5エーカー超の湖が約300万あります。ミネソタ州の11,842（10エーカー以上）とは数える基準が異なります。"},
  {id:17, cat:"地理・位置", type:"独立記念館がある都市", q:"In which city in Pennsylvania were both the Declaration of Independence and the U.S. Constitution signed at Independence Hall?", o:["Pittsburgh","Philadelphia","Boston","Baltimore"], a:1, exp:"ペンシルベニア州フィラデルフィアの独立記念館で独立宣言と憲法が採択・署名されました[cite: 1]。"},
  {id:18, cat:"地理・位置", type:"大西洋に面さない北東部の州", q:"Which Northeastern state does NOT border the Atlantic Ocean and is famous for producing maple syrup?", o:["Maine","New Hampshire","Vermont","Connecticut"], a:2, exp:"バーモント州は大西洋に面さない州で、メープルシロップの生産が盛んです[cite: 1]。"},
  {id:19, cat:"地理・位置", type:"最初の州（First State）", q:"Which state is nicknamed the 'First State' because it was the first to ratify the U.S. Constitution?", o:["Virginia","Massachusetts","Pennsylvania","Delaware"], a:3, exp:"デラウェア州はアメリカ最初の州として「First State」と呼ばれます[cite: 1]。"},
  {id:20, cat:"地理・位置", type:"ユタ州の州都", q:"What is the capital of Utah, known as the center of the Mormon Church?", o:["Salt Lake City","Las Vegas","Denver","Tucson"], a:0, exp:"ユタ州の州都はモルモン教の中心地として知られるソルトレイクシティです[cite: 1]。"},

  // ② 歴史・人物と年代 (20問：すべて1問1答)
  {id:21, cat:"歴史・人物と年代", type:"紙幣と人物（決勝過去問）", q:"Whose portrait is featured on the U.S. 1-dollar bill?", o:["Thomas Jefferson","George Washington","Abraham Lincoln","Benjamin Franklin"], a:1, exp:"アメリカの1ドル紙幣に描かれている人物は初代大統領ジョージ・ワシントンです[cite: 1]。"},
  {id:22, cat:"歴史・人物と年代", type:"紙幣と人物（決勝過去問）", q:"Whose portrait is featured on the U.S. 20-dollar bill?", o:["Andrew Jackson","Alexander Hamilton","Ulysses S. Grant","Thomas Jefferson"], a:0, exp:"アメリカの20ドル紙幣に描かれている人物は第7代大統領アンドリュー・ジャクソンです[cite: 1]。"},
  {id:23, cat:"歴史・人物と年代", type:"紙幣と人物（決勝過去問）", q:"Whose portrait is featured on the U.S. 100-dollar bill?", o:["George Washington","Abraham Lincoln","Alexander Hamilton","Benjamin Franklin"], a:3, exp:"アメリカの100ドル紙幣にはベンジャミン・フランクリンが描かれています[cite: 1]。"},
  {id:24, cat:"歴史・人物と年代", type:"人物特定（建国期）", q:"Who served as the first Secretary of the Treasury at the founding of the United States?", o:["Thomas Jefferson","James Madison","Alexander Hamilton","John Adams"], a:2, exp:"アメリカ建国時の初代財務長官はアレクサンダー・ハミルトンです[cite: 1]。"},
  {id:25, cat:"歴史・人物と年代", type:"人物特定（第3代大統領）", q:"Which 3rd U.S. President drafted the Declaration of Independence and doubled the nation's territory through the Louisiana Purchase?", o:["George Washington","Thomas Jefferson","James Madison","Andrew Jackson"], a:1, exp:"独立宣言の起草者であり、1803年のルイジアナ買収で国土を倍増させたのは第3代大統領トーマス・ジェファソンです[cite: 1]。"},
  {id:26, cat:"歴史・人物と年代", type:"人物特定（第4代大統領）", q:"Which 4th U.S. President is known as the 'Father of the Constitution' and led the nation during the War of 1812?", o:["James Madison","Thomas Jefferson","John Adams","James Monroe"], a:0, exp:"「憲法の父」と呼ばれ、米英戦争を指導したのは第4代大統領ジェームズ・マディソンです[cite: 1]。"},
  {id:27, cat:"歴史・人物と年代", type:"人物特定（第26代大統領）", q:"Which 26th U.S. President was the youngest to take office, promoted the 'Square Deal,' and supported the Panama Canal?", o:["Woodrow Wilson","Franklin D. Roosevelt","Theodore Roosevelt","Harry S. Truman"], a:2, exp:"最も若くして大統領に就任し、スクエア・ディールや国立公園創設を進めたのは第26代セオドア・ルーズベルトです[cite: 1]。"},
  {id:28, cat:"歴史・人物と年代", type:"人物特定（第28代大統領）", q:"Which 28th U.S. President led the United States during World War I and proposed the League of Nations?", o:["Theodore Roosevelt","Woodrow Wilson","Franklin D. Roosevelt","Dwight D. Eisenhower"], a:1, exp:"第一次世界大戦を指導し、国際連盟の設立を提唱したのは第28代ウッドロウ・ウィルソンです[cite: 1]。"},
  {id:29, cat:"歴史・人物と年代", type:"人物特定（第32代大統領）", q:"Which 32nd U.S. President was the only president elected to four terms and implemented the 'New Deal'?", o:["Theodore Roosevelt","Harry S. Truman","Franklin D. Roosevelt","John F. Kennedy"], a:2, exp:"唯一4期連続で選出され、大恐慌に対してニューディール政策を実施したのは第32代フランクリン・D・ルーズベルトです[cite: 1]。"},
  {id:30, cat:"歴史・人物と年代", type:"人物特定（第34代大統領）", q:"Which 34th U.S. President built the Interstate Highway System and warned against the 'military-industrial complex'?", o:["Harry S. Truman","Dwight D. Eisenhower","John F. Kennedy","Richard Nixon"], a:1, exp:"州間高速道路網を構築し、「軍産複合体」に警鐘を鳴らしたのは第34代ドワイト・D・アイゼンハワーです[cite: 1]。"},
  {id:31, cat:"歴史・人物と年代", type:"人物特定（史上初の辞任）", q:"Who was the first U.S. President in history to resign from office?", o:["Andrew Jackson","Richard Nixon","Ronald Reagan","Bill Clinton"], a:1, exp:"アメリカ大統領が辞任した初の事例はリチャード・ニクソンです[cite: 1]。"},
  {id:32, cat:"歴史・人物と年代", type:"年号（ジェームズタウン設立）", q:"In what year was the first permanent English colony established at Jamestown, Virginia?", o:["1492","1607","1620","1776"], a:1, exp:"1607年にバージニア州ジェームズタウンにイギリス最初の恒久的植民地が設立されました[cite: 1]。"},
  {id:33, cat:"歴史・人物と年代", type:"年号（メイフラワー号到着）", q:"In what year did the Pilgrims arrive at Plymouth, Massachusetts aboard the Mayflower?", o:["1607","1620","1765","1773"], a:1, exp:"ピルグリム・ファーザーズがメイフラワー号でプリマスに到着したのは1620年です[cite: 1]。"},
  {id:34, cat:"歴史・人物と年代", type:"年号（ボストン茶会事件）", q:"In what year did the Boston Tea Party take place in protest against the Tea Act?", o:["1765","1770","1773","1775"], a:2, exp:"ボストン茶会事件（Boston Tea Party）が起きたのは1773年です[cite: 1]。"},
  {id:35, cat:"歴史・人物と年代", type:"独立戦争の最終決戦", q:"Which 1781 battle was the final decisive battle of the American Revolutionary War?", o:["Battle of Lexington","Battle of Yorktown","Battle of Fort Sumter","Battle of Gettysburg"], a:1, exp:"1781年のヨークタウンの戦い（Battle of Yorktown）が独立戦争の最終決戦となりました[cite: 1]。"},
  {id:36, cat:"歴史・人物と年代", type:"年号（奴隷解放宣言）", q:"In what year did President Abraham Lincoln issue the Emancipation Proclamation during the Civil War?", o:["1861","1863","1865","1870"], a:1, exp:"リンカーン大統領が奴隷解放宣言を発布したのは1863年です[cite: 1]。"},
  {id:37, cat:"歴史・人物と年代", type:"年号（女性参政権・決勝過去問）", q:"In what year was the 19th Amendment ratified, granting women the right to vote in the United States?", o:["1870","1914","1920","1929"], a:2, exp:"決勝過去問にも出た通り、1920年に憲法修正第19条によって女性の参政権が認められました[cite: 1]。"},
  {id:38, cat:"歴史・人物と年代", type:"年号（世界恐慌）", q:"In what year did the Great Depression begin following the Wall Street stock market crash?", o:["1920","1929","1933","1941"], a:1, exp:"ウォール街の株価暴落に端を発する世界恐慌（Great Depression）は1929年に始まりました[cite: 1]。"},

let pool = [...QUIZ_DATA];
let idx = 0;
let answers = {};
let wrongSet = new Set();
let isShortMode = false;

function filterByCategory() {
  const cat = document.getElementById('catSelect').value;
  pool = cat === 'ALL' ? [...QUIZ_DATA] : QUIZ_DATA.filter(q => q.cat === cat);
  idx = 0;
  answers = {};
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  renderQuestion();
}

function shuffleQuestions() {
  pool = [...pool].sort(() => Math.random() - 0.5);
  idx = 0;
  answers = {};
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  renderQuestion();
}

function toggleAnswerMode() {
  isShortMode = !isShortMode;
  const btn = document.getElementById('modeToggleBtn');
  btn.textContent = isShortMode
    ? "💡 現在：決勝・短答モード (4択へ切替)"
    : "📝 現在：4択ボタンモード (短答へ切替)";
  btn.classList.toggle('active-mode', isShortMode);
  renderQuestion();
}

function retryWrong() {
  if (wrongSet.size === 0) return;
  pool = QUIZ_DATA.filter(q => wrongSet.has(q.id));
  idx = 0;
  answers = {};
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('resultArea').style.display = 'none';
  renderQuestion();
}

function speakCurrentQuestion() {
  if (!('speechSynthesis' in window)) {
    alert('お使いのブラウザは音声読み上げに対応していません。');
    return;
  }
  window.speechSynthesis.cancel();
  const q = pool[idx];
  const utter = new SpeechSynthesisUtterance(q.q);
  utter.lang = 'en-US';
  utter.rate = parseFloat(document.getElementById('rateSelect').value) || 1.0;
  window.speechSynthesis.speak(utter);
}

function calcStats() {
  let correct = 0, answeredCount = 0;
  pool.forEach((q, i) => {
    if (answers[i] !== undefined) {
      answeredCount++;
      if (answers[i] === q.a) correct++;
    }
  });
  return { correct, answeredCount };
}

function renderQuestion() {
  const q = pool[idx];
  const answered = answers[idx] !== undefined;
  const isBlind = document.getElementById('blindCheck').checked && !answered;

  document.getElementById('qProgress').textContent = `Q ${idx + 1} / ${pool.length} (#${q.id})`;
  document.getElementById('qCat').textContent = q.cat;
  document.getElementById('clueBadge').textContent = `テーマ: ${q.type}`;

  const st = calcStats();
  document.getElementById('scoreText').textContent = `Score: ${st.correct} / ${st.answeredCount}`;

  const qBox = document.getElementById('questionBox');
  if (isBlind) {
    qBox.innerHTML = `<div class="blind-mask" onclick="document.getElementById('blindCheck').checked=false; renderQuestion();">🎧 リスニング専念モード中（「🔊 英語で問題を聴く」を押して聴き取ってください。タップで英文を表示）</div>`;
  } else {
    qBox.textContent = q.q;
  }

  const optContainer = document.getElementById('optionsContainer');
  const shortContainer = document.getElementById('shortAnswerContainer');
  const fb = document.getElementById('feedbackBox');

  if (!isShortMode) {
    optContainer.style.display = 'grid';
    shortContainer.style.display = 'none';
    optContainer.innerHTML = '';
    ['A', 'B', 'C', 'D'].forEach((label, oIdx) => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = `(${label}) ${q.o[oIdx]}`;
      if (answered) {
        b.disabled = true;
        if (oIdx === q.a) b.classList.add('correct');
        else if (oIdx === answers[idx]) b.classList.add('wrong');
      } else {
        b.onclick = () => chooseOption(oIdx);
      }
      optContainer.appendChild(b);
    });
  } else {
    optContainer.style.display = 'none';
    shortContainer.style.display = 'block';
    document.getElementById('revealBtn').style.display = answered ? 'none' : 'inline-block';
    document.getElementById('selfJudgeBtns').style.display = 'none';
  }

  if (answered) {
    const isOk = answers[idx] === q.a;
    fb.style.display = 'block';
    fb.innerHTML = `<strong>${isOk ? '✅ 正解 (Correct)!' : '❌ 不正解・要復習'}</strong> — <strong>正解:</strong> (${['A','B','C','D'][q.a]}) ${q.o[q.a]}<br>${q.exp}`;
  } else {
    fb.style.display = 'none';
  }

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').textContent = idx === pool.length - 1 ? '結果を見る →' : '次の問題 →';

  const rBtn = document.getElementById('retryWrongBtn');
  rBtn.style.display = wrongSet.size > 0 ? 'inline-block' : 'none';
  rBtn.textContent = `🔥 弱点復習 (${wrongSet.size})`;

  if (document.getElementById('autoPlayCheck').checked && !answered) {
    speakCurrentQuestion();
  }
}

function chooseOption(oIdx) {
  const q = pool[idx];
  answers[idx] = oIdx;
  if (oIdx === q.a) wrongSet.delete(q.id);
  else wrongSet.add(q.id);
  renderQuestion();
}

function revealShortAnswer() {
  const q = pool[idx];
  const fb = document.getElementById('feedbackBox');
  fb.style.display = 'block';
  fb.innerHTML = `<strong>💡 正解:</strong> ${q.o[q.a]}<br>${q.exp}`;
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('selfJudgeBtns').style.display = 'flex';
}

function recordShortResult(isCorrect) {
  const q = pool[idx];
  answers[idx] = isCorrect ? q.a : -1;
  if (isCorrect) wrongSet.delete(q.id);
  else wrongSet.add(q.id);
  renderQuestion();
}

function prevQ() {
  if (idx > 0) { idx--; renderQuestion(); }
}

function nextQ() {
  if (idx < pool.length - 1) {
    idx++;
    renderQuestion();
  } else {
    showFinalScreen();
  }
}

function showFinalScreen() {
  window.speechSynthesis && window.speechSynthesis.cancel();
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('resultArea').style.display = 'block';
  const st = calcStats();
  const pct = pool.length ? Math.round((st.correct / pool.length) * 100) : 0;
  document.getElementById('finalScore').textContent = `${st.correct} / ${pool.length} (${pct}%)`;
  document.getElementById('finalMsg').textContent = wrongSet.size > 0
    ? `現在 ${wrongSet.size} 問が弱点リストに入っています。「間違えた問題だけ復習する」から反復しましょう！`
    : `全問クリアです！英語リスニングからの即答力もバッチリです！`;
  document.getElementById('retryEndBtn').style.display = wrongSet.size > 0 ? 'inline-block' : 'none';
}

filterByCategory();
</script>
</body>
</html>
